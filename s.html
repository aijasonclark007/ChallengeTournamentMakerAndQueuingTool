<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Schedule</title>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* stop iPhone Safari from enlarging text after a rotation */
html,body{margin:0;height:100%;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
iframe{border:0;width:100%;height:100%;display:block}
.msg{padding:40px 20px;text-align:center;color:#555}
#ann{position:fixed;left:10px;right:10px;top:10px;z-index:9;background:#FF9500;color:#1b1200;border-radius:14px;padding:11px 14px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:none}</style>
</head>
<body>
<div id="ann" onclick="this.style.display='none'"></div>
<div id="m" class="msg">Loading the schedule...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('s'), m = document.getElementById('m');
  if (!slug) { m.textContent = 'This link is missing its schedule code.'; return; }
  try {
    const row = await Platform.getPublicSchedule(slug);
    if (!row) { m.textContent = 'This schedule was not found. The organizer may have removed it.'; return; }
    document.title = row.name + ' - Game Schedule';
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-popups');   // runs the name search, nothing else
    f.srcdoc = row.html;
    m.remove(); document.body.appendChild(f);
    // live data: scores come as "what changed since last time" (a full copy every 2 minutes in case a game was reset); at most one refresh every 5 seconds; nothing while the tab is hidden
    let book = {}, cursor = 0, lastFull = 0, lastRun = 0, tmr = null, delta = true, lastMv = [];
    const post = () => { if (f.contentWindow) f.contentWindow.postMessage({ t: 'live', scores: Object.keys(book).map(k => book[k]), moves: lastMv }, '*'); };
    const fetchScores = async () => {
      const full = !cursor || !delta || Date.now() - lastFull > 120000;
      if (delta) { try { const rows = await Platform.getLiveScoresSince(slug, full ? null : new Date(cursor).toISOString()); if (full) { book = {}; lastFull = Date.now(); } rows.forEach(r => { book[r.match_id] = r; cursor = Math.max(cursor, new Date(r.updated_at).getTime() || 0); }); if (full && !rows.length) cursor = 1; return; } catch (e) { delta = false; } }   // step 18 not run: ask for everything
      const all = await Platform.getLiveScores(slug); book = {}; all.forEach(r => { book[r.match_id] = r; });
    };
    const doPush = async () => { lastRun = Date.now(); try { const a = await Platform.getAnnouncement(slug).catch(() => null), b = document.getElementById('ann'); if (a) { b.textContent = a.body; if (b.dataset.at !== a.updated_at) { b.dataset.at = a.updated_at; b.style.display = 'block'; } } else { b.style.display = 'none'; b.dataset.at = ''; } } catch (e) {} try { await fetchScores(); try { lastMv = await Platform.getCourtMoves(slug); } catch (e) {} post(); } catch (e) {} };
    const push = () => { if (document.hidden) return; const wait = 5000 - (Date.now() - lastRun); if (wait <= 0) return doPush(); if (!tmr) tmr = setTimeout(() => { tmr = null; doPush(); }, wait); };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) push(); });
    let lastHtml = row.html, lastVer = row.updated_at, light = true;      // light: ask for a tiny version stamp first, download the page only when it changed
    setInterval(async () => { if (document.hidden) return; try {
      if (light) { try { const v = await Platform.getScheduleVersion(slug); if (v && v === lastVer) return; if (v) lastVer = v; } catch (e) { light = false; } }   // step 16 not run: fall back to the old full download
      const r = await Platform.getPublicSchedule(slug); if (r && r.html) { lastVer = r.updated_at || lastVer; if (r.html !== lastHtml) { lastHtml = r.html; f.srcdoc = r.html; } } } catch (e) {} }, 45000);      // new times (running late, moved games) reach people who already have the page open
    f.addEventListener('load', () => { post(); push(); }); setInterval(push, 20000); try { Platform.liveChannel('slive-' + slug, () => push()); } catch (e) {}
  } catch (e) { m.textContent = 'Could not load the schedule: ' + e.message; }
})();
</script>
</body>
</html>
