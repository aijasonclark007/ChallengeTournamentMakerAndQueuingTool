<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Schedule</title>
<style>html,body{margin:0;height:100%;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
iframe{border:0;width:100%;height:100%;display:block}
.msg{padding:40px 20px;text-align:center;color:#555}</style>
</head>
<body>
<div id="m" class="msg">Loading the schedule...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('s'), m = document.getElementById('m');
  if (!slug) { m.textContent = 'This link is missing its schedule code.'; return; }
  try {
    const row = await Platform.getPublicSchedule(slug);
    if (!row) { m.textContent = 'This schedule was not found. The organizer may have removed it.'; return; }
    document.title = row.name + ' - Game Schedule';
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-popups');   // runs the name search, nothing else
    f.srcdoc = row.html;
    m.remove(); document.body.appendChild(f);
    const push = async () => { try { const sc = await Platform.getLiveScores(slug); if (f.contentWindow) f.contentWindow.postMessage({ t: 'live', scores: sc }, '*'); } catch (e) {} };
    f.addEventListener('load', push); setInterval(() => { if (!document.hidden) push(); }, 20000); try { Platform.liveChannel('slive-' + slug, () => push()); } catch (e) {}
  } catch (e) { m.textContent = 'Could not load the schedule: ' + e.message; }
})();
</script>
</body>
</html>
