<body>
<div class="wrap" id="root"></div>
<div id="ov"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
const P = window.Platform, cloud = !!(P && P.configured);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LEVELS = ['High', 'Mid', 'Low'], LV = { High: 3, Mid: 2, Low: 1 };
const MODES = [['any', 'Any level'], ['same', 'Same level'], ['hm', 'High + Mid'], ['ml', 'Mid + Low']];
const MODE_HELP = { any: 'The next four in line play, with the teams balanced by level.', same: 'Four players of the same level play together.',
  hm: 'Each team gets one High and one Mid player.', ml: 'Each team gets one Mid and one Low player.' };
const MAX_COURTS = 12;
const SAMPLE_NAMES = ['Aira','Bryan','Carlo','Dessa','Enzo','Faye','Gio','Hannah','Ian','Jasmine','Kyle','Lara','Marco','Nina','Oscar','Pia','Quinn','Rico','Sofia','Tomas','Uma','Vince','Wendy','Xavi','Yna','Zed','Andre','Bea','Carl','Dani','Ella','Fidel','Gwen','Harry','Iris','Jed','Kaye','Leo','Mica','Nico','Olive','Paolo','Rhea','Sam','Tina','Ulric','Vera','Wes','Alex','Bianca','Chris','Dara','Elmer','Flor','Gab','Hazel','Ivan','Joy','Ken','Lia'];
function sampleList(n) {                                  // random names, levels spread evenly so every pairing mode has players to work with
  const names = SAMPLE_NAMES.slice().sort(() => Math.random() - 0.5), have = new Set(view.players.map(p => p.name.toLowerCase())), out = [];
  for (const nm of names) { if (out.length >= n) break; if (!have.has(nm.toLowerCase())) out.push({ name: nm, level: LEVELS[out.length % 3], status: 'in', sample: true }); }
  return out.sort(() => Math.random() - 0.5);
}

// ---------------------------------------------------------------- state & rules
const blank = () => ({ v: 1, courts: [{ id: uid(), name: 'Court 1' }], players: [], matches: [], mode: 'any', seeds: {}, fees: { courtCost: 0, shuttles: 0, shuttlePrice: 0, mode: 'equal', perGame: 0 } });
const active = s => s.matches.filter(m => !m.end);
const onCourtIds = s => new Set(active(s).flatMap(m => m.t1.concat(m.t2)));
const byId = (s, id) => s.players.find(p => p.id === id);
function queueOrder(s) {                       // fewest games first, then whoever has waited longest
  const busy = onCourtIds(s);
  const base = s.players.filter(p => p.status === 'in' && !busy.has(p.id)).sort((a, b) => (a.games - b.games) || (a.since - b.since));
  if (!s.manual || !s.manual.length) return base;
  // the organizer moved people by hand: keep that order, new arrivals join at the end
  const idx = new Map(s.manual.map((id, i) => [id, i]));
  return base.filter(p => idx.has(p.id)).sort((a, b) => idx.get(a.id) - idx.get(b.id)).concat(base.filter(p => !idx.has(p.id)));
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const sumLv = t => t.reduce((n, p) => n + LV[p.level], 0);
function splitsFor(four, mode) {              // the three ways to make two teams of two, best-balanced first
  const [a, b, c, d] = four, all = [[[a, b], [c, d]], [[a, c], [b, d]], [[a, d], [b, c]]];
  let ok = all;
  if (mode === 'hm' || mode === 'ml') {
    const hi = mode === 'hm' ? 'High' : 'Mid', lo = mode === 'hm' ? 'Mid' : 'Low';
    const mixed = all.filter(sp => sp.every(t => t.some(p => p.level === hi) && t.some(p => p.level === lo)));
    if (mixed.length) ok = mixed;
  }
  return ok.slice().sort((x, y) => Math.abs(sumLv(x[0]) - sumLv(x[1])) - Math.abs(sumLv(y[0]) - sumLv(y[1])));
}
function pickFour(q, mode, rnd) {              // rnd = null for the default pick, a random generator for reshuffles
  const take = (arr, n) => rnd ? [arr[0]].concat(shuf(arr.slice(1, 8), rnd)).slice(0, n) : arr.slice(0, n);
  if (mode === 'any') return q.length >= 4 ? take(q, 4) : null;
  if (mode === 'same') {
    for (const p of q) { const g = q.filter(x => x.level === p.level); if (g.length >= 4) return take(g, 4); }
    return null;
  }
  const hi = mode === 'hm' ? 'High' : 'Mid', lo = mode === 'hm' ? 'Mid' : 'Low', A = q.filter(p => p.level === hi), B = q.filter(p => p.level === lo);
  if (A.length >= 2 && B.length >= 2) return (rnd ? shuf(A.slice(0, 4), rnd).slice(0, 2).concat(shuf(B.slice(0, 4), rnd).slice(0, 2)) : [A[0], A[1], B[0], B[1]]);
  const both = q.filter(p => p.level === hi || p.level === lo);
  return both.length >= 4 ? take(both, 4) : null;
}
function shuf(a, rnd) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function propose(s, taken, seed, salt) {       // a suggested game for one empty court; shuffles are shared so every phone agrees
  const q = queueOrder(s).filter(p => !taken.has(p.id));
  const base = pickFour(q, s.mode, null); if (!base) return null;
  const v = splitsFor(base, s.mode);
  if (seed < v.length) return { t1: v[seed][0], t2: v[seed][1] };
  const rnd = mulberry(seed * 7919 + salt), four = pickFour(q, s.mode, rnd) || base, v2 = splitsFor(four, s.mode), sp = v2[Math.floor(rnd() * v2.length)];
  return { t1: sp[0], t2: sp[1] };
}
function proposals(s) {
  const taken = new Set(), out = {};
  s.courts.forEach((c, i) => {
    if (active(s).some(m => m.court === c.id)) return;
    const pr = propose(s, taken, s.seeds[c.id] || 0, i + 1);
    if (pr) { out[c.id] = pr; pr.t1.concat(pr.t2).forEach(p => taken.add(p.id)); }
  });
  return out;
}

// every change is a small function on a copy of the state (so two phones can both change things safely)
const M = {
  addPlayers(list) { return s => { list.forEach(x => { const name = String(x.name || '').trim().slice(0, 40); if (!name) return;
      if (s.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return;
      s.players.push({ id: uid(), name, level: LEVELS.includes(x.level) ? x.level : 'Mid', status: x.status || 'out', since: Date.now(), games: 0, paid: false, sample: !!x.sample }); }); }; },
  removeSamples: () => s => { const busy = onCourtIds(s); s.players = s.players.filter(p => !p.sample || busy.has(p.id)); },
  setLevel: (id, level) => s => { const p = byId(s, id); if (p && LEVELS.includes(level)) p.level = level; },
  setStatus: (id, st) => s => { const p = byId(s, id); if (!p) return; if (onCourtIds(s).has(id)) throw new Error(p.name + ' is on a court.');

  const pp = $('#ppool'); if (pp) pp.onclick = openPool;
  const ps = $('#psave'); if (ps) ps.onclick = async () => { if (backend.type !== 'cloud') return toast('Sign in to save players to your account.'); if (!view.players.length) return toast('No players yet.');
    try { for (const p of view.players) await P.savePlayerToPool(p.name, p.level); toast('Saved ' + view.players.length + ' players to your pool.'); } catch (e) { toast(e.message); } };
  // fees
  $$('[data-fee]').forEach(i => i.onchange = () => act(M.fee(i.dataset.fee, parseFloat(i.value) || 0), true));
  $$('[data-rl]').forEach(b => b.onclick = () => { rankLv = b.dataset.rl; render(); });
  $$('[data-fm]').forEach(b => b.onclick = () => act(M.fee('mode', b.dataset.fm)));
  feeOutRender();
  const nt = $('#night'); if (nt) nt.onclick = () => { if (confirm('Reset everyone\'s games and payments for a fresh queuing? Players stay on the list.')) act(M.newNight()); };
  // cloud session bar
  const sess = $('#sess'); if (sess) sess.onchange = () => openSession(sess.value);
  const sn = $('#sNew'); if (sn) sn.onclick = () => modal('New queuing', '<label class="lab" for="nn">Name</label><input id="nn" type="text" maxlength="60" value="' + esc(new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })) + '">', [{ label: 'Create', fn: async sh => { const name = sh.querySelector('#nn').value.trim() || 'Session'; await createSession(name, blank()); } }]);
  const sj = $('#sJoin'); if (sj) sj.onclick = () => modal('Join with a code', '<div class="small mute">Ask the organizer for their 6-character code.</div><input id="jc" type="text" maxlength="6" style="margin-top:8px;text-transform:uppercase;letter-spacing:.2em;font-size:20px;text-align:center" placeholder="ABC123">',
    [{ label: 'Join', fn: async sh => { try { const id = await P.joinQueueSession(sh.querySelector('#jc').value); await refreshSessions(); await openSession(id); toast('Joined!'); } catch (e) { toast(e.message); } } }]);
  const sh = $('#sShare'); if (sh) sh.onclick = () => { const cur = sessions.find(x => x.id === backend.id); if (!cur) return;
    const link = location.origin + location.pathname.replace(/[^/]*$/, '') + 'queue.html?live=' + cur.public_code;
    modal('Share this queuing', '<div class="small mute">Other organizers: sign in, open the Queuing Tool, tap <b>Join with code</b>, and enter</div><div class="code" style="margin:8px 0 14px">' + esc(cur.join_code) + '</div>' +
      '<div class="small mute">Live board for players (view only, no sign-in)</div><input id="lk" type="text" readonly value="' + esc(link) + '" style="margin-top:6px">', [{ label: 'Copy board link', cls: 'ghost', fn: () => { const i = $('#lk'); i.select(); try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand('copy'); } toast('Link copied'); return false; } }]); };
  const sd = $('#sDel'); if (sd) sd.onclick = async () => { if (!confirm('Delete this queuing session and all its data for everyone?')) return; try { await P.deleteQueueSession(backend.id); await refreshSessions(); if (sessions.length) await openSession(sessions[0].id); else await createSession('My first queuing', blank()); } catch (e) { toast(e.message); } };
  const gm = $('#gMove'); if (gm) gm.onclick = async () => { try { const g = loadGuest(); g.players.forEach(p => { p.status = 'out'; }); g.matches = []; await createSession('Preview session', g); localStorage.setItem('queue.guest.moved', '1'); toast('Saved to your account.'); } catch (e) { toast(e.message); } };
  const gs = $('#gSkip'); if (gs) gs.onclick = () => { try { localStorage.setItem('queue.guest.moved', '1'); } catch (e) {} render(); };
}
async function openPool() {
  let pool = []; try { pool = await P.fetchPlayerPool(); } catch (e) { return toast(e.message); }
  const have = new Set(view.players.map(p => p.name.toLowerCase())), list = pool.filter(p => !have.has(p.name.toLowerCase()));
  modal('My saved players', list.length ? '<div class="small mute">Tick the players who showed up tonight.</div><div style="margin-top:8px">' + list.map((p, i) => '<label class="q" style="cursor:pointer"><input type="checkbox" data-pi="' + i + '" checked style="width:20px;height:20px"><div class="grow"><b>' + esc(p.name) + '</b></div><span class="chip ' + p.level + '">' + p.level + '</span></label>').join('') + '</div>'
    : '<div class="mute">' + (pool.length ? 'Everyone in your pool is already on tonight\'s list.' : 'Your pool is empty. Add players, then use Save all to my pool.') + '</div>',
    list.length ? [{ label: 'Add selected', fn: sh => { const pick = [...sh.querySelectorAll('[data-pi]')].filter(c => c.checked).map(c => list[+c.dataset.pi]); if (!pick.length) return; act(M.addPlayers(pick.map(p => ({ name: p.name, level: p.level, status: 'in' })))); } }] : []);
}

// ---------------------------------------------------------------- sessions (cloud)
async function refreshSessions() { sessions = await P.listQueueSessions(); }
async function openSession(id) {
  if (pending.length) await flush();
  const row = await P.getQueueSession(id); if (!row) { toast('That queuing session was not found.'); return; }
  backend = { type: 'cloud', id }; server = { state: row.state && row.state.courts ? row.state : blank(), version: row.version }; pending = []; recompute();
  try { localStorage.setItem('queue.sid', id); } catch (e) {}
  syncState = 'live'; watch(); render();
}
async function createSession(name, state) {
  const row = await P.createQueueSession(name, state); await refreshSessions(); await openSession(row.id);
}
async function startCloud() {
  try {
    await refreshSessions();
    const last = (() => { try { return localStorage.getItem('queue.sid'); } catch (e) { return null; } })();
    const pick = sessions.find(x => x.id === last) || sessions[0];
    if (pick) await openSession(pick.id); else await createSession('My first queuing', blank());
  } catch (e) { startGuest(); toast('Could not reach your account: ' + e.message); }
}
function startGuest() {
  if (unsub) unsub(); unsub = null; clearInterval(pollTimer);
  backend = { type: 'guest' }; pending = []; server = { state: loadGuest(), version: 0 }; syncState = 'guest'; recompute(); render();
}

// ---------------------------------------------------------------- public live board (?live=CODE)
const liveCode = new URLSearchParams(location.search).get('live');
// ----- "you're up next" alerts on the live board (needs the page open: it plays a sound, vibrates and shows a notification)
let meName = null, meLast = null, meSig = '';
try { meName = localStorage.getItem('queue.me.' + liveCode); } catch (e) {}
function alertMe(title, body) {
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { const c = new AC(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.type = 'sine'; o.frequency.setValueAtTime(660, c.currentTime); o.frequency.setValueAtTime(880, c.currentTime + .15); o.frequency.setValueAtTime(1100, c.currentTime + .3); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .7); o.start(); o.stop(c.currentTime + .7); } } catch (e) {}
  buzz([250, 120, 250, 120, 400]);
  try { if (window.Notification && Notification.permission === 'granted') new Notification(title, { body, tag: 'queue-me' }); } catch (e) {}
  toast(title + ' ' + body); const t0 = document.title; let n = 0; const iv = setInterval(() => { document.title = n++ % 2 ? t0 : '🔔 ' + title; if (n > 12) { clearInterval(iv); document.title = t0; } }, 700);
}
function renderMe(s, q, courtOf) {
  const box = $('#me'); if (!box) return;
  const players = s.players.slice().sort((a, b) => a.name.localeCompare(b.name));
  const mine = meName && players.find(p => p.name === meName);
  let status = '', key = 'none';
  if (mine) {
    const m = active(s).find(x => x.t1.concat(x.t2).includes(mine.id)), pos = q.findIndex(x => x.id === mine.id);
    if (m) { key = 'playing'; status = '🏸 Your game is on <b>' + esc(courtOf(m.court)) + '</b>. Go now!'; if (meLast && meLast !== 'playing') alertMe('Your game is ready!', 'Head to ' + courtOf(m.court) + '.'); }
    else if (pos >= 0 && pos < 4) { key = 'next'; status = '⏳ You are <b>up next</b> (#' + (pos + 1) + '). Get ready!'; if (meLast && meLast !== 'next') alertMe("You're up next!", 'Get ready, you are #' + (pos + 1) + ' in line.'); }
    else if (pos >= 0) { key = 'wait'; status = 'You are <b>#' + (pos + 1) + '</b> in the queue.'; }
    else { key = 'off'; status = 'You are not in the queue right now.'; }
    meLast = key;
  }
  const sig = (mine ? 'm:' + mine.name + status : 'p:' + players.map(p => p.name).join('|'));
  if (sig === meSig || ($('#meSel') && document.activeElement === $('#meSel'))) return; meSig = sig;
  box.innerHTML = mine ? '<div class="card mecard ' + key + '"><div class="grow">' + esc(mine.name) + '<div>' + status + '</div></div><button class="btn ghost sm" id="meOff">Stop</button></div>'
    : players.length ? '<div class="card"><b>🔔 Get a heads-up when you are up</b><div class="small mute" style="margin:2px 0 8px">Pick your name. This page plays a sound and vibrates when you are next. Keep it open on your phone.</div><div class="row"><select id="meSel" class="grow">' + players.map(p => '<option>' + esc(p.name) + '</option>').join('') + '</select><button class="btn" id="meGo">Notify me</button></div></div>' : '';
  const go = $('#meGo'); if (go) go.onclick = async () => { meName = $('#meSel').value; try { localStorage.setItem('queue.me.' + liveCode, meName); } catch (e) {} meLast = null; meSig = ''; try { if (window.Notification && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {} renderMe(view, queueOrder(view), id => (view.courts.find(c => c.id === id) || { name: 'a court' }).name); };
  const off = $('#meOff'); if (off) off.onclick = () => { meName = null; meLast = null; meSig = ''; try { localStorage.removeItem('queue.me.' + liveCode); } catch (e) {} renderMe(view, queueOrder(view), id => (view.courts.find(c => c.id === id) || { name: 'a court' }).name); };
}
function liveRender(row) {
  const s = row.state && row.state.courts ? row.state : blank(); view = s;
  renderMe(s, queueOrder(s), id => (s.courts.find(c => c.id === id) || { name: 'a court' }).name);
  const q = queueOrder(s), name = id => { const p = byId(s, id); return p ? p.name : '?'; };
  document.title = row.name + ' · Live board';
  const cards = s.courts.map(c => { const m = active(s).find(x => x.court === c.id);
    return '<div class="court ' + (m ? 'busy' : 'free') + '"><header><b>' + esc(c.name) + '</b>' + (m ? '<span class="timer" data-start="' + m.start + '">' + fmtT(Date.now() - m.start) + '</span>' : '<span class="mute">Free</span>') + '</header>' +
      (m ? '<div class="teams"><div class="team">' + m.t1.map(id => '<span>' + esc(name(id)) + '</span>').join('') + '</div><span class="vs">VS</span><div class="team">' + m.t2.map(id => '<span>' + esc(name(id)) + '</span>').join('') + '</div></div>' : '<div class="mute">Waiting for the next game</div>') + '</div>'; }).join('');
  $('#root').innerHTML = '<h1>' + esc(row.name) + '</h1><div class="small mute">Live board · updates automatically</div><h2>On court</h2><div class="grid">' + cards + '</div><h2>Up next</h2><div class="card">' +
    (q.length ? q.slice(0, 12).map((p, i) => '<div class="q"><span class="n">' + (i + 1) + '</span><div class="grow"><b>' + esc(p.name) + '</b></div><span class="small mute">' + p.games + ' game' + (p.games === 1 ? '' : 's') + '</span></div>').join('') : '<div class="mute">No one is waiting.</div>') + '</div>';
}
async function startLive() {
  document.body.classList.add('live'); $('#root').innerHTML = '<h1>Loading…</h1>';
  const tick = async () => { try { const row = await P.getPublicQueue(liveCode); if (row) liveRender(row); else $('#root').innerHTML = '<h1>Board not found</h1><div class="mute">The link may be wrong or the queuing session was deleted.</div>'; } catch (e) { /* keep showing the last board */ } };
  const meBox = document.createElement('div'); meBox.id = 'me'; $('#root').before(meBox);
  await tick(); setInterval(tick, 20000);                       // safety net; the real updates arrive instantly below
  try { P.liveChannel('qlive-' + liveCode, () => tick()); } catch (e) {}
}

// ---------------------------------------------------------------- go
setInterval(() => $$('.timer[data-start]').forEach(t => { t.textContent = fmtT(Date.now() - +t.dataset.start); }), 1000);
setInterval(() => { if (!liveCode && tab === 'courts' && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) && !$('#ov').classList.contains('on')) { const q = $('#tabbody'); if (q) { /* refresh waiting minutes */ render(); } } }, 60000);
(async function init() {
  if (liveCode) { if (!cloud) { $('#root').innerHTML = '<h1>Live board</h1><div class="mute">The cloud is not connected.</div>'; return; } await P.whenReady(); return startLive(); }
  if (!cloud) return startGuest();
  await P.whenReady();
  P.onAuth(user => { if (user) startCloud(); else startGuest(); });
})();
</script>
</body>
</html>
