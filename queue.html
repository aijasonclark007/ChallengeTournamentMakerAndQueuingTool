<script>
const P = window.Platform, cloud = !!(P && P.configured);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LEVELS = ['High', 'Mid', 'Low'], LV = { High: 3, Mid: 2, Low: 1 };
const MODES = [['any', 'Any level'], ['same', 'Same level'], ['hm', 'High + Mid'], ['ml', 'Mid + Low']];
const MODE_HELP = { any: 'The next four in line play, with the teams balanced by level.', same: 'Four players of the same level play together.',
  hm: 'Each team gets one High and one Mid player.', ml: 'Each team gets one Mid and one Low player.' };
const MAX_COURTS = 12;
const SAMPLE_NAMES = ['Aira','Bryan','Carlo','Dessa','Enzo','Faye','Gio','Hannah','Ian','Jasmine','Kyle','Lara','Marco','Nina','Oscar','Pia','Quinn','Rico','Sofia','Tomas','Uma','Vince','Wendy','Xavi','Yna','Zed','Andre','Bea','Carl','Dani','Ella','Fidel','Gwen','Harry','Iris','Jed','Kaye','Leo','Mica','Nico','Olive','Paolo','Rhea','Sam','Tina','Ulric','Vera','Wes','Alex','Bianca','Chris','Dara','Elmer','Flor','Gab','Hazel','Ivan','Joy','Ken','Lia'];
function sampleList(n) {                                  // random names, levels spread evenly so every pairing mode has players to work with
  const names = SAMPLE_NAMES.slice().sort(() => Math.random() - 0.5), have = new Set(view.players.map(p => p.name.toLowerCase())), out = [];
  for (const nm of names) { if (out.length >= n) break; if (!have.has(nm.toLowerCase())) out.push({ name: nm, level: LEVELS[out.length % 3], status: 'in', sample: true }); }
  return out.sort(() => Math.random() - 0.5);
}

    '<div class="row" style="margin-top:12px;position:sticky;bottom:-1px;background:#fff;padding:8px 0;gap:8px"><button type="button" class="btn ghost sm" id="mgBack">‹ Back</button><span class="grow"></span><button type="button" id="mgDel" class="btn solidred"></button></div>', []);

  const upd = () => { const n = picked().length; sh.querySelector('#mgCount').textContent = n + ' to delete' + (shown().length < rows().length ? ' · showing ' + shown().length : ''); const b = sh.querySelector('#mgDel'); b.textContent = n ? 'Delete ' + n + ' player' + (n === 1 ? '' : 's') : 'Nothing ticked'; b.disabled = !n; };
  sh.querySelector('#mgQ').oninput = e => { const t = e.target.value.trim().toLowerCase(); rows().forEach(r => { r.hidden = !!t && !r.dataset.name.includes(t); }); upd(); };
  sh.onchange = e => { if (e.target.matches('[data-di]')) upd(); };
  sh.onclick = e => {
    if (e.target.closest('#mgAll')) { shown().forEach(r => { r.querySelector('input').checked = true; }); upd(); }
    else if (e.target.closest('#mgNone')) { shown().forEach(r => { r.querySelector('input').checked = false; }); upd(); }
    else if (e.target.closest('#mgBack')) openPool();
    else if (e.target.closest('#mgDel')) {
      const del = picked().map(r => list[+r.querySelector('input').dataset.di]); if (!del.length) return;
      modal('Delete ' + del.length + ' saved player' + (del.length === 1 ? '' : 's') + '?', '<div class="small" style="max-height:30vh;overflow:auto">' + del.map(p => esc(p.name)).join(', ') + '</div><div class="small mute" style="margin-top:8px">They are removed from your saved list for good. You can add them again later. Tonight\'s queue is not changed.</div>',
        [{ label: 'Delete ' + del.length, cls: 'solidred', fn: async () => { try { for (const p of del) await P.removePlayerFromPool(p.id); toast('Deleted ' + del.length + ' saved player' + (del.length === 1 ? '' : 's')); } catch (x) { toast(x.message); } setTimeout(openPool, 250); } }]);
    }
  };
  upd();
}
async function openPool() {
  let pool = []; try { pool = await P.fetchPlayerPool(); } catch (e) { return toast(e.message); }
  const have = new Set(view.players.map(p => p.name.toLowerCase())), list = pool.filter(p => !have.has(p.name.toLowerCase()));
  modal('My saved players', '<div class="row" style="margin:0 0 8px"><button class="btn ghost sm" id="poolPaste" type="button">Paste a list\u2026</button>' + (pool.length ? '<button class="btn ghost sm" id="poolManage" type="button">Delete players\u2026</button>' : '') + '</div>' + (list.length ? '<div class="small mute">Tick the players who showed up tonight.</div><div class="poolbar"><input id="poolQ" type="search" placeholder="Search players" autocomplete="off"><div class="row small"><span id="poolCount" class="mute"></span><span class="grow"></span><button type="button" class="linkbtn" id="poolAll">Select shown</button><button type="button" class="linkbtn" id="poolNone">Clear shown</button></div></div><div id="poolList">' + list.map((p, i) => '<label class="q prow" data-name="' + esc(p.name.toLowerCase()) + '" style="cursor:pointer"><input type="checkbox" data-pi="' + i + '" checked style="width:20px;height:20px"><div class="grow"><b>' + esc(p.name) + '</b></div><span class="chip ' + p.level + '">' + p.level + '</span></label>').join('') + '</div>'
    : '<div class="mute">' + (pool.length ? 'Everyone in your pool is already on tonight\'s list.' : 'Your pool is empty. Add players, then use Save all to my pool.') + '</div>'),
    list.length ? [{ label: 'Add selected', fn: sh => { const pick = [...sh.querySelectorAll('[data-pi]')].filter(c => c.checked).map(c => list[+c.dataset.pi]); if (!pick.length) return; act(M.addPlayers(pick.map(p => ({ name: p.name, level: p.level, status: 'in' })))); } }] : []);
  const sh = $('#sheet'), pb = sh.querySelector('#poolPaste'); if (pb) pb.onclick = () => openPaste(pool);
  const mg = sh.querySelector('#poolManage'); if (mg) mg.onclick = () => openManage(pool);
  const q = sh.querySelector('#poolQ'); if (!q) return;
  const rows = () => [...sh.querySelectorAll('.prow')], shown = () => rows().filter(r => !r.hidden);
  const upd = () => { const n = rows().filter(r => r.querySelector('input').checked).length, v = shown().length; sh.querySelector('#poolCount').textContent = n + ' selected' + (v < rows().length ? ' · showing ' + v : ''); let e = sh.querySelector('#poolNone2'); if (!v) { if (!e) { e = document.createElement('div'); e.id = 'poolNone2'; e.className = 'mute'; e.style.padding = '14px 4px'; e.textContent = 'No saved player matches that search.'; sh.querySelector('#poolList').appendChild(e); } } else if (e) e.remove(); };
  q.oninput = () => { const t = q.value.trim().toLowerCase(); rows().forEach(r => { r.hidden = !!t && !r.dataset.name.includes(t); }); upd(); };
  sh.onchange = e => { if (e.target.matches('[data-pi]')) upd(); };
  sh.querySelector('#poolAll').onclick = () => { shown().forEach(r => { r.querySelector('input').checked = true; }); upd(); };
  sh.querySelector('#poolNone').onclick = () => { shown().forEach(r => { r.querySelector('input').checked = false; }); upd(); };
  upd(); setTimeout(() => { try { q.focus({ preventScroll: true }); } catch (x) {} }, 350);
}

// ---------------------------------------------------------------- sessions (cloud)
let allSessions = [];
const sportOfRow = x => x.sport === 'pickleball' ? 'pickleball' : 'badminton';
async function refreshSessions() { allSessions = await P.listQueueSessions(); sessions = allSessions.filter(x => sportOfRow(x) === Sports.current()); }
async function openSession(id) {
  if (pending.length) await flush();
  const row = await P.getQueueSession(id); if (!row) { toast('That queuing session was not found.'); return; }
  backend = { type: 'cloud', id }; server = { state: row.state && row.state.courts ? row.state : blank(), version: row.version }; pending = []; recompute();
  try { localStorage.setItem(sidKey(), id); } catch (e) {}
  syncState = 'live'; watch(); render();
}
async function createSession(name, state) {
  const row = await P.createQueueSession(name, state); await refreshSessions(); await openSession(row.id);
}
async function startCloud() {
  try {
    await refreshSessions();
    const last = (() => { try { return localStorage.getItem(sidKey()); } catch (e) { return null; } })();
    const pick = sessions.find(x => x.id === last) || sessions[0];
    if (pick) await openSession(pick.id); else await createSession('My first queuing', blank());
  } catch (e) { startGuest(); toast('Could not reach your account: ' + e.message); }
}
function startGuest() {
  if (unsub) unsub(); unsub = null; clearInterval(pollTimer);
  backend = { type: 'guest' }; pending = []; server = { state: loadGuest(), version: 0 }; syncState = 'guest'; recompute(); render();
}

// ---------------------------------------------------------------- public live board (?live=CODE)
const liveCode = new URLSearchParams(location.search).get('live');
// ----- "you're up next" alerts on the live board (needs the page open: it plays a sound, vibrates and shows a notification)
let meName = null, meLast = null, meSig = '';
try { meName = localStorage.getItem('queue.me.' + liveCode); } catch (e) {}
function alertMe(title, body) {
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { const c = new AC(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.type = 'sine'; o.frequency.setValueAtTime(660, c.currentTime); o.frequency.setValueAtTime(880, c.currentTime + .15); o.frequency.setValueAtTime(1100, c.currentTime + .3); g.gain.setValueAtTime(.2, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .7); o.start(); o.stop(c.currentTime + .7); } } catch (e) {}
  buzz([250, 120, 250, 120, 400]);
  try { if (window.Notification && Notification.permission === 'granted') new Notification(title, { body, tag: 'queue-me' }); } catch (e) {}
  toast(title + ' ' + body); const t0 = document.title; let n = 0; const iv = setInterval(() => { document.title = n++ % 2 ? t0 : '🔔 ' + title; if (n > 12) { clearInterval(iv); document.title = t0; } }, 700);
}
function renderMe(s, q, courtOf) {
  const box = $('#me'); if (!box) return;
  const players = s.players.slice().sort((a, b) => a.name.localeCompare(b.name));
  const mine = meName && players.find(p => p.name === meName);
  let status = '', key = 'none';
  if (mine) {
    const m = active(s).find(x => x.t1.concat(x.t2).includes(mine.id)), pos = q.findIndex(x => x.id === mine.id);
    if (m) { key = 'playing'; status = spOf(view).icon + ' Your game is on <b>' + esc(courtOf(m.court)) + '</b>. Go now!'; if (meLast && meLast !== 'playing') alertMe('Your game is ready!', 'Head to ' + courtOf(m.court) + '.'); }
    else if (pos >= 0 && pos < 4) { key = 'next'; status = '⏳ You are <b>up next</b> (#' + (pos + 1) + '). Get ready!'; if (meLast && meLast !== 'next') alertMe("You're up next!", 'Get ready, you are #' + (pos + 1) + ' in line.'); }
    else if (pos >= 0) { key = 'wait'; status = 'You are <b>#' + (pos + 1) + '</b> in the queue.'; }
    else { key = 'off'; status = 'You are not in the queue right now.'; }
    meLast = key;
  }
  const sig = (mine ? 'm:' + mine.name + status : 'p:' + players.map(p => p.name).join('|'));
  if (sig === meSig || ($('#meSel') && document.activeElement === $('#meSel'))) return; meSig = sig;
  box.innerHTML = mine ? '<div class="card mecard ' + key + '"><div class="grow">' + esc(mine.name) + '<div>' + status + '</div></div><button class="btn ghost sm" id="meOff">Stop</button></div>'
    : players.length ? '<div class="card"><b>🔔 Get a heads-up when you are up</b><div class="small mute" style="margin:2px 0 8px">Pick your name. This page plays a sound and vibrates when you are next. Keep it open on your phone.</div><div class="row"><select id="meSel" class="grow">' + players.map(p => '<option>' + esc(p.name) + '</option>').join('') + '</select><button class="btn" id="meGo">Notify me</button></div></div>' : '';
  const go = $('#meGo'); if (go) go.onclick = async () => { meName = $('#meSel').value; try { localStorage.setItem('queue.me.' + liveCode, meName); } catch (e) {} meLast = null; meSig = ''; try { if (window.Notification && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) {} renderMe(view, queueOrder(view), id => (view.courts.find(c => c.id === id) || { name: 'a court' }).name); };
  const off = $('#meOff'); if (off) off.onclick = () => { meName = null; meLast = null; meSig = ''; try { localStorage.removeItem('queue.me.' + liveCode); } catch (e) {} renderMe(view, queueOrder(view), id => (view.courts.find(c => c.id === id) || { name: 'a court' }).name); };
}
function liveRender(row) {
  const s = row.state && row.state.courts ? row.state : blank(); view = s;
  renderMe(s, queueOrder(s), id => (s.courts.find(c => c.id === id) || { name: 'a court' }).name);
  const q = queueOrder(s), name = id => { const p = byId(s, id); return p ? p.name : '?'; };
  document.title = row.name + ' · Live board';
  const cards = s.courts.map(c => { const m = active(s).find(x => x.court === c.id);
    return '<div class="court ' + (m ? 'busy' : 'free') + '"><header><b>' + esc(c.name) + '</b>' + (m ? '<span class="timer" data-start="' + m.start + '">' + fmtT(Date.now() - m.start) + '</span>' : '<span class="mute">Free</span>') + '</header>' +
      (m ? '<div class="teams"><div class="team">' + m.t1.map(id => '<span>' + esc(name(id)) + '</span>').join('') + '</div><span class="vs">VS</span><div class="team">' + m.t2.map(id => '<span>' + esc(name(id)) + '</span>').join('') + '</div></div>' : '<div class="mute">Waiting for the next game</div>') + '</div>'; }).join('');
  $('#root').innerHTML = '<h1>' + esc(row.name) + '</h1><div class="small mute">Live board · updates automatically</div><h2>On court</h2><div class="grid">' + cards + '</div><h2>Up next</h2><div class="card">' +
    (q.length ? q.slice(0, 12).map((p, i) => '<div class="q"><span class="n">' + (i + 1) + '</span><div class="grow"><b>' + esc(p.name) + '</b></div><span class="small mute">' + p.games + ' game' + (p.games === 1 ? '' : 's') + '</span></div>').join('') : '<div class="mute">No one is waiting.</div>') + '</div>';
}
async function startLive() {
  document.body.classList.add('live'); $('#root').innerHTML = '<h1>Loading…</h1>';
  const tick = async () => { try { const row = await P.getPublicQueue(liveCode); if (row) liveRender(row); else $('#root').innerHTML = '<h1>Board not found</h1><div class="mute">The link may be wrong or the queuing session was deleted.</div>'; } catch (e) { /* keep showing the last board */ } };
  const meBox = document.createElement('div'); meBox.id = 'me'; $('#root').before(meBox);
  await tick(); setInterval(tick, 20000);                       // safety net; the real updates arrive instantly below
  try { P.liveChannel('qlive-' + liveCode, () => tick()); } catch (e) {}
}

// ---------------------------------------------------------------- go
setInterval(() => $$('.timer[data-start]').forEach(t => { t.textContent = fmtT(Date.now() - +t.dataset.start); }), 1000);
setInterval(() => { if (!liveCode && tab === 'courts' && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) && !$('#ov').classList.contains('on')) { const q = $('#tabbody'); if (q) { /* refresh waiting minutes */ render(); } } }, 60000);
(async function init() {
  if (liveCode) { if (!cloud) { $('#root').innerHTML = '<h1>Live board</h1><div class="mute">The cloud is not connected.</div>'; return; } await P.whenReady(); return startLive(); }
  if (!cloud) return startGuest();
  await P.whenReady();
  P.onAuth(user => { if (user) startCloud(); else startGuest(); });
})();
</script>
