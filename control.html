<div class="top"><h1 id="ttl">Match Control<small id="sub"></small></h1><span class="dot" id="dot" title="Connection"></span></div>
<div class="wrap tbw" id="tbw"><div class="tb"><input id="find" type="search" placeholder="Find a player or team" autocomplete="off" aria-label="Find a player or team"><button type="button" data-p="ann" id="bAnn">Announce</button><button type="button" id="bRaffle" title="Open the raffle wheel in a new tab">Raffle</button><button type="button" id="bCallAll" class="hidden" title="Call every court whose next game has not started">Call all waiting courts</button><span class="acw" id="acw"><button type="button" id="bAuto" title="When a game finishes, call the next game on that court by itself (voice + the umpire's phone). Run this on ONE Match Control screen only.">Auto-call: Off</button><div class="acm" id="acMenu" hidden role="menu" aria-label="Auto-call"><div class="acl">Call the next game on a court when a game finishes:</div><button type="button" role="menuitem" data-d="0">Right away</button><button type="button" role="menuitem" data-d="30">After 30 seconds</button><button type="button" role="menuitem" data-d="60">After 1 minute</button><button type="button" role="menuitem" data-d="120">After 2 minutes</button><button type="button" role="menuitem" class="acoff" id="acOff">Turn off</button></div></span><button type="button" data-p="voice">Speaker</button><button type="button" id="bMore" aria-expanded="false" aria-controls="moreRow">More<svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2 4.2 6 8l4-3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div id="moreRow" class="tb morerow" inert><button type="button" data-p="wd">Withdraw team</button><button type="button" data-p="sched">Full schedule</button><button type="button" data-p="bracket">Bracket</button><button type="button" data-p="log">Activity log</button></div><div id="panel"></div></div>
<div class="wrap" id="app"><div class="msg">Loading...</div></div>
<div class="sh" id="es"><div><h2 style="margin:0 0 2px;font-size:19px">Fix the score</h2><p class="meta" id="esMsg" style="margin:0"></p><div class="sc"><b id="esT1"></b><input id="esA" type="number" inputmode="numeric" min="0" max="99"><b id="esT2"></b><input id="esB" type="number" inputmode="numeric" min="0" max="99"></div><div class="btns"><button class="go" id="esSave">Save score</button><button id="esCancel">Cancel</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script src="announcer.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), slug = q.get('s'), key = q.get('k');
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); };
  window.__cmdToast = toast; if (window.Announcer) Announcer.init(slug, key);
  { const br = document.getElementById('bRaffle'); if (br) br.onclick = () => window.open('raffle.html?s=' + encodeURIComponent(slug) + '&k=' + encodeURIComponent(key), '_blank'); }
  const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const P = window.Platform;
  const openMore = {};
  const seen = { sig: {}, pct: {}, sc: {}, rec: {} }; let seenAny = false;
  let shownKind = '', data = null, scores = {}, clocks = {}, ctl = null, alarmed = {}, err = null, ann = null, panelKind = '', logRows = null, notes = {}, noteWarned = false;

  function beep() { try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; const c = new A(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .25; o.start(); setTimeout(() => { try { o.stop(); c.close(); } catch (e) {} }, 900); } catch (e) {} }
  const state = m => { const s = scores[m.mid]; if (s) return s.status; if (m.res) return 'done'; return 'up'; };
  const score = m => scores[m.mid] || (m.res ? { s1: m.res.a, s2: m.res.b } : null);
  const ready = m => m.t1 && m.t2;

  // ----- offline: keep the last data on this device, say clearly when the connection is down, and let the page open again without a connection -----
  const CKEY = 'cache.ctl.' + slug, fmtT = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const cacheSave = d => { try { localStorage.setItem(CKEY, JSON.stringify({ d, t: Date.now() })); } catch (e) {} };
  const cacheLoad = () => { try { return JSON.parse(localStorage.getItem(CKEY) || 'null'); } catch (e) { return null; } };
  let lastOkAt = 0;
  function offPaint(isErr) {
    let b = document.getElementById('offbar'); if (!b) { b = document.createElement('div'); b.id = 'offbar'; b.className = 'offbar'; b.setAttribute('role', 'status'); document.body.appendChild(b); }
    const off = isErr && (!lastOkAt || Date.now() - lastOkAt > 20000);
    b.textContent = 'No connection' + (lastOkAt ? '. Showing the last update from ' + fmtT(lastOkAt) : '. Showing saved data') + (true ? '. Changes will not go through until it is back.' : '. Trying again…'); b.classList.toggle('on', !!off);
  }
  window.addEventListener('online', () => { try { load(); } catch (e) {} });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  async function load() {
    try {
      const d = await P.umpireGet(slug, key);
      try { ann = await P.getAnnouncement(slug); } catch (e) { ann = null; }
      try { const ns = await P.getMatchNotes(slug, key); notes = {}; ns.forEach(n => { notes[n.match_id] = n; }); } catch (e) { /* step 14 not run yet: reasons just are not shown */ }
      data = d; scores = {}; (d.scores || []).forEach(x => { scores[x.id] = x; }); err = null; $('#dot').className = 'dot'; lastOkAt = Date.now(); cacheSave(d); try { acCheck(); } catch (e) {}
    } catch (e) {
      err = e.message || 'Could not load'; $('#dot').className = 'dot err';
      if (!data) { const c = cacheLoad(); if (c && c.d) { data = c.d; scores = {}; (c.d.scores || []).forEach(x => { scores[x.id] = x; }); lastOkAt = c.t; } }
    }
    offPaint(!!err); paint();
  }

  // live clock state pushed by the umpire phones (a clock not heard from for 20 s is treated as offline)
  function onCk(p) {
    if (!p || p.t !== 'ck' || !p.mid) return;
    if (p.closed) { delete clocks[p.mid]; paint(); return; }
    clocks[p.mid] = Object.assign({}, p, { at: Date.now() }); paint();
  }
  const fresh = c => c && Date.now() - c.at < 20000;
  const left = (c, k) => c[k] == null ? null : c[k] - (Date.now() - c.at);

  function send(msg) { try { ctl.ping(msg); } catch (e) {} }
  function cmd(mid, c, who) { send({ t: 'cmd', mid, cmd: c, who }); toast('Sent to the umpire.'); }
  const mById = mid => ((data && data.matches) || []).find(m => m.mid === mid);
  const mName = m => m ? (m.t1 || 'TBD') + ' vs ' + (m.t2 || 'TBD') : 'a match';
  function logIt(text) { P.addLog(slug, key, text); if (panelKind === 'log') setTimeout(() => openPanel('log', true), 500); }
  function call(m) { logIt('Called to court: ' + mName(m) + ' (' + m.court + ')'); send({ t: 'call', mid: m.mid, label: m.t1 + ' vs ' + m.t2 }); toast('Called: ' + m.t1 + ' vs ' + m.t2); if (window.Announcer) Announcer.call({ court: m.court, bracket: m.bracket, t1: m.t1, t2: m.t2 }); }

  const target = m => m.sport === 'pickleball' ? 11 : 31;      // a default counts as a full game to nothing: 31-0 (pickleball 11-0)
  const REASONS = ['No-show', 'Injury', 'Personal emergency', 'Other'];
  const noteOf = m => { const n = m && notes[m.mid]; return n ? (n.kind === 'retired' ? 'Retired' : n.kind === 'withdrawn' ? 'Withdrew' : 'Default') + (n.reason ? ' \u00b7 ' + n.reason : '') : ''; };
  async function saveNote(m, kind, reason) {
    try { await P.setMatchNote(slug, key, m.mid, kind, reason); notes[m.mid] = { match_id: m.mid, kind, reason }; }
    catch (e) { if (!noteWarned) { noteWarned = true; toast('Saved, but the reason could not be stored. Run supabase-step14.sql.'); } }
  }
  const rsnOf = m => { const el = $('#app').querySelector('[data-rsn="' + String(m.mid).replace(/"/g, '\\"') + '"]'); return el ? el.value : 'No-show'; };
  async function recordDefault(m, side, reason) {
    reason = reason || 'No-show';
    const T = target(m), loser = side === 0 ? m.t1 : m.t2, winner = side === 0 ? m.t2 : m.t1, s1 = side === 0 ? 0 : T, s2 = side === 0 ? T : 0;
    if (!confirm(loser + ' defaults.\n' + winner + ' wins ' + T + ' - 0.\nThis is final and goes to the scoreboard. Record it?')) return;
    try { await P.umpireScore(slug, key, m.mid, s1, s2, 'done'); } catch (e) { toast(e.message || 'Could not save.'); return; }
    await saveNote(m, 'default', reason);
    logIt('Default recorded on ' + m.court + ': ' + loser + ' defaulted (' + reason + '), ' + winner + ' wins ' + T + '-0'); send({ t: 'defrec', mid: m.mid, s1, s2 }); delete clocks[m.mid]; toast('Recorded: ' + winner + ' wins ' + T + ' - 0.'); load();
  }
  // injury or retirement during a game: the other team wins and the points already played stay (a game not started counts as a full default)
  async function recordRetire(m, side, reason) {
    reason = reason || 'Injury';
    const T = target(m), sc = score(m) || { s1: 0, s2: 0 }, loser = side === 0 ? m.t1 : m.t2, winner = side === 0 ? m.t2 : m.t1;
    if (!sc.s1 && !sc.s2) return recordDefault(m, side, reason);
    let a = sc.s1, b = sc.s2;
    if (side === 0 && b <= a) b = a + 1; if (side === 1 && a <= b) a = b + 1;
    if (!confirm(loser + ' retires.\n' + winner + ' wins ' + (side === 0 ? b + ' - ' + a : a + ' - ' + b) + ' (the score so far).\nThis is final and goes to the scoreboard. Record it?')) return;
    try { await P.umpireScore(slug, key, m.mid, a, b, 'done'); } catch (e) { toast(e.message || 'Could not save.'); return; }
    await saveNote(m, 'retired', reason);
    logIt('Retired on ' + m.court + ': ' + loser + ' retired (' + reason + '), ' + winner + ' wins ' + a + '-' + b); send({ t: 'defrec', mid: m.mid, s1: a, s2: b }); delete clocks[m.mid]; toast('Recorded: ' + winner + ' wins.'); load();
  }
  // a team leaves the event: every game it has not finished is recorded as a default for the other team (finished games keep their scores)
  const teamsLeft = () => { const set = new Set(); ((data && data.matches) || []).forEach(m => { if (state(m) !== 'done' && ready(m)) { set.add(m.t1); set.add(m.t2); } }); return [...set].sort((a, b) => String(a).localeCompare(String(b))); };
  const wdGames = t => ((data && data.matches) || []).filter(m => state(m) !== 'done' && ready(m) && (m.t1 === t || m.t2 === t)).sort(bySlot);
  async function withdrawTeam(t, reason) {
    reason = reason || 'Other';
    const gs = wdGames(t); if (!gs.length) { toast('Nothing left to default for ' + t + '.'); return; }
    if (!confirm(t + ' withdraws.\n' + gs.length + ' unplayed game' + (gs.length > 1 ? 's are' : ' is') + ' recorded as a default (the other team wins ' + (gs.every(m => target(m) === target(gs[0])) ? target(gs[0]) + ' - 0' : 'by default') + '). Games already played keep their scores.\nThis cannot be undone. Continue?')) return;
    let n = 0;
    try { for (const m of gs) { const T = target(m), side = m.t1 === t ? 0 : 1; await P.umpireScore(slug, key, m.mid, side === 0 ? 0 : T, side === 0 ? T : 0, 'done'); await saveNote(m, 'withdrawn', reason); delete clocks[m.mid]; n++; send({ t: 'defrec', mid: m.mid, s1: side === 0 ? 0 : T, s2: side === 0 ? T : 0 }); } }
    catch (e) { toast((n ? n + ' done, then: ' : '') + (e.message || 'Could not save.')); logIt(t + ' withdrew: ' + n + ' game(s) defaulted before an error'); load(); return; }
    logIt(t + ' withdrew (' + reason + '): ' + n + ' game' + (n > 1 ? 's' : '') + ' recorded as defaults'); toast(t + ' withdrawn: ' + n + ' game' + (n > 1 ? 's' : '') + ' defaulted.'); panelKind = ''; document.querySelectorAll('#tbw [data-p]').forEach(b => b.classList.remove('on')); $('#bMore').classList.remove('on'); renderPanel(); load();
  }
  const base = () => location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
  const umpUrl = court => base() + 'u.html?s=' + encodeURIComponent(slug) + '&k=' + encodeURIComponent(key) + (court ? '&c=' + encodeURIComponent(court) : '');
  let slch = null;
  async function changed(msg) { toast(msg); try { slch && slch.ping(); } catch (e) {} await load(); }
  // play a selected match now on a court of your choice: it goes to the front of that court's queue (right after a game in progress) and is called
  async function doPlay(mid, court) {
    const m = mById(mid); if (!m || !court) return;
    const ct = courtsOf().find(x => x.name === court), left = (ct ? ct.list : []).filter(x => state(x) !== 'done' && x.mid !== mid), live = left.find(x => state(x) === 'live'), first = left.find(x => state(x) === 'up');
    const slot = live ? live.slot + 0.5 : first ? first.slot - 0.5 : Math.min(m.slot >= 0 && m.slot < 900 ? m.slot : 0, 899);
    if (!clashWarn(m.t1, m.t2, slot, mid)) return;
    try { await P.playMatch(slug, key, mid, court, slot); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step23.sql first.' : (e.message || 'Could not do that.')); return; }
    logIt('Play now: ' + mName(m) + ' on ' + court + (m.court !== court ? ' (from ' + m.court + ')' : ''));
    await changed(live ? mName(m) + ' is next on ' + court + ', after the game in progress.' : mName(m) + ' is up on ' + court + '.');
    if (!live && ready(m)) call(Object.assign({}, m, { court: court }));
  }
  async function doMove(mid, court) { const mm = mById(mid), from = mm && mm.court; try { await P.moveMatch(slug, key, mid, court); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step11.sql first.' : (e.message || 'Could not move.')); return; } logIt(court ? 'Moved ' + mName(mm) + ' from ' + from + ' to ' + court : 'Put ' + mName(mm) + ' back on its original court'); changed(court ? 'Moved to ' + court + '.' : 'Put back on its original court.'); }
  // does an extra match put a player in two places at once? Looks at games being played now and, when the slot is known, games in the same time slot.
  const ppl = t => String(t || '').split(/\s*(?:\/|&|,|\band\b)\s*/i).map(x => x.trim().toLowerCase()).filter(Boolean);
  function clashWarn(t1, t2, slot, selfMid) {
    const mine = new Set(ppl(t1).concat(ppl(t2))), hits = [];
    ((data && data.matches) || []).forEach(m => {
      if (m.mid === selfMid || state(m) === 'done' || !ready(m)) return;
      const when = state(m) === 'live' ? 'playing right now' : (slot && slot < 900 && m.slot === slot ? 'scheduled at the same time' : '');
      if (!when) return;
      const names = String(m.t1 + ' / ' + m.t2).split(/\s*(?:\/|&|,|\band\b)\s*/i).map(x => x.trim()).filter(n => n && mine.has(n.toLowerCase()));
      if (names.length) hits.push([...new Set(names)].join(', ') + ' is ' + when + ' on ' + m.court + ' (' + String(m.time).split(' - ')[0] + ', ' + m.t1 + ' vs ' + m.t2 + ')');
    });
    if (!hits.length) return true;
    return confirm('Heads up, a player would be in two places:\n' + hits.slice(0, 4).join('\n') + (hits.length > 4 ? '\n...and ' + (hits.length - 4) + ' more' : '') + '\n\nContinue anyway?');
  }
  async function doAdd(court, t1, t2, sport) {
    if (!t1.trim() || !t2.trim()) { toast('Type both teams.'); return; }
    if (!clashWarn(t1, t2, 0, null)) return;
    try { await P.addExtraMatch(slug, key, court, t1.trim(), t2.trim(), sport, new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step11.sql first.' : (e.message || 'Could not add.')); return; }
    logIt('Added extra match on ' + court + ': ' + t1.trim() + ' vs ' + t2.trim()); changed('Added to ' + court + '.');
  }
  async function doSlot(mid, slot, msg, time) { const em = mById(mid); if (em && slot < 900 && !clashWarn(em.t1, em.t2, slot, mid)) return; try { await P.setExtraSlot(slug, key, mid, slot, time); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step12.sql first.' : (e.message || 'Could not change the order.')); return; } logIt('Extra match order: ' + mName(mById(mid)) + ' - ' + msg); changed(msg); }
  // rest slots = gaps in the schedule's slot numbers; their times are worked out from the games either side
  const toMin = t => { const m = /(\d+):(\d+)\s*(AM|PM)?/i.exec(String(t || '')); if (!m) return null; let h = +m[1] % 12; if (/pm/i.test(m[3] || '')) h += 12; return h * 60 + +m[2]; };
  const fmtMin = n => { n = Math.round(n); const h = Math.floor(n / 60) % 24, mi = n % 60; return ((h % 12) || 12) + ':' + String(mi).padStart(2, '0') + ' ' + (h >= 12 ? 'PM' : 'AM'); };
  function restSlots() {
    const by = {}; (data.matches || []).filter(m => !m.extra && m.slot >= 0).forEach(m => { if (!by[m.slot]) by[m.slot] = String(m.time).split(/\s+-\s+/); });
    const ks = Object.keys(by).map(Number).sort((a, b) => a - b), out = [];
    for (let i = 1; i < ks.length; i++) {
      const a = ks[i - 1], b = ks[i], n = b - a - 1; if (n < 1) continue;
      const e = toMin(by[a][1]), st = toMin(by[b][0]); if (e == null || st == null || st <= e) continue;
      const len = (st - e) / n;
      for (let k = 0; k < n; k++) out.push({ slot: a + k + 1, label: fmtMin(e + k * len) + ' - ' + fmtMin(e + (k + 1) * len) });
    }
    return out;
  }
  // how far a court is behind its schedule (only for clock-time slots; extra matches have no scheduled time)
  function lateInfo(m, live) {
    if (!m || m.extra) return null;
    const t = String(m.time).split(/\s+-\s+/), st = toMin(t[0]), en = toMin(t[1]), d = new Date();
    if (st == null) return null;
    let now = d.getHours() * 60 + d.getMinutes();
    const dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(m.date || '');
    if (dm) { const day = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(+dm[1], +dm[2] - 1, +dm[3])) / 864e5); now += day * 1440; }      // the event date is known: before that day nothing is late

    if (live) return en != null && now - en >= 3 && now - en <= 240 ? { txt: 'Over by ' + (now - en) + ' min', min: now - en } : null;
    return now - st >= 5 && now - st <= 240 ? { txt: 'Late ' + (now - st) + ' min', min: now - st } : null;
  }
  function recentHtml(all) {
