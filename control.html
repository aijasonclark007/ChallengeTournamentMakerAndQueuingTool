<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2547">
<title>Match Control</title>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--ink:#1C1C1E;--mute:#5F5F66;--line:rgba(60,60,67,.18);--bg:#F2F2F7;--card:#fff;--chip:rgba(118,118,128,.12);--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--ink:#F2F2F7;--mute:#A1A1A8;--line:rgba(235,235,245,.18);--bg:#000;--card:#1C1C1E;--chip:rgba(118,118,128,.28);--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.top{background:#0A2547;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:18px;flex:1;line-height:1.2}.top small{display:block;font-weight:500;opacity:.75;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#7bd88f;flex:none}.dot.err{background:var(--red)}
.wrap{max-width:1500px;margin:0 auto;padding:14px 14px 40px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum span{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.sum b{font-variant-numeric:tabular-nums}
.alerts{display:grid;gap:8px;margin-bottom:12px}
.alert{background:#FFE5E3;color:#B3261E;border-radius:14px;padding:12px 14px;font-weight:800;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:stretch}
.court{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;border:2px solid transparent;display:flex;flex-direction:column}
.court.live{border-color:var(--green)}.court.warn{border-color:var(--orange)}.court.med{border-color:var(--blue)}.court.over{border-color:var(--red)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ch h2{margin:0;font-size:19px;flex:1}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--chip);color:var(--mute);white-space:nowrap}
.pill.live{background:var(--green);color:#fff}.pill.warn{background:var(--orange);color:#fff}.pill.med{background:var(--blue);color:#fff}.pill.over{background:var(--red);color:#fff}
.lbl{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 2px}
.tms{display:grid;gap:6px;margin:6px 0 2px}
.tm{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:8px 12px;min-height:3.4em}
.tm b{flex:1;font-size:16px;line-height:1.25;font-weight:800;overflow-wrap:anywhere}
.tm em{font-style:normal;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.meta{color:var(--mute);font-size:13px}
.clock{margin:8px 0;padding:10px 12px;border-radius:14px;background:var(--chip);font-weight:700;font-size:14px}
.clock.warn{background:#FFF4D6;color:#6b4a00}.clock.med{background:#E8F2FF;color:#0A4FA8}.clock.over{background:#FFE5E3;color:#B3261E}
.clock b{font-size:22px;font-variant-numeric:tabular-nums;margin-right:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns button{flex:1 1 130px;padding:11px 10px;border-radius:12px;background:var(--chip);font-weight:800;font-size:14px}
.btns .go{background:var(--orange);color:#fff}.btns .ok{background:var(--green);color:#fff}.btns .stop{background:#FFE5E3;color:#B3261E}
.more{margin-top:8px}.more summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:700;padding:4px 0}
.next{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.next .q{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;height:42px;font-size:13.5px;line-height:1.25}
.next .q span{color:var(--mute);font-size:12px;font-weight:700;white-space:nowrap}
.next .q p{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;padding-top:10px}
.prog{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 6px}.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.tools{margin-top:8px;background:var(--chip);border-radius:12px;padding:2px 12px}.tools summary{font-weight:800;font-size:14px;padding:10px 0;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}.tools summary::-webkit-details-marker{display:none}.tools summary::before{content:'';width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(-45deg);transition:transform .25s ease;margin:0 4px 0 2px}.tools[open] summary::before{transform:rotate(45deg)}.tools{transition:background .2s}.tools.pop>:not(summary){animation:slidedown .3s ease both}@keyframes slidedown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.tools.pop>:not(summary){animation:none}.tools summary::before{transition:none}}.tools .row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.tools select,.tools input{flex:1 1 130px;min-width:0;padding:10px;border-radius:10px;border:1px solid #D1D1D6;font:inherit;font-size:15px;background:#fff}.tools .stop{background:#FFE5E3;color:#B3261E}.tools h4{margin:6px 0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}.tools .btns{margin-top:0}.tag2{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:#FFE5E3;color:#B3261E;margin-left:6px}
.pill.late{background:#FFF1D6;color:#8A5200}.sum .lt{background:#FFF1D6;color:#8A5200}
.recent{margin-top:18px;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:14px 16px}.recent h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.rrow{display:grid;grid-template-columns:70px 70px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.rrow:first-of-type{border-top:0}.rrow span.t{color:var(--mute);font-size:12px;font-weight:700}.rrow b{font-variant-numeric:tabular-nums}.rrow .w{font-weight:800}
.tbw{padding-bottom:0!important;display:none}.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tb input{flex:1 1 220px;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.tb button{padding:11px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:14px;position:relative}.tb button.on{background:var(--blue);color:#fff}.tb button i{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--orange)}
#panel{margin-top:10px}.pn{background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:14px 16px;animation:slidedown .28s ease both}
.pn h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.pn textarea{width:100%;min-height:74px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--bg);color:var(--ink);resize:vertical}
.pr{display:grid;grid-template-columns:78px 72px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.pr:first-of-type{border-top:0}.pr .t{color:var(--mute);font-size:12px;font-weight:700}
.chipx{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--mute);white-space:nowrap}.chipx.live{background:var(--green);color:#fff}.chipx.done{background:#E6F6EC;color:#16793A}
.lg{padding:7px 0;border-top:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:78px 1fr;gap:10px}.lg:first-of-type{border-top:0}.lg span{color:var(--mute);font-size:12px;font-weight:700}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.sh.on{display:flex}.sh>div{background:var(--card);width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:slidedown .25s ease both}
.sh .sc{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin:10px 0}.sh .sc input{padding:12px;border-radius:12px;border:1px solid var(--line);font:inherit;font-size:22px;font-weight:800;text-align:center;background:var(--bg);color:var(--ink)}
.rrow .ed{margin-left:8px;font-size:12px;font-weight:800;color:var(--blue);background:none;padding:2px 6px}
.msg{padding:50px 20px;text-align:center;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#10213a;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><h1 id="ttl">Match Control<small id="sub"></small></h1><span class="dot" id="dot" title="Connection"></span></div>
<div class="wrap tbw" id="tbw"><div class="tb"><input id="find" type="search" placeholder="Find a player or team" autocomplete="off" aria-label="Find a player or team"><button type="button" data-p="ann" id="bAnn">Announce</button><button type="button" data-p="sched">Full schedule</button><button type="button" data-p="log">Activity log</button></div><div id="panel"></div></div>
<div class="wrap" id="app"><div class="msg">Loading...</div></div>
<div class="sh" id="es"><div><h2 style="margin:0 0 2px;font-size:19px">Fix the score</h2><p class="meta" id="esMsg" style="margin:0"></p><div class="sc"><b id="esT1"></b><input id="esA" type="number" inputmode="numeric" min="0" max="99"><b id="esT2"></b><input id="esB" type="number" inputmode="numeric" min="0" max="99"></div><div class="btns"><button class="go" id="esSave">Save score</button><button id="esCancel">Cancel</button></div></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), slug = q.get('s'), key = q.get('k');
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); };
  const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const P = window.Platform;
  const openMore = {};
  let data = null, scores = {}, clocks = {}, ctl = null, alarmed = {}, err = null, ann = null, panelKind = '', logRows = null;

  function beep() { try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; const c = new A(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .25; o.start(); setTimeout(() => { try { o.stop(); c.close(); } catch (e) {} }, 900); } catch (e) {} }
  const state = m => { const s = scores[m.mid]; if (s) return s.status; if (m.res) return 'done'; return 'up'; };
  const score = m => scores[m.mid] || (m.res ? { s1: m.res.a, s2: m.res.b } : null);
  const ready = m => m.t1 && m.t2;

  async function load() {
    try {
      const d = await P.umpireGet(slug, key);
      try { ann = await P.getAnnouncement(slug); } catch (e) { ann = null; }
      data = d; scores = {}; (d.scores || []).forEach(x => { scores[x.id] = x; }); err = null; $('#dot').className = 'dot';
    } catch (e) { err = e.message || 'Could not load'; $('#dot').className = 'dot err'; }
    paint();
  }

  // live clock state pushed by the umpire phones (a clock not heard from for 20 s is treated as offline)
  function onCk(p) {
    if (!p || p.t !== 'ck' || !p.mid) return;
    if (p.closed) { delete clocks[p.mid]; paint(); return; }
    clocks[p.mid] = Object.assign({}, p, { at: Date.now() }); paint();
  }
  const fresh = c => c && Date.now() - c.at < 20000;
  const left = (c, k) => c[k] == null ? null : c[k] - (Date.now() - c.at);

  function send(msg) { try { ctl.ping(msg); } catch (e) {} }
  function cmd(mid, c, who) { send({ t: 'cmd', mid, cmd: c, who }); toast('Sent to the umpire.'); }
  const mById = mid => ((data && data.matches) || []).find(m => m.mid === mid);
  const mName = m => m ? (m.t1 || 'TBD') + ' vs ' + (m.t2 || 'TBD') : 'a match';
  function logIt(text) { P.addLog(slug, key, text); if (panelKind === 'log') setTimeout(() => openPanel('log', true), 500); }
  function call(m) { logIt('Called to court: ' + mName(m) + ' (' + m.court + ')'); send({ t: 'call', mid: m.mid, label: m.t1 + ' vs ' + m.t2 }); toast('Called: ' + m.t1 + ' vs ' + m.t2); }

  const target = m => m.sport === 'pickleball' ? 11 : 31;      // a default counts as a full game to nothing: 31-0 (pickleball 11-0)
  async function recordDefault(m, side) {
    const T = target(m), loser = side === 0 ? m.t1 : m.t2, winner = side === 0 ? m.t2 : m.t1, s1 = side === 0 ? 0 : T, s2 = side === 0 ? T : 0;
    if (!confirm(loser + ' defaults.\n' + winner + ' wins ' + T + ' - 0.\nThis is final and goes to the scoreboard. Record it?')) return;
    try { await P.umpireScore(slug, key, m.mid, s1, s2, 'done'); } catch (e) { toast(e.message || 'Could not save.'); return; }
    logIt('Default recorded on ' + m.court + ': ' + loser + ' defaulted, ' + winner + ' wins ' + T + '-0'); send({ t: 'defrec', mid: m.mid, s1, s2 }); delete clocks[m.mid]; toast('Recorded: ' + winner + ' wins ' + T + ' - 0.'); load();
  }
  const base = () => location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
  const umpUrl = court => base() + 'u.html?s=' + encodeURIComponent(slug) + '&k=' + encodeURIComponent(key) + (court ? '&c=' + encodeURIComponent(court) : '');
  let slch = null;
  async function changed(msg) { toast(msg); try { slch && slch.ping(); } catch (e) {} await load(); }
  async function doMove(mid, court) { const mm = mById(mid), from = mm && mm.court; try { await P.moveMatch(slug, key, mid, court); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step11.sql first.' : (e.message || 'Could not move.')); return; } logIt(court ? 'Moved ' + mName(mm) + ' from ' + from + ' to ' + court : 'Put ' + mName(mm) + ' back on its original court'); changed(court ? 'Moved to ' + court + '.' : 'Put back on its original court.'); }
  async function doAdd(court, t1, t2, sport) {
    if (!t1.trim() || !t2.trim()) { toast('Type both teams.'); return; }
    try { await P.addExtraMatch(slug, key, court, t1.trim(), t2.trim(), sport, new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step11.sql first.' : (e.message || 'Could not add.')); return; }
    logIt('Added extra match on ' + court + ': ' + t1.trim() + ' vs ' + t2.trim()); changed('Added to ' + court + '.');
  }
  async function doSlot(mid, slot, msg, time) { try { await P.setExtraSlot(slug, key, mid, slot, time); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step12.sql first.' : (e.message || 'Could not change the order.')); return; } logIt('Extra match order: ' + mName(mById(mid)) + ' - ' + msg); changed(msg); }
  // rest slots = gaps in the schedule's slot numbers; their times are worked out from the games either side
  const toMin = t => { const m = /(\d+):(\d+)\s*(AM|PM)?/i.exec(String(t || '')); if (!m) return null; let h = +m[1] % 12; if (/pm/i.test(m[3] || '')) h += 12; return h * 60 + +m[2]; };
  const fmtMin = n => { n = Math.round(n); const h = Math.floor(n / 60) % 24, mi = n % 60; return ((h % 12) || 12) + ':' + String(mi).padStart(2, '0') + ' ' + (h >= 12 ? 'PM' : 'AM'); };
  function restSlots() {
    const by = {}; (data.matches || []).filter(m => !m.extra && m.slot >= 0).forEach(m => { if (!by[m.slot]) by[m.slot] = String(m.time).split(/\s+-\s+/); });
    const ks = Object.keys(by).map(Number).sort((a, b) => a - b), out = [];
    for (let i = 1; i < ks.length; i++) {
      const a = ks[i - 1], b = ks[i], n = b - a - 1; if (n < 1) continue;
      const e = toMin(by[a][1]), st = toMin(by[b][0]); if (e == null || st == null || st <= e) continue;
      const len = (st - e) / n;
      for (let k = 0; k < n; k++) out.push({ slot: a + k + 1, label: fmtMin(e + k * len) + ' - ' + fmtMin(e + (k + 1) * len) });
    }
    return out;
  }
  // how far a court is behind its schedule (only for clock-time slots; extra matches have no scheduled time)
  function lateInfo(m, live) {
    if (!m || m.extra) return null;
    const t = String(m.time).split(/\s+-\s+/), st = toMin(t[0]), en = toMin(t[1]), d = new Date(), now = d.getHours() * 60 + d.getMinutes();
    if (st == null) return null;
    if (live) return en != null && now - en >= 3 && now - en <= 240 ? { txt: 'Over by ' + (now - en) + ' min', min: now - en } : null;
    return now - st >= 5 && now - st <= 240 ? { txt: 'Late ' + (now - st) + ' min', min: now - st } : null;
  }
  function recentHtml(all) {
    const done = all.filter(m => state(m) === 'done' && score(m)).sort((a, b) => (b.slot - a.slot) || String(a.court).localeCompare(String(b.court), undefined, { numeric: true })).slice(0, 6);
    if (!done.length) return '';
    return '<div class="recent"><h3>Recently finished</h3>' + done.map(m => { const s = score(m), w1 = s.s1 > s.s2; return '<div class="rrow"><span class="t">' + esc(String(m.time).split(/\s+-\s+/)[0]) + '</span><span class="t">' + esc(m.court) + '</span><div><span class="' + (w1 ? 'w' : '') + '">' + esc(m.t1) + '</span> <b>' + s.s1 + '</b> – <b>' + s.s2 + '</b> <span class="' + (w1 ? '' : 'w') + '">' + esc(m.t2) + '</span><button class="ed" data-edit="' + esc(m.mid) + '">Fix score</button></div></div>'; }).join('') + '</div>';
  }
  // ----- toolbar: find a player, announcements, full schedule, activity log, fix a score, close a court -----
  const sTag = m => { const s = score(m), st = state(m); return st === 'done' && s ? '<span class="chipx done">Final ' + s.s1 + ' - ' + s.s2 + '</span>' : st === 'live' ? '<span class="chipx live">LIVE' + (s ? ' ' + s.s1 + ' - ' + s.s2 : '') + '</span>' : '<span class="chipx">' + (ready(m) ? 'Upcoming' : 'Waiting') + '</span>'; };
  const t0 = m => esc(String(m.time).split(/\s+-\s+/)[0]);
  const bySlot = (a, b) => (a.slot - b.slot) || String(a.court).localeCompare(String(b.court), undefined, { numeric: true });
  function panelHtml(kind) {
    const all = (data && data.matches) || [];
    if (kind === 'find') {
      const q = ($('#find').value || '').trim().toLowerCase(); if (!q) return '';
      const hit = all.filter(m => ((m.t1 || '') + ' ' + (m.t2 || '')).toLowerCase().includes(q)).sort(bySlot);
      return '<div class="pn"><h3>' + (hit.length ? hit.length + ' match' + (hit.length > 1 ? 'es' : '') + ' for "' + esc(q) + '"' : 'No match found for "' + esc(q) + '"') + '</h3>' + hit.map(m => '<div class="pr"><span class="t">' + t0(m) + '</span><span class="t">' + esc(m.court) + '</span><div>' + esc(m.t1 || 'TBD') + ' vs ' + esc(m.t2 || 'TBD') + '<div class="meta">' + esc(m.bracket) + '</div></div>' + sTag(m) + '</div>').join('') + '</div>';
    }
    if (kind === 'sched') {
      const left = all.filter(m => state(m) !== 'done').sort(bySlot); if (!left.length) return '<div class="pn"><h3>Full schedule</h3><div class="meta">Every match is finished.</div></div>';
      let h = '<div class="pn"><h3>Still to play (' + left.length + ')</h3>', last = null;
      left.forEach(m => { const tk = String(m.time); if (tk !== last) { last = tk; h += '<div style="margin:10px 0 2px;font-weight:800">' + esc(tk) + '</div>'; } h += '<div class="pr"><span class="t">' + esc(m.court) + '</span><span class="t">' + esc(m.bracket) + '</span><div>' + esc(m.t1 || 'TBD') + ' vs ' + esc(m.t2 || 'TBD') + '</div>' + sTag(m) + '</div>'; });
      return h + '</div>';
    }
    if (kind === 'log') {
      if (logRows == null) return '<div class="pn"><h3>Activity log</h3><div class="meta">Loading...</div></div>';
