<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2547">
<title>Match Control</title>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--ink:#1C1C1E;--mute:#5F5F66;--line:rgba(60,60,67,.18);--bg:#F2F2F7;--card:#fff;--chip:rgba(118,118,128,.12);--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--ink:#F2F2F7;--mute:#A1A1A8;--line:rgba(235,235,245,.18);--bg:#000;--card:#1C1C1E;--chip:rgba(118,118,128,.28);--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.top{background:#0A2547;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:18px;flex:1;line-height:1.2}.top small{display:block;font-weight:500;opacity:.75;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#7bd88f;flex:none}.dot.err{background:var(--red)}
.wrap{max-width:1500px;margin:0 auto;padding:14px 14px 40px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum span{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.sum b{font-variant-numeric:tabular-nums}
.alerts{display:grid;gap:8px;margin-bottom:12px}
.alert{background:#FFE5E3;color:#B3261E;border-radius:14px;padding:12px 14px;font-weight:800;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:stretch}
.court{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px;border:2px solid transparent;display:flex;flex-direction:column}
.court.live{border-color:var(--green)}.court.warn{border-color:var(--orange)}.court.med{border-color:var(--blue)}.court.over{border-color:var(--red)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ch h2{margin:0;font-size:19px;flex:1}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--chip);color:var(--mute);white-space:nowrap}
.pill.live{background:var(--green);color:#fff}.pill.warn{background:var(--orange);color:#fff}.pill.med{background:var(--blue);color:#fff}.pill.over{background:var(--red);color:#fff}
.lbl{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 2px}
.tms{display:grid;gap:6px;margin:6px 0 2px}
.tm{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:8px 12px;min-height:3.4em}
.tm b{flex:1;font-size:16px;line-height:1.25;font-weight:800;overflow-wrap:anywhere}
.tm em{font-style:normal;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.meta{color:var(--mute);font-size:13px}
.clock{margin:8px 0;padding:10px 12px;border-radius:14px;background:var(--chip);font-weight:700;font-size:14px}
.clock.warn{background:#FFF4D6;color:#6b4a00}.clock.med{background:#E8F2FF;color:#0A4FA8}.clock.over{background:#FFE5E3;color:#B3261E}
.clock b{font-size:22px;font-variant-numeric:tabular-nums;margin-right:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns button{flex:1 1 130px;padding:11px 10px;border-radius:12px;background:var(--chip);font-weight:800;font-size:14px}
.btns .go{background:var(--orange);color:#fff}.btns .ok{background:var(--green);color:#fff}.btns .stop{background:#FFE5E3;color:#B3261E}
.more{margin-top:8px}.more summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:700;padding:4px 0}
.next{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.next .q{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;height:42px;font-size:13.5px;line-height:1.25}
.next .q span{color:var(--mute);font-size:12px;font-weight:700;white-space:nowrap}
.next .q p{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;padding-top:10px}
.prog{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 6px}.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.tools{margin-top:8px;background:var(--chip);border-radius:12px;padding:2px 12px}.tools summary{font-weight:800;font-size:14px;padding:10px 0;cursor:pointer}.tools .row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.tools select,.tools input{flex:1 1 130px;min-width:0;padding:10px;border-radius:10px;border:1px solid #D1D1D6;font:inherit;font-size:15px;background:#fff}.tools .stop{background:#FFE5E3;color:#B3261E}.tools h4{margin:6px 0;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}.tools .btns{margin-top:0}.tag2{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:#FFE5E3;color:#B3261E;margin-left:6px}
.msg{padding:50px 20px;text-align:center;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#10213a;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><h1 id="ttl">Match Control<small id="sub"></small></h1><span class="dot" id="dot" title="Connection"></span></div>
<div class="wrap" id="app"><div class="msg">Loading...</div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), slug = q.get('s'), key = q.get('k');
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); };
  const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const P = window.Platform;
  const openMore = {};
  let data = null, scores = {}, clocks = {}, ctl = null, alarmed = {}, err = null;

  function beep() { try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; const c = new A(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .25; o.start(); setTimeout(() => { try { o.stop(); c.close(); } catch (e) {} }, 900); } catch (e) {} }
  const state = m => { const s = scores[m.mid]; if (s) return s.status; if (m.res) return 'done'; return 'up'; };
  const score = m => scores[m.mid] || (m.res ? { s1: m.res.a, s2: m.res.b } : null);
  const ready = m => m.t1 && m.t2;

  async function load() {
    try {
      const d = await P.umpireGet(slug, key);
      data = d; scores = {}; (d.scores || []).forEach(x => { scores[x.id] = x; }); err = null; $('#dot').className = 'dot';
    } catch (e) { err = e.message || 'Could not load'; $('#dot').className = 'dot err'; }
    paint();
  }

  // live clock state pushed by the umpire phones (a clock not heard from for 20 s is treated as offline)
  function onCk(p) {
    if (!p || p.t !== 'ck' || !p.mid) return;
    if (p.closed) { delete clocks[p.mid]; paint(); return; }
    clocks[p.mid] = Object.assign({}, p, { at: Date.now() }); paint();
  }
  const fresh = c => c && Date.now() - c.at < 20000;
  const left = (c, k) => c[k] == null ? null : c[k] - (Date.now() - c.at);

  function send(msg) { try { ctl.ping(msg); } catch (e) {} }
  function cmd(mid, c, who) { send({ t: 'cmd', mid, cmd: c, who }); toast('Sent to the umpire.'); }
  function call(m) { send({ t: 'call', mid: m.mid, label: m.t1 + ' vs ' + m.t2 }); toast('Called: ' + m.t1 + ' vs ' + m.t2); }

  const target = m => m.sport === 'pickleball' ? 11 : 31;      // a default counts as a full game to nothing: 31-0 (pickleball 11-0)
  async function recordDefault(m, side) {
    const T = target(m), loser = side === 0 ? m.t1 : m.t2, winner = side === 0 ? m.t2 : m.t1, s1 = side === 0 ? 0 : T, s2 = side === 0 ? T : 0;
    if (!confirm(loser + ' defaults.\n' + winner + ' wins ' + T + ' - 0.\nThis is final and goes to the scoreboard. Record it?')) return;
    try { await P.umpireScore(slug, key, m.mid, s1, s2, 'done'); } catch (e) { toast(e.message || 'Could not save.'); return; }
    send({ t: 'defrec', mid: m.mid, s1, s2 }); delete clocks[m.mid]; toast('Recorded: ' + winner + ' wins ' + T + ' - 0.'); load();
  }
  const base = () => location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
  const umpUrl = court => base() + 'u.html?s=' + encodeURIComponent(slug) + '&k=' + encodeURIComponent(key) + (court ? '&c=' + encodeURIComponent(court) : '');
  let slch = null;
  async function changed(msg) { toast(msg); try { slch && slch.ping(); } catch (e) {} await load(); }
  async function doMove(mid, court) { try { await P.moveMatch(slug, key, mid, court); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step11.sql first.' : (e.message || 'Could not move.')); return; } changed(court ? 'Moved to ' + court + '.' : 'Put back on its original court.'); }
  async function doAdd(court, t1, t2, sport) {
    if (!t1.trim() || !t2.trim()) { toast('Type both teams.'); return; }
    try { await P.addExtraMatch(slug, key, court, t1.trim(), t2.trim(), sport, new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })); } catch (e) { toast(/function|schema cache/i.test(e.message || '') ? 'Run supabase-step11.sql first.' : (e.message || 'Could not add.')); return; }
    changed('Added to ' + court + '.');
  }
  async function doRemove(mid) { if (!confirm('Remove this extra match?')) return; try { await P.removeExtraMatch(slug, key, mid); } catch (e) { toast(e.message || 'Could not remove.'); return; } changed('Extra match removed.'); }
  async function copy(t, msg) { try { await navigator.clipboard.writeText(t); toast(msg); } catch (e) { prompt('Copy this link', t); } }
  function courtsOf() {
    const by = {};
    (data.matches || []).forEach(m => { (by[m.court] = by[m.court] || []).push(m); });
    Object.values(by).forEach(a => a.sort((x, y) => (x.slot - y.slot) || String(x.time).localeCompare(String(y.time))));
    return Object.keys(by).sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true })).map(c => ({ name: c, list: by[c] }));
  }

  let pressing = false, dirty = false;
  document.addEventListener('pointerdown', () => { pressing = true; });
  document.addEventListener('pointerup', () => { pressing = false; if (dirty) paint(); });
  document.addEventListener('pointercancel', () => { pressing = false; });
  function paint() {
    if (pressing) { dirty = true; return; } dirty = false;
    const app = $('#app');
    if (err && !data) { app.innerHTML = '<div class="msg">' + esc(err) + '</div>'; return; }
    if (!data) return;
    $('#ttl').innerHTML = 'Match Control<small>' + esc(data.name) + '</small>';
    const courts = courtsOf(), all = data.matches || [];
    const nLive = all.filter(m => state(m) === 'live').length, nDone = all.filter(m => state(m) === 'done').length;
    const alerts = [];
    const cards = courts.map(ct => {
      const live = ct.list.find(m => state(m) === 'live');
      const upcoming = ct.list.filter(m => state(m) === 'up' && ready(m));
      const cur = live || upcoming[0] || null, rest = upcoming.filter(m => m !== cur).slice(0, 3);
      const doneN = ct.list.filter(m => state(m) === 'done').length;
      let cls = '', pill = cur ? (live ? '<span class="pill live">LIVE</span>' : '<span class="pill">Up next</span>') : '<span class="pill">' + (doneN === ct.list.length ? 'All done' : 'Waiting') + '</span>';
      let h = '', clk = cur ? clocks[cur.mid] : null, on = fresh(clk);
      if (cur) {
        const s = score(cur);
        h += '<div class="lbl">' + (live ? 'Playing now' : 'Up next') + ' · ' + esc(cur.time) + '</div><div class="meta" style="margin-bottom:2px">' + esc(cur.bracket) + '</div><div class="tms"><div class="tm"><b>' + esc(cur.t1) + '</b>' + (s ? '<em>' + s.s1 + '</em>' : '') + '</div><div class="tm"><b>' + esc(cur.t2) + '</b>' + (s ? '<em>' + s.s2 + '</em>' : '') + '</div></div>';
        if (live) cls = 'live';
        if (on) {
          const dl = left(clk, 'dLeft'), ml = left(clk, 'mLeft');
          if (ml != null) { const over = ml <= 0; cls = over ? 'over' : 'med'; pill = '<span class="pill ' + (over ? 'over' : 'med') + '">' + (over ? 'MEDICAL OVER' : 'MEDICAL') + '</span>'; h += '<div class="clock ' + (over ? 'over' : 'med') + '"><b data-cd="mLeft" data-mid="' + esc(cur.mid) + '" data-over="' + (over ? 1 : 0) + '">' + mmss(ml) + '</b>Medical timeout: ' + esc(clk.mWho) + (over ? '. Time is up.' : '') + '</div>'; if (over) alerts.push(ct.name + ': medical timeout is over (' + clk.mWho + ')'); }
          if (dl != null) { const over = dl <= 0; cls = over ? 'over' : (cls === 'med' ? cls : 'warn'); pill = '<span class="pill ' + (over ? 'over' : 'warn') + '">' + (over ? 'DEFAULT TIME UP' : 'DEFAULT TIMER') + '</span>'; h += '<div class="clock ' + (over ? 'over' : 'warn') + '"><b data-cd="dLeft" data-mid="' + esc(cur.mid) + '" data-over="' + (over ? 1 : 0) + '">' + mmss(dl) + '</b>' + (over ? 'Time is up. Not here: ' : 'Waiting for: ') + esc((clk.missing || []).join(', ') || 'nobody') + '</div>'; if (over) alerts.push(ct.name + ': default time is up (' + (clk.missing || []).join(', ') + ')'); }
          if (ml == null && dl == null) h += '<div class="clock">' + (clk.allHere ? 'Everyone is on court.' : 'Not here yet: ' + esc((clk.missing || []).join(', ') || 'nobody')) + '</div>';
        } else if (!live) h += '<div class="meta" style="margin-top:6px">Umpire has not opened this match yet.</div>';
        const btn = [];
        if (!live && ready(cur)) btn.push('<button class="go" data-call="' + esc(cur.mid) + '">Call to court</button>');
        if (on && state(cur) !== 'done') {
          if (clk.dLeft == null && !clk.allHere && !live) btn.push('<button data-c="dstart" data-m="' + esc(cur.mid) + '">Start 5:00 default timer</button>');
          if (clk.dLeft != null && clk.dLeft <= 0 && !clk.allHere) btn.push('<button data-c="dext" data-m="' + esc(cur.mid) + '">Extend another 5:00</button>');
          if (clk.dLeft != null) btn.push('<button class="stop" data-c="dstop" data-m="' + esc(cur.mid) + '">Stop timer</button>');
          if (!clk.allHere) btn.push('<button class="ok" data-c="all" data-m="' + esc(cur.mid) + '">Everyone is here</button>');
          if (clk.mLeft != null) btn.push('<button class="stop" data-c="mstop" data-m="' + esc(cur.mid) + '">End medical timeout</button>');
        }
        if (on && clk.dLeft != null && left(clk, 'dLeft') <= 0 && state(cur) !== 'done') {
          const ds = clk.defSides || [];
          if (ds.length === 1) btn.unshift('<button class="stop" data-def="' + esc(cur.mid) + '" data-side="' + ds[0] + '">Record default: ' + esc(ds[0] === 0 ? cur.t1 : cur.t2) + ' loses ' + target(cur) + '-0</button>');
          else if (ds.length > 1) h += '<div class="clock over">Both teams are missing. Pick who defaults below, or decide manually.</div>';
        }
        if (btn.length) h += '<div class="btns">' + btn.join('') + '</div>';
      } else h += '<div class="meta">' + (doneN ? 'All ' + doneN + ' matches on this court are finished.' : 'No matches ready on this court.') + '</div>';
      h += '<div class="next"><div class="lbl" style="margin-top:0">Coming up</div>' + [0, 1, 2].map(n => { const m = rest[n]; return m ? '<div class="q"><span>' + esc(String(m.time).split(' - ')[0]) + '</span><p>' + esc(m.t1) + ' vs ' + esc(m.t2) + '</p></div>' : '<div class="q" style="display:block">' + (n === 0 ? '<span style="font-weight:500">Nothing else ready yet</span>' : '') + '</div>'; }).join('') + '</div>';
      h += '<div class="foot"><div class="meta">' + doneN + ' of ' + ct.list.length + ' finished</div><div class="prog"><i style="width:' + (ct.list.length ? Math.round(doneN * 100 / ct.list.length) : 0) + '%"></i></div>';
      const movable = ct.list.filter(m => state(m) !== 'done'), others = courts.filter(x => x.name !== ct.name), sp = (ct.list[0] && ct.list[0].sport) || 'badminton';
      h += '<details class="tools" data-tc="' + esc(ct.name) + '"' + (openMore['t:' + ct.name] ? ' open' : '') + '><summary>More options</summary>';
      if (cur && state(cur) !== 'done') h += '<h4>Record a default</h4><div class="btns" style="margin-bottom:4px"><button class="stop" data-def="' + esc(cur.mid) + '" data-side="0">' + esc(cur.t1) + ' defaults</button><button class="stop" data-def="' + esc(cur.mid) + '" data-side="1">' + esc(cur.t2) + ' defaults</button></div><div class="meta" style="margin-bottom:10px">Counts as ' + target(cur) + ' - 0 for the other team.</div>';
      h += '<h4>Move a match to another court</h4>' + (movable.length && others.length ? '<div class="row"><select data-mv="' + esc(ct.name) + '">' + movable.map(m => '<option value="' + esc(m.mid) + '">' + esc(m.time) + ' · ' + esc(m.t1 || 'TBD') + ' vs ' + esc(m.t2 || 'TBD') + (m.moved ? ' (moved from ' + esc(m.from) + ')' : '') + '</option>').join('') + '</select><select data-to="' + esc(ct.name) + '">' + others.map(x => '<option>' + esc(x.name) + '</option>').join('') + '</select></div><div class="btns"><button class="go" data-domove="' + esc(ct.name) + '">Move match</button><button data-back="' + esc(ct.name) + '">Put back on original court</button></div>' : '<div class="meta" style="margin-bottom:10px">Nothing to move here.</div>');
      h += '<h4 style="margin-top:12px">Add an extra match here</h4><div class="row"><input data-x1="' + esc(ct.name) + '" placeholder="Team 1 (e.g. Ann / Ben)"><input data-x2="' + esc(ct.name) + '" placeholder="Team 2"></div><div class="row"><select data-xs="' + esc(ct.name) + '"><option value="badminton"' + (sp === 'pickleball' ? '' : ' selected') + '>Badminton</option><option value="pickleball"' + (sp === 'pickleball' ? ' selected' : '') + '>Pickleball</option></select></div><div class="btns"><button class="go" data-doadd="' + esc(ct.name) + '">Add match</button></div>';
      const ex = ct.list.filter(m => m.extra && state(m) === 'up');
      if (ex.length) h += '<h4 style="margin-top:12px">Extra matches waiting</h4>' + ex.map(m => '<div class="row" style="align-items:center"><span style="flex:1">' + esc(m.t1) + ' vs ' + esc(m.t2) + '</span><button class="stop" style="padding:8px 12px;border-radius:10px;font-weight:800" data-rmx="' + esc(m.mid) + '">Remove</button></div>').join('');
      h += '<h4 style="margin-top:12px">Umpire missing?</h4><div class="btns"><button data-ulink="' + esc(ct.name) + '">Copy umpire link for ' + esc(ct.name) + '</button></div><div class="meta" style="margin:6px 0 10px">Send it to anyone. Opening it on their phone puts them on this court.</div></details></div>';
      return '<div class="court ' + cls + '"><div class="ch"><h2>' + esc(ct.name) + '</h2>' + pill + '</div>' + h + '</div>';
    });
    // sound once per new alert
    alerts.forEach(a => { if (!alarmed[a]) { alarmed[a] = 1; beep(); try { navigator.vibrate && navigator.vibrate([300, 100, 300]); } catch (e) {} } });
    Object.keys(alarmed).forEach(a => { if (!alerts.includes(a)) delete alarmed[a]; });
    const focus = document.activeElement && document.activeElement.tagName === 'BUTTON' ? 1 : 0;
    app.innerHTML = '<div class="sum"><span>Live <b>' + nLive + '</b></span><span>Finished <b>' + nDone + '</b> of <b>' + all.length + '</b></span><span>Courts <b>' + courts.length + '</b></span></div>' +
      (alerts.length ? '<div class="alerts">' + alerts.map(a => '<div class="alert">' + esc(a) + '</div>').join('') + '</div>' : '') +
      '<div class="grid">' + cards.join('') + '</div>' + (err ? '<p class="meta" style="text-align:center">Connection problem: ' + esc(err) + '. Showing the last data.</p>' : '');
    app.querySelectorAll('details.tools').forEach(d => d.addEventListener('toggle', () => { openMore['t:' + d.dataset.tc] = d.open; }));
    const val = (sel, c) => { const e = app.querySelector('[' + sel + '="' + c.replace(/"/g, '\\"') + '"]'); return e ? e.value : ''; };
    app.querySelectorAll('[data-domove]').forEach(b => b.onclick = () => doMove(val('data-mv', b.dataset.domove), val('data-to', b.dataset.domove)));
    app.querySelectorAll('[data-back]').forEach(b => b.onclick = () => doMove(val('data-mv', b.dataset.back), ''));
    app.querySelectorAll('[data-doadd]').forEach(b => b.onclick = () => doAdd(b.dataset.doadd, val('data-x1', b.dataset.doadd), val('data-x2', b.dataset.doadd), val('data-xs', b.dataset.doadd)));
    app.querySelectorAll('[data-rmx]').forEach(b => b.onclick = () => doRemove(b.dataset.rmx));
    app.querySelectorAll('[data-ulink]').forEach(b => b.onclick = () => copy(umpUrl(b.dataset.ulink), 'Umpire link for ' + b.dataset.ulink + ' copied.'));
    app.querySelectorAll('[data-call]').forEach(b => b.onclick = () => call(all.find(m => m.mid === b.dataset.call)));
    app.querySelectorAll('details.more').forEach(d => d.addEventListener('toggle', () => { openMore[d.dataset.mid] = d.open; }));
    app.querySelectorAll('[data-def]').forEach(b => b.onclick = () => recordDefault(all.find(m => m.mid === b.dataset.def), +b.dataset.side));
    app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => cmd(b.dataset.m, b.dataset.c));
  }

  if (!slug || !key) { $('#app').innerHTML = '<div class="msg">This link is incomplete. Open Match Control from the "Live scoring for umpires" box in Draw &amp; Schedule.</div>'; return; }
  if (!P || !P.configured) { $('#app').innerHTML = '<div class="msg">The cloud is not connected.</div>'; return; }
  try { ctl = P.liveChannel('ctl-' + slug + '-' + key, onCk); } catch (e) {}
  try { slch = P.liveChannel('slive-' + slug, () => load()); } catch (e) {}
  load();
  setInterval(() => { if (!document.hidden) load(); }, 10000);
  setInterval(() => {                                           // countdowns tick every second without redrawing the buttons
    if (document.hidden || !data) return; let cross = false;
    document.querySelectorAll('[data-cd]').forEach(el => { const c = clocks[el.dataset.mid]; if (!c) return; const l = left(c, el.dataset.cd); if (l == null) return; el.textContent = mmss(l); if (l <= 0 && el.dataset.over === '0') cross = true; });
    if (cross) paint();
  }, 1000);
})();
</script>
</body>
</html>
