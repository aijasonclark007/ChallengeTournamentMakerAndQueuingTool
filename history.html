<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Results history</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#1C1C1E;--mute:#6C6C72;--line:#D5DCE8;--blue:#007AFF;--green:#1E8E3E;--gold:#B7791F;--red:#B42318}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--ink:#F2F2F7;--mute:#98989F;--line:#38383A;--blue:#0A84FF;--green:#30D158;--gold:#E3B341;--red:#FF6961}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:20px 16px 60px}h1{font-size:26px;margin:0 0 4px}p.s{color:var(--mute);margin:0 0 16px}
a{color:var(--blue)}input[type=search]{width:100%;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;outline:none}
input[type=search]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.18)}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin:14px 0}
.card h2{font-size:18px;margin:0}.meta{color:var(--mute);font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ch{margin:10px 0 0;font-size:15px}.ch b{color:var(--gold)}
details{margin-top:10px;border-top:1px solid var(--line)}summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 10px}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
td.n,th.n{text-align:right}.adv{color:var(--green);font-weight:700}.out{color:var(--mute);text-decoration:line-through}
h3{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:12px 0 2px}
button{font:600 14px inherit;font-family:inherit;border:0;background:none;color:var(--red);cursor:pointer;padding:6px 0}
.pl{border-top:1px solid var(--line);padding:10px 0}.pl:first-child{border-top:0}.pl b{font-weight:700}.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;margin-left:6px;background:rgba(30,142,62,.14);color:var(--green)}.tag.gold{background:rgba(183,121,31,.16);color:var(--gold)}
.msg{color:var(--mute);padding:20px 0;text-align:center}
</style></head><body><div class="w">
<h1>Results history</h1><p class="s">Every event you saved from Draw &amp; Schedule (Standings, Save to history). <a href="schedule.html">Back to Draw &amp; Schedule</a></p>
<input id="q" type="search" placeholder="Find a player (name)" aria-label="Find a player" autocomplete="off">
<div id="out"><div class="msg">Loading…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
const $ = s => document.querySelector(s), E = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nrm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
let EVS = [];
const win = g => g.s1 === g.s2 ? '' : g.s1 > g.s2 ? g.t1 : g.t2;
// who won each level's final (the knockout game with the highest round, last in the list)
function champs(ev) {
  const ko = (ev.data && ev.data.knockout) || [], by = {};
  ko.forEach(g => { if (!by[g.level] || g.round >= by[g.level].round) by[g.level] = g; });
  return Object.keys(by).map(l => ({ level: l, team: win(by[l]), round: by[l].roundName })).filter(c => c.team && /final/i.test(c.round || ''));
}
const dateTxt = ev => { const d = ev.event_date ? new Date(ev.event_date + 'T12:00:00') : null; return d && !isNaN(d) ? d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : 'No date'; };
function stTable(rows) {
  return '<table><tr><th>#</th><th>Team</th><th class="n">W</th><th class="n">L</th><th class="n">+/-</th></tr>' + rows.map(r => '<tr><td>' + r.rank + '</td><td class="' + (r.withdrew ? 'out' : r.advanced ? 'adv' : '') + '">' + E(r.team) + '</td><td class="n">' + r.won + '</td><td class="n">' + r.lost + '</td><td class="n">' + (r.pf - r.pa) + '</td></tr>').join('') + '</table>';
}
function eventCard(ev) {
  const d = ev.data || {}, st = d.standings || [], groups = {};
  st.forEach(r => { (groups[r.level + ' · ' + r.group] = groups[r.level + ' · ' + r.group] || []).push(r); });
  const ch = champs(ev);
  return '<div class="card"><div class="row"><h2>' + E(ev.name || 'Tournament') + '</h2><span class="meta">' + E(dateTxt(ev)) + '</span></div>' +
    '<div class="meta">' + st.length + ' teams · ' + (d.games || []).length + ' group games · ' + (d.knockout || []).length + ' knockout games</div>' +
    (ch.length ? ch.map(c => '<div class="ch">🏆 <b>' + E(c.level) + '</b> ' + E(c.team) + '</div>').join('') : '') +
    '<details><summary>Standings</summary>' + Object.keys(groups).map(g => '<h3>' + E(g) + '</h3>' + stTable(groups[g])).join('') + '</details>' +
    '<button data-del="' + E(ev.id) + '">Delete this event</button></div>';
}
function playerView(q) {
  const k = nrm(q), hits = [];
  EVS.forEach(ev => {
    const d = ev.data || {};
    (d.standings || []).forEach(r => {
      if (!(r.players || []).some(p => nrm(p).includes(k))) return;
      const ko = (d.knockout || []).filter(g => g.t1 === r.team || g.t2 === r.team), best = ko.reduce((m, g) => !m || g.round >= m.round ? g : m, null);
      const w = ko.filter(g => win(g) === r.team).length, ch = best && /final/i.test(best.roundName || '') && win(best) === r.team;
      hits.push({ ev, r, ko, best, ch, w });
    });
  });
  if (!hits.length) return '<div class="msg">No player found for “' + E(q) + '”.</div>';
  const W = hits.reduce((t, h) => t + h.r.won + h.w, 0), L = hits.reduce((t, h) => t + h.r.lost + h.ko.length - h.w, 0), titles = hits.filter(h => h.ch).length;
  return '<div class="card"><h2>' + E(q) + '</h2><div class="meta">' + hits.length + ' appearance' + (hits.length === 1 ? '' : 's') + ' · record ' + W + '-' + L + (titles ? ' · ' + titles + ' title' + (titles === 1 ? '' : 's') : '') + '</div>' +
    hits.map(h => '<div class="pl"><b>' + E(h.ev.name) + '</b> <span class="meta">' + E(dateTxt(h.ev)) + '</span><br>' + E(h.r.level) + ' · ' + E(h.r.group) + ' · ' + E(h.r.players.join(' / ')) +
      '<br><span class="meta">Group: ' + h.r.won + '-' + h.r.lost + ' (rank ' + h.r.rank + ')</span>' + (h.r.advanced ? '<span class="tag">Advanced</span>' : '') +
      (h.best ? '<span class="tag' + (h.ch ? ' gold' : '') + '">' + (h.ch ? 'Champion' : 'Reached ' + E(h.best.roundName)) + '</span>' : '') + '</div>').join('') + '</div>';
}
function paint() {
  const q = $('#q').value.trim();
  $('#out').innerHTML = q.length >= 2 ? playerView(q) : (EVS.length ? EVS.map(eventCard).join('') : '<div class="msg">Nothing saved yet. In Draw &amp; Schedule open Standings and tap “Save to history”.</div>');
}
async function load() {
  if (!Platform.configured) { $('#out').innerHTML = '<div class="msg">The cloud is not connected yet.</div>'; return; }
  await Platform.whenReady();
  if (!Platform.user) { $('#out').innerHTML = '<div class="msg">Sign in first on <a href="schedule.html">Draw &amp; Schedule</a>, then come back here.</div>'; return; }
  try { EVS = await Platform.listEventResults(); paint(); }
  catch (e) { $('#out').innerHTML = '<div class="msg">' + (/relation|schema cache|event_results/i.test(e.message || '') ? 'Run supabase-step24.sql in Supabase first.' : E(e.message || 'Could not load.')) + '</div>'; }
}
$('#q').addEventListener('input', paint);
$('#out').addEventListener('click', async e => { const id = e.target.dataset && e.target.dataset.del; if (!id || !window.confirm('Delete this event from your history?')) return; try { await Platform.deleteEventResults(id); EVS = EVS.filter(x => x.id !== id); paint(); } catch (err) { window.alert(err.message || 'Could not delete.'); } });
load();
</script></body></html>
