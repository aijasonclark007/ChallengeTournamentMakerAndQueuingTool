<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>Umpire Scoring</title>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* stop iPhone Safari from enlarging text after a rotation */

:root{--navy:#007AFF;--lime:#34C759;--ink:#1C1C1E;--mute:#5F5F66;--line:rgba(60,60,67,.18);--red:#FF3B30;--bg:#F2F2F7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding:var(--sat,env(safe-area-inset-top)) 0 var(--sab,env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:17px;flex:1;line-height:1.2}.top small{display:block;font-weight:500;opacity:.75;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#7bd88f;flex:none;transition:background .2s}.dot.off{background:#ffb703}.dot.err{background:var(--red)}

.wrap{padding:14px 14px 40px;max-width:560px;margin:0 auto}
.msg{padding:40px 20px;text-align:center;color:var(--mute)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
h2{font-size:15px;color:var(--mute);margin:18px 2px 4px;text-transform:uppercase;letter-spacing:.06em}

#score.on{transform:none}
/* a short scroll runway behind the fixed score screen: one swipe lets Safari tuck its address/tab bars away, then nothing else moves */
#score{overflow:hidden;overscroll-behavior:none;touch-action:pan-y}html:has(#score.on),html:has(#score.on) body{overscroll-behavior:none}html:not(.framed):has(#score.on) body{height:auto;min-height:calc(100vh + 120px);min-height:calc(100dvh + 120px)}html.framed:has(#score.on),html.framed:has(#score.on) body{overflow:hidden}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff}
.sbar button{background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
.sbar .mid{flex:1;text-align:center;font-size:13px;opacity:.85}

.side{flex:1;border-radius:22px;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;user-select:none;transition:transform .12s,background .2s,border-color .2s}

.banner.on{display:block;animation:pop .35s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s;padding:20px}
#ov.on{visibility:visible;opacity:1}
#ov .sheet{background:#fff;border-radius:20px;padding:20px;max-width:380px;width:100%;transform:scale(.94);transition:transform .35s cubic-bezier(.22,1,.36,1)}#ov.on .sheet{transform:none}

.tag.s{background:var(--lime);color:#0B1B33}.tag.r{background:#fff;border:1.5px solid var(--lime);color:#2E7D32}
.side.serving{border-color:var(--lime)}
.side.flash:after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(141,198,63,.35);pointer-events:none;animation:flashfade .9s ease-out forwards}@keyframes flashfade{from{opacity:1}to{opacity:0}}
#sv{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:35;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s;padding:20px}#sv.on{visibility:visible;opacity:1}
#sv .sheet{background:#fff;border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:92vh;overflow:auto}#sv h3{margin:0 0 4px;font-size:20px}#sv p{margin:0 0 14px;color:var(--mute)}#sv .opts{display:grid;gap:8px;margin:0 0 12px}#sv .opts button{padding:15px;border-radius:14px;background:#EEF1F7;font-weight:800;font-size:17px}
#sv .opts button{transition:transform .2s,opacity .25s,background .2s,box-shadow .2s}
#sv .opts button:active{transform:scale(.96)}
#sv .opts.has-pick button:not(.picked){opacity:.3;transform:scale(.97)}
#sv .opts button.picked{background:var(--lime);color:#0B1B33;animation:pick .38s cubic-bezier(.22,1,.36,1)}
#sv .opts button.picked:after{content:" \2713";font-weight:900}

#sv .sheet.step{animation:stepin .3s cubic-bezier(.22,1,.36,1)}@keyframes stepin{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}

@media (orientation:landscape) and (max-height:560px){
  .srvbar{margin:6px max(12px,var(--sar,env(safe-area-inset-right))) 0 max(12px,var(--sal,env(safe-area-inset-left)));padding:5px 10px;font-size:13px}.srvbar small{display:none}

  .sbar{padding:6px max(12px,var(--sar,env(safe-area-inset-right))) 6px max(12px,var(--sal,env(safe-area-inset-left)))}.sbar button{padding:6px 12px}.sbar .mid{font-size:12px}
  .sides{flex-direction:row;gap:10px;padding:8px max(12px,var(--sar,env(safe-area-inset-right))) 8px max(12px,var(--sal,env(safe-area-inset-left)))}
  .side{min-width:0;justify-content:space-evenly;padding:6px 0}
  .side .nm{font-size:16px;line-height:1.2;padding:0 10px;max-height:2.4em;overflow:hidden}
  .side .pt{font-size:clamp(60px,34vh,150px);font-size:clamp(60px,34dvh,150px)}
  #toast{bottom:auto;top:calc(10px + var(--sat,env(safe-area-inset-top)))}
  .side .hint{position:static;font-size:11px}
  .banner{padding:6px 12px;font-size:13px;margin:0 max(12px,var(--sar,env(safe-area-inset-right))) 0 max(12px,var(--sal,env(safe-area-inset-left)))}
  .acts{padding:2px max(12px,var(--sar,env(safe-area-inset-right))) max(8px,var(--sab,env(safe-area-inset-bottom))) max(12px,var(--sal,env(safe-area-inset-left)))}.acts button{padding:10px 8px}
}
/* phone held upright: keep the top compact (the cards already show who serves and receives) */
@media (orientation:portrait){
  .sbar{padding:8px 12px}.sbar button{padding:7px 12px;font-size:14px}.sbar .mid{font-size:12px;line-height:1.25}
  .srvbar{margin:6px 12px 0;padding:7px 12px;font-size:13.5px;line-height:1.25}.srvbar small{display:none}.srvbar button{padding:6px 11px;font-size:12.5px}
  .srvbar span b:last-of-type{font-weight:700}
  .side .nm{font-size:18px;padding:0 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qform{background:#fff;border-radius:20px;padding:16px;margin:10px 0 6px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.qform h3{margin:0 0 10px;font-size:18px}.qform label{display:block;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}
.qform input,.qform select{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;margin-bottom:6px}
.sportnote{font-weight:800;margin:2px 0 10px}.sportnote span{color:var(--mute);font-weight:600;font-size:13px}.qform .sp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qform .sp button{padding:14px 8px;border-radius:14px;background:#EEF1F7;font-weight:800;font-size:16px;border:2px solid transparent;transition:transform .35s cubic-bezier(.22,1,.36,1),background .2s,border-color .2s}
.qform .sp button.on{background:#fff;border-color:var(--blue,#007AFF);box-shadow:0 0 0 4px rgba(0,122,255,.12)}.qform .sp button:active{transform:scale(.96)}
.qform .go{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--lime);color:#0B1B33;font-weight:900;font-size:17px}
/* court clock: attendance, 5-minute default timer, 5-minute medical timeout */
.clk{display:flex;gap:8px;margin:8px 12px 0}.clk:empty{display:none}
.clk button{flex:1;padding:9px 10px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:13.5px;line-height:1.2}
.clk button.run{border-color:#FF9500;background:#FFF4D6;color:#6b4a00;font-variant-numeric:tabular-nums}
.clk button.med{border-color:#007AFF;background:#E8F2FF;color:#0A4FA8;font-variant-numeric:tabular-nums}
.clk button.over{border-color:#FF3B30;background:#FFE5E3;color:#B3261E;animation:pulse 1s infinite}
#ck{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:36;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
#ck.on{visibility:visible;opacity:1}
#ck .sheet{background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--sab,env(safe-area-inset-bottom)));max-width:520px;width:100%;max-height:92vh;overflow:auto;transform:translateY(30px);transition:transform .35s cubic-bezier(.22,1,.36,1)}#ck.on .sheet{transform:none}
#ck h3{margin:0 0 4px;font-size:20px}#ck h4{margin:18px 0 8px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#ck .who{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;margin:0 0 8px;border-radius:14px;background:#EEF1F7;border:2px solid transparent;font-weight:700;font-size:16px;text-align:left}
#ck .who span{font-size:13px;font-weight:800;color:var(--mute)}#ck .who.here{background:#EAF7D6;border-color:#8DC63F}#ck .who.here span{color:#2E7D32}
#ck .big{font-size:54px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;margin:6px 0}
#ck .big.over{color:#B3261E}#ck .note{text-align:center;color:var(--mute);font-size:14px;margin:0 0 10px}
#ck .res{padding:12px 14px;border-radius:14px;background:#FFE5E3;color:#B3261E;font-weight:800;margin:8px 0}
#ck .res.ok{background:#EAF7D6;color:#2E7D32}
#ck .b2{display:flex;gap:8px;margin-top:8px}#ck .b2 button{flex:1;padding:14px 10px;border-radius:14px;font-weight:800;background:#EEF1F7;font-size:15px}
#ck .b2 .go{background:#FF9500;color:#fff}#ck .b2 .med{background:#007AFF;color:#fff}#ck .b2 .stop{background:#FFE5E3;color:#B3261E}
#ck select{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px}
#ck .log{font-size:13px;color:var(--mute);margin-top:8px}
@media (orientation:landscape) and (max-height:560px){.clk{margin:4px max(12px,var(--sar,env(safe-area-inset-right))) 0 max(12px,var(--sal,env(safe-area-inset-left)))}.clk button{padding:5px 8px;font-size:12.5px}}
/* score cards: name, serving pill and score always fit inside the card (the card height changes with the clock bar and phone size) */
.side{container-type:size;gap:2px;padding:6px 0;box-sizing:border-box}
.side .nm{line-height:1.15;max-height:2.3em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:none}
.side .tag{margin-top:2px;flex:none;line-height:1.25;text-align:center}
.side .pt{flex:none;line-height:.9;font-size:clamp(48px,calc(100cqh - 98px),170px)}
.side .hint{position:static;flex:none;line-height:1.2}
@media (max-height:780px){.side .hint{display:none}}
@media (orientation:landscape) and (max-height:560px){.side .pt{font-size:clamp(44px,calc(100cqh - 74px),150px)}.side .nm{font-size:15px}}
.qclr{display:block;margin:18px auto 0;background:none;color:var(--mute);font-weight:700;padding:10px}
</style>
<style>.annu{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:60;background:#FF9500;color:#1b1200;border-radius:14px;padding:11px 14px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:none}.annu.on{display:block}.annu small{display:block;font-weight:600;opacity:.7;margin-top:2px}
a,button,.side,.q,.court,.pillbtn,[role=button]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.view,.sheet,.nthumb,.thumb,.findbox{backface-visibility:hidden}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}</style></head>
<body>
<div class="top"><h1 id="ttl">Umpire scoring<small id="sub"></small></h1><span class="dot" id="dot" title="Connection"></span></div>
<style>#score .sbar{padding-top:calc(var(--sat,env(safe-area-inset-top)) + 8px)}</style>
<div id="netbar" role="status"></div>
<div class="wrap" id="list"><div class="msg">Loading...</div></div>

<div id="score" aria-live="polite">
  <div class="sbar"><button id="back">Back</button><div class="mid" id="smid"></div><button id="swap">Swap sides</button></div>
  <div id="netbar2" class="netbar" role="status"></div>
  <div class="clk" id="clk"></div>
  <div class="srvbar" id="srvbar"></div>
  <div class="sides" id="sides"></div>
  <div class="banner" id="ban"></div>
  <div class="acts"><button id="undo">Undo</button><button id="rst">Cancel live</button><button class="fin" id="fin">Finish match</button></div>
</div>
<div id="ov"><div class="sheet"><h3 id="ovT"></h3><p id="ovP"></p><div class="row"><button id="ovNo">Keep scoring</button><button class="go" id="ovYes">Finish</button></div></div></div>
<div id="sv"><div class="sheet"><h3 id="svT"></h3><p id="svP"></p><div class="opts" id="svO"></div></div></div>
<div id="ck"><div class="sheet" id="ckS"></div></div>
<div class="annu" id="annu"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="sports/badminton/rules.js"></script>
<script src="sports/pickleball/rules.js"></script>
<script src="haptics.js"></script>
<script src="sports/sports.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), quick = q.get('quick') === '1';           // quick = the Scoring tab: type the players' names and score, no tournament or account needed
  const slug = quick ? 'quick' : q.get('s'), key = quick ? 'quick' : q.get('k'), court = quick ? null : q.get('c');
  const QK = 'quick.v1', qload = () => { try { return JSON.parse(localStorage.getItem(QK) || 'null') || { matches: [], scores: {} }; } catch (e) { return { matches: [], scores: {} }; } }, qsave = d => { try { localStorage.setItem(QK, JSON.stringify(d)); } catch (e) {} };
  const P = quick ? { configured: true, umpireGet: async () => { const d = qload(); return { name: 'Scoring', matches: d.matches, scores: Object.values(d.scores) }; },
    umpireScore: async (sl, k, id, a, b, st) => { const d = qload(); d.scores[id] = { id, s1: a, s2: b, status: st }; qsave(d); },
    umpireReset: async (sl, k, id) => { const d = qload(); delete d.scores[id]; qsave(d); }, liveChannel: () => ({ ping() {} }) } : window.Platform;
  const $ = s => document.querySelector(s), TARGET = Sports.get('badminton').target, MID = Sports.get('badminton').swapAt;   // first to 31 wins, sudden death
  const defSport = Sports.current;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const buzz = p => { try { Haptics.buzz(p); } catch (e) {} };
  let swapAsked = false, swapOpen = false, data = null, scores = {}, cur = null, s1 = 0, s2 = 0, hist = [], sv = null, flipped = false, wake = null, timer = null;
  const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); };
  const dot = k => { $('#dot').className = 'dot' + (k ? ' ' + k : ''); };

  // ----- offline safety: every score is written to this phone first, then sent whenever there is a connection -----
  const OUT = 'ump.out.' + slug, CACHE = 'ump.data.' + slug + '.' + key;
  const readOut = () => { try { return JSON.parse(localStorage.getItem(OUT) || '{}') || {}; } catch (e) { return {}; } };
  const writeOut = o => { try { if (Object.keys(o).length) localStorage.setItem(OUT, JSON.stringify(o)); else localStorage.removeItem(OUT); } catch (e) {} };
  const pendingN = () => Object.keys(readOut()).length;
  let flushing = null, netErr = false;
  function paintNet() {
    const n = pendingN(), off = !navigator.onLine || netErr;
    const msg = off ? (n ? 'Offline. ' + n + (n === 1 ? ' score is' : ' scores are') + ' saved on this phone and will be sent when you are back online.' : (!navigator.onLine ? 'Offline. Showing the saved schedule.' : '')) : '';   // quiet while online: scores still save and send in the background
    ['#netbar', '#netbar2'].forEach(sel => { const e = $(sel); if (e) { e.textContent = msg; e.classList.toggle('on', !!msg); e.classList.toggle('warn', off); } });

  const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  const ckAllHere = () => ckPeople().every(p => ck.att[p.name]);
  function ckDefaulted() {                      // a team defaults when any of its players is missing
    const out = [];
    [cur.t1, cur.t2].forEach((n, side) => { const miss = ckPeople().filter(p => p.side === side && !ck.att[p.name]).map(p => p.name); if (miss.length) out.push({ team: n, side, miss }); });
    return out;
  }
  function beep() { try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; const c = new A(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .25; o.start(); setTimeout(() => { try { o.stop(); c.close(); } catch (e) {} }, 1100); } catch (e) {} }
  function ckAlarm(msg) { buzz([300, 120, 300, 120, 500]); beep(); toast(msg); }
  function ckStarted() { return s1 + s2 > 0; }
  function ckPaint() {
    const bar = $('#clk'); if (!bar) return;
    if (!cur || !ck || (scores[cur.mid] && scores[cur.mid].status === 'done')) { bar.innerHTML = ''; return; }
    const now = Date.now(); let h = '';
    if (ck.mEnd) { const left = ck.mEnd - now; h += '<button type="button" data-ck class="' + (left <= 0 ? 'over' : 'med') + '">' + (left <= 0 ? 'Medical time is up' : 'Medical ' + mmss(left)) + '</button>'; }
    if (ck.dEnd) { const left = ck.dEnd - now; h += '<button type="button" data-ck class="' + (left <= 0 ? 'over' : 'run') + '">' + (left <= 0 ? 'Default time is up' : 'Default ' + mmss(left)) + '</button>'; }
    if (!ck.mEnd && !ck.dEnd) {
      if (!ckStarted() && !ckAllHere()) h += '<button type="button" data-ck>Check-in &amp; default timer</button>';
      h += '<button type="button" data-ck>Medical timeout</button>';
    }
    bar.innerHTML = h; bar.querySelectorAll('[data-ck]').forEach(b => b.onclick = ckOpen);
  }
  function ckApply(k, who) {                              // one place for every clock action (buttons here, or commands from the Match Control page)
    if (k === 'all') { ckPeople().forEach(p => { ck.att[p.name] = true; }); if (ck.dEnd) { ck.dEnd = null; ck.dOver = false; } ck.dOk = true; }
    else if (k === 'dstart') { ck.dEnd = Date.now() + CK_SECS * 1000; ck.dOver = false; ck.dOk = false; ck.dExt = false; }
    else if (k === 'dext') { if (ck.dEnd && ck.dEnd <= Date.now() && !ck.dExt) { ck.dExt = true; ck.dEnd = Date.now() + CK_SECS * 1000; ck.dOver = false; ck.log.push('Default timer extended by 5:00'); } }
    else if (k === 'dstop') { ck.dEnd = null; ck.dOver = false; }
    else if (k === 'mstart') { ck.mWho = who || ''; ck.mEnd = Date.now() + CK_SECS * 1000; ck.mOver = false; ck.mAt = Date.now(); }
    else if (k === 'mstop') { if (ck.mEnd) { const used = Math.min(CK_SECS, Math.round((Date.now() - ck.mAt) / 1000)); ck.log.push('Medical timeout: ' + ck.mWho + ', ' + Math.floor(used / 60) + ':' + String(used % 60).padStart(2, '0') + ' used'); } ck.mEnd = null; ck.mOver = false; }
  }
  // ----- talking to the Match Control page (a private channel: only people with the umpire link can join) -----
  let ctl = { ping() {} };
  const called = {};
  function ckBroadcast() {
    if (quick || !cur) return;
    if (!ck) { ctl.ping({ t: 'ck', mid: cur.mid, closed: true }); return; }
    const now = Date.now(), d = ckDefaulted();
    ctl.ping({ t: 'ck', mid: cur.mid, court: cur.court, t1: cur.t1, t2: cur.t2, s1, s2, here: ckPeople().map(p => [p.name, !!ck.att[p.name]]),
      dLeft: ck.dEnd ? ck.dEnd - now : null, mLeft: ck.mEnd ? ck.mEnd - now : null, mWho: ck.mWho || '', missing: d.flatMap(x => x.miss), defSides: d.map(x => x.side), allHere: ckAllHere(),
      flip: flipped, won: won(), srv: (sv && !won()) ? (() => { const w = svWho(sv, s1, s2); return { k: sv.k, server: w.server, recv: w.recv, court: w.court }; })() : null });
  }
  function ckCommand(p) {
    if (!p || !p.t) return;
    if (p.t === 'call') {
      called[p.mid] = true; buzz([200, 100, 200]); toast('Called to court: ' + (p.label || 'your next match'));
      if (cur && cur.mid === p.mid && ck && !ck.dEnd && !ckAllHere()) { ckApply('dstart'); ckSave(); ckPaint(); ckBroadcast(); }
      if (!cur && data) renderList();
    } else if (p.t === 'defrec' && cur && cur.mid === p.mid) {      // the organizer recorded a default for this match
      scores[cur.mid] = { id: cur.mid, s1: p.s1, s2: p.s2, status: 'done' }; buzz([100, 60, 100]); toast('Match recorded as a default: ' + p.s1 + ' - ' + p.s2); closeMatch();
    } else if (p.t === 'cmd' && cur && ck && cur.mid === p.mid) {
      ckApply(p.cmd, p.who); ckSave(); ckPaint(); if ($('#ck').classList.contains('on')) ckSheet(); ckBroadcast();
      buzz([60, 40, 60]); toast('Match Control: ' + ({ dstart: 'default timer started', dstop: 'timer stopped', dext: 'timer extended 5 minutes', all: 'everyone marked here', mstop: 'medical timeout ended' }[p.cmd] || 'clock updated'));
    }
  }
  function ckSheet() {
    const now = Date.now(), ppl = ckPeople(), dLeft = ck.dEnd ? ck.dEnd - now : 0, mLeft = ck.mEnd ? ck.mEnd - now : 0;
    let h = '<h3>Court clock</h3><p style="margin:0 0 4px;color:var(--mute)">' + esc(cur.t1) + ' vs ' + esc(cur.t2) + '</p>';
    h += '<h4>Who is on court</h4>' + ppl.map((p, i) => '<button type="button" class="who' + (ck.att[p.name] ? ' here' : '') + '" data-who="' + i + '">' + esc(p.name) + '<span>' + (ck.att[p.name] ? 'Here \u2713' : 'Not here') + '</span></button>').join('');
    h += '<div class="b2"><button type="button" data-ca="all">Everyone is here</button></div>';
    h += '<h4>Default timer (5 minutes)</h4>';
    if (ck.dEnd) {
      const over = dLeft <= 0;
      h += '<div class="big' + (over ? ' over' : '') + '" id="ckDt">' + (over ? '0:00' : mmss(dLeft)) + '</div>';
      if (over) { const d = ckDefaulted(); h += '<div class="res">Time is up. ' + (d.length ? d.map(x => esc(x.team) + ' defaults (' + esc(x.miss.join(', ')) + ' not here)').join('. ') + '.' : 'Everyone is here.') + '</div><p class="note">Use Cancel match or Finish match to close it out as the organizer decides.</p>'; if (!ck.dExt && d.length) h += '<div class="b2"><button type="button" class="go" data-ca="dext">Extend another 5:00</button></div>'; }
      else { const d = ckDefaulted(); h += '<p class="note">Still missing: ' + (d.length ? esc(d.flatMap(x => x.miss).join(', ')) : 'nobody') + '. Tick each player as they arrive.</p>'; }
      h += '<div class="b2"><button type="button" class="stop" data-ca="dstop">Stop timer</button></div>';
    } else if (ck.dOk || ckAllHere()) h += '<div class="res ok">Everyone is here. No default timer needed.</div>';
    else h += '<p class="note">Start when the match is called. Players missing at 0:00 default.</p><div class="b2"><button type="button" class="go" data-ca="dstart">Start 5:00 default timer</button></div>';
    h += '<h4>Medical timeout (5 minutes)</h4>';
    if (ck.mEnd) {
      const over = mLeft <= 0;
      h += '<div class="big' + (over ? ' over' : '') + '" id="ckMt">' + (over ? '0:00' : mmss(mLeft)) + '</div><p class="note">' + esc(ck.mWho) + (over ? ': time is up. They must resume or retire.' : ' is receiving treatment.') + '</p>';
      h += '<div class="b2"><button type="button" class="stop" data-ca="mstop">Play resumes</button></div>';
    } else {
      h += '<select id="ckWho" aria-label="Who needs the timeout">' + ppl.map(p => '<option>' + esc(p.name) + '</option>').join('') + '</select><div class="b2"><button type="button" class="med" data-ca="mstart">Start 5:00 medical timeout</button></div>';
    }
    if (ck.log.length) h += '<div class="log">' + ck.log.map(x => esc(x)).join('<br>') + '</div>';
    h += '<div class="b2" style="margin-top:16px"><button type="button" data-ca="close">Close</button></div>';
    $('#ckS').innerHTML = h;
  }
  function ckOpen() { if (!cur || !ck) return; ckSheet(); $('#ck').classList.add('on'); }
  function ckClose() {                                   // closing the clock on a new match leads to the toss, unless the default timer is still counting
    $('#ck').classList.remove('on');
    if (ckToss && cur && ck && !ck.dEnd && sv === null && s1 + s2 === 0) { ckToss = false; setTimeout(() => setServe(), 250); }
  }
  $('#ck').addEventListener('click', e => {
    if (e.target.id === 'ck') return;   // tapping the background never closes it; use the Close button
    if (!cur || !ck) return;
    const w = e.target.closest('[data-who]'), a = e.target.closest('[data-ca]');
    if (w) {
      const p = ckPeople()[+w.dataset.who]; ck.att[p.name] = !ck.att[p.name]; buzz(10);
      if (ck.dEnd && ckAllHere()) { ck.dEnd = null; ck.dOver = false; ck.dOk = true; toast('Everyone is here. Default timer stopped.'); }
    } else if (a) {
      const k = a.dataset.ca; buzz(10);
      if (k === 'close') { ckClose(); return; }
      ckApply(k, ($('#ckWho') || {}).value);
    } else return;
    ckSave(); ckSheet(); ckPaint();
    if (ckToss && ckAllHere() && !ck.dEnd) setTimeout(ckClose, 500);
  });
  function ckStart() {
    ckLoad(); clearInterval(ckTick);
    ckTick = setInterval(() => {
      if (!cur || !ck) return; const now = Date.now(); let ch = false;
      if (ck.dEnd && now >= ck.dEnd && !ck.dOver) { ck.dOver = true; ch = true; const d = ckDefaulted(); ckAlarm('Default time is up. ' + (d.length ? d.map(x => x.team).join(' and ') + ' default.' : '')); }
      if (ck.mEnd && now >= ck.mEnd && !ck.mOver) { ck.mOver = true; ch = true; ckAlarm('Medical timeout is over: ' + ck.mWho); }
      if (ch) { ckSave(); if ($('#ck').classList.contains('on')) ckSheet(); }
      else if ($('#ck').classList.contains('on')) { const d = $('#ckDt'), m = $('#ckMt'); if (d && ck.dEnd) d.textContent = mmss(ck.dEnd - now); if (m && ck.mEnd) m.textContent = mmss(ck.mEnd - now); }
      ckPaint(); if (++ckN % 5 === 0) ckBroadcast();
    }, 1000);
    ckPaint(); ckBroadcast();
  }
  function ckStop() { clearInterval(ckTick); ckTick = null; const was = ck; ck = null; ckToss = false; if (was && cur) ctl.ping({ t: 'ck', mid: cur.mid, closed: true }); $('#ck').classList.remove('on'); const b = $('#clk'); if (b) b.innerHTML = ''; }
  async function openMatch(mid) {
    cur = (data.matches || []).find(m => m.mid === mid); if (!cur) return;
    const sv0 = scores[mid] || (cur.res ? { s1: cur.res.a, s2: cur.res.b, status: 'done' } : null);
    s1 = sv0 ? sv0.s1 : 0; s2 = sv0 ? sv0.s2 : 0; hist = []; flipped = false; sv = null; swapAsked = Math.max(s1, s2) >= MID; swapOpen = false;
    try { const l = JSON.parse(localStorage.getItem('ump.' + slug + '.' + mid) || 'null'); if (l && ((sv0 && l.s1 === s1 && l.s2 === s2) || (!sv0 && !l.s1 && !l.s2))) { hist = l.hist || []; sv = l.sv === undefined ? null : l.sv; } } catch (e) {}
    $('#smid').textContent = cur.court + ' · ' + cur.time + ' · ' + cur.bracket;
    $('#score').classList.add('on'); paint(); ckStart(); fullScreen(true);
    if ((!sv0 || sv0.status !== 'done') && sv === null && s1 + s2 === 0) { ckToss = true; setTimeout(() => ckOpen(), 350); }   // new match: attendance first, then the toss for who serves
    if (!sv0 || sv0.status !== 'done') { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
  }
  function resetLive(quiet) {
    if (!cur) return; const id = cur.mid;
    enqueue({ id, op: 'reset' }); delete scores[id]; s1 = 0; s2 = 0; hist = []; sv = null; swapAsked = false; swapOpen = false;
    try { localStorage.removeItem('ump.' + slug + '.' + id); } catch (e) {}
    if (!quiet) toast(quick ? 'Match cancelled.' : 'Match taken off LIVE.');
  }
  if (quick) window.addEventListener('storage', e => { if (e.key === 'sport') { qSport = null; if (!cur && data) renderList(); } });     // the Sports tab changed the default
  async function closeMatch() {
    // leaving a match nobody has scored in: take it off LIVE so it is not shown as playing
    if (cur && s1 === 0 && s2 === 0 && scores[cur.mid] && scores[cur.mid].status === 'live') resetLive(true);
    $('#score').classList.remove('on'); ckStop(); fullScreen(false); cur = null; try { if (wake) wake.release(); } catch (e) {} wake = null; load().then(() => { if (data) renderList(); }); }
  $('#back').onclick = () => closeMatch();
  $('#rst').onclick = async () => {
    if (!cur) return; const st = scores[cur.mid];
    if (!st || st.status !== 'live') return toast(quick ? 'Nothing to cancel.' : 'This match is not live.');
    const has = s1 > 0 || s2 > 0;
    const ok = await ask(quick ? 'Cancel this match?' : 'Cancel live scoring?', has ? 'This discards the current score (' + s1 + ' - ' + s2 + ')' + (quick ? '.' : ' and takes the match off LIVE. You can start it again later.') : (quick ? 'This clears the match.' : 'This takes the match off LIVE.'), quick ? 'Cancel match' : 'Cancel live');
    if (!ok) return;
    resetLive(false); paint(); closeMatch();
  };
  $('#swap').onclick = () => { flipped = !flipped; buzz(8); paint(); };
  $('#undo').onclick = () => { if (!hist.length || swapOpen) return; const h = hist.pop(); s1 = h[0]; s2 = h[1]; if (Math.max(s1, s2) < MID) swapAsked = false; if (h.length > 2) { try { sv = JSON.parse(h[2]); } catch (e) { sv = null; } } buzz(8); save(false); paint(); };
  const ask = (t, p, yes) => new Promise(res => { $('#ovT').textContent = t; $('#ovP').textContent = p; $('#ovYes').textContent = yes; $('#ov').classList.add('on'); const done = v => { $('#ov').classList.remove('on'); res(v); }; $('#ovYes').onclick = () => done(true); $('#ovNo').onclick = () => done(false); });
  $('#fin').onclick = async () => {
    if (!cur || s1 === s2) return;
    const lead = s1 > s2 ? cur.t1 : cur.t2, reached = won();
    const ok = await ask('Finish this match?', (reached ? '' : 'The game is not over yet (' + goal() + '). ') + lead + ' wins ' + Math.max(s1, s2) + ' - ' + Math.min(s1, s2) + '. The score is saved to the scoreboard and cannot be changed from here.', 'Finish');
    if (!ok) return;
    save(true); buzz([20, 60, 20]);
    toast(navigator.onLine && !netErr ? 'Saved. Final score ' + s1 + ' - ' + s2 : 'Saved on this phone. It will be sent when you are back online.'); closeMatch();
  };
  window.addEventListener('online', () => { paintNet(); flush(); });
  window.addEventListener('offline', paintNet);
  document.addEventListener('visibilitychange', async () => { if (!document.hidden && cur && !wake) { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {} } });

  if (!quick && (!slug || !key)) { $('#list').innerHTML = '<div class="msg">This link is incomplete. Ask the organizer for your court link.</div>'; return; }
  if (!quick && (!P || !P.configured)) { $('#list').innerHTML = '<div class="msg">The cloud is not connected.</div>'; return; }
  if (!quick) { try { ctl = P.liveChannel('ctl-' + slug + '-' + key, ckCommand); } catch (e) {} }
  flush(); load();
  $('#annu').onclick = () => { const b = $('#annu'); try { localStorage.setItem('ann.' + slug, b.dataset.at || ''); } catch (e) {} b.classList.remove('on'); };
  if (!quick) { try { P.liveChannel('slive-' + slug, () => { if (!cur) load(); else P.getAnnouncement(slug).then(showAnn).catch(() => {}); }); } catch (e) {} }      // court changes from Match Control show up right away
  timer = setInterval(() => { if (document.hidden) return; if (pendingN()) flush(); if (!cur && !quick) load(); }, 12000);
  setInterval(() => { if (!document.hidden && pendingN()) flush(); }, 4000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});   // lets this page open again with no signal
})();
</script>
</body>
