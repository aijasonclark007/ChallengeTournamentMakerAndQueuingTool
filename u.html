<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A2547">
<title>Umpire Scoring</title>
<style>
:root{--navy:#007AFF;--lime:#34C759;--ink:#1C1C1E;--mute:#5F5F66;--line:rgba(60,60,67,.18);--red:#FF3B30;--bg:#F2F2F7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:17px;flex:1;line-height:1.2}.top small{display:block;font-weight:500;opacity:.75;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#7bd88f;flex:none;transition:background .2s}.dot.off{background:#ffb703}.dot.err{background:var(--red)}
.netbar,#netbar{display:none;margin:0;padding:8px 16px;background:#E8F0FE;color:#0B4EA2;font-size:14px;font-weight:600;text-align:center}
.netbar.on,#netbar.on{display:block}.netbar.warn,#netbar.warn{background:#FFF1D6;color:#8A5300}
.wrap{padding:14px 14px 40px;max-width:560px;margin:0 auto}
.msg{padding:40px 20px;text-align:center;color:var(--mute)}
.card{background:#fff;border:0;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);border-radius:18px;padding:14px;margin:10px 0;display:block;width:100%;text-align:left;transition:transform .15s,box-shadow .2s}
.card:active{transform:scale(.98)}
.card.next{box-shadow:0 0 0 2px var(--lime),0 8px 24px rgba(52,199,89,.25)}
.card .t{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .v{font-weight:700;font-size:17px;margin-top:4px}.card .v i{font-style:normal;color:var(--mute);font-weight:500;margin:0 6px}
.badge{padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;background:#8a97ab}
.badge.live{background:var(--red);animation:pulse 1.4s infinite}.badge.done{background:#2E7D32}.badge.up{background:var(--navy)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
h2{font-size:15px;color:var(--mute);margin:18px 2px 4px;text-transform:uppercase;letter-spacing:.06em}
/* scoring screen */
#score{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s cubic-bezier(.22,1,.36,1);z-index:10;padding-top:env(safe-area-inset-top)}
#score.on{transform:none}
/* a short scroll runway behind the fixed score screen: one swipe lets Safari tuck its address/tab bars away, then nothing else moves */
#score{overflow:hidden;overscroll-behavior:none;touch-action:pan-y}html:has(#score.on),html:has(#score.on) body{overscroll-behavior:none}html:has(#score.on) body{height:auto;min-height:calc(100vh + 120px);min-height:calc(100dvh + 120px)}
.sbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--navy);color:#fff}
.sbar button{background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
.sbar .mid{flex:1;text-align:center;font-size:13px;opacity:.85}
.sides{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px;min-height:0}
.side{flex:1;border-radius:22px;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;user-select:none;transition:transform .12s,background .2s,border-color .2s}
.side:active{transform:scale(.985)}
.side .nm{font-size:19px;font-weight:700;padding:0 14px;text-align:center}
.side .pt{font-size:clamp(84px,24vh,170px);font-size:clamp(84px,24dvh,170px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.side .hint{position:absolute;bottom:10px;font-size:12px;color:var(--mute)}
.side.win{background:#EAF7D6;border-color:var(--lime)}
.side.bump .pt{animation:bump .3s cubic-bezier(.22,1,.36,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.acts{display:flex;gap:10px;padding:4px 12px 14px}
.acts button{flex:1;padding:16px 8px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:800}
.acts button.fin{flex:2;background:var(--lime);color:#fff;border-color:var(--lime)}
.acts button:disabled{opacity:.4}
.banner{margin:0 12px;padding:10px 14px;border-radius:14px;background:#FFF4D6;color:#6b4a00;font-weight:700;text-align:center;display:none}
.banner.on{display:block;animation:pop .35s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s;padding:20px}
#ov.on{visibility:visible;opacity:1}
#ov .sheet{background:#fff;border-radius:20px;padding:20px;max-width:380px;width:100%;transform:scale(.94);transition:transform .35s cubic-bezier(.22,1,.36,1)}#ov.on .sheet{transform:none}
#ov h3{margin:0 0 6px;font-size:20px}#ov p{margin:0 0 16px;color:var(--mute)}
#ov .row{display:flex;gap:10px}#ov .row button{flex:1;padding:14px;border-radius:14px;font-weight:800;background:#EEF1F7}#ov .row .go{background:var(--navy);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#10213a;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .3s,transform .3s;z-index:40;will-change:transform,opacity;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* serving */
.srvbar{display:none;align-items:center;gap:8px;margin:8px 12px 0;padding:8px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--lime);font-size:14px;font-weight:700}
.callb{display:inline-block;margin-left:4px;padding:1px 9px;border-radius:999px;background:var(--navy);color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap}.srvbar.on{display:flex}.srvbar span{flex:1;min-width:0}.srvbar small{display:block;font-weight:600;color:var(--mute);font-size:12px}
.srvbar button{background:var(--fill,#EEF1F7);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}
.tag{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;max-width:92%}
.tag.s{background:var(--lime);color:#0B1B33}.tag.r{background:#fff;border:1.5px solid var(--lime);color:#2E7D32}
.side.serving{border-color:var(--lime)}
.side.flash:after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(141,198,63,.35);pointer-events:none;animation:flashfade .9s ease-out forwards}@keyframes flashfade{from{opacity:1}to{opacity:0}}
#sv{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:35;visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s;padding:20px}#sv.on{visibility:visible;opacity:1}
#sv .sheet{background:#fff;border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:92vh;overflow:auto}#sv h3{margin:0 0 4px;font-size:20px}#sv p{margin:0 0 14px;color:var(--mute)}#sv .opts{display:grid;gap:8px;margin:0 0 12px}#sv .opts button{padding:15px;border-radius:14px;background:#EEF1F7;font-weight:800;font-size:17px}
#sv .opts button{transition:transform .2s,opacity .25s,background .2s,box-shadow .2s}
#sv .opts button:active{transform:scale(.96)}
#sv .opts.has-pick button:not(.picked){opacity:.3;transform:scale(.97)}
#sv .opts button.picked{background:var(--lime);color:#0B1B33;animation:pick .38s cubic-bezier(.22,1,.36,1)}
#sv .opts button.picked:after{content:" \2713";font-weight:900}
@keyframes pick{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1.02)}}
#sv .sheet.step{animation:stepin .3s cubic-bezier(.22,1,.36,1)}@keyframes stepin{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}

/* phone held sideways (umpire facing the court): the two teams sit side by side */
@media (orientation:landscape) and (max-height:560px){
  .srvbar{margin:6px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));padding:5px 10px;font-size:13px}.srvbar small{display:none}
  .tag{margin-top:2px;padding:3px 10px;font-size:12px}
  .sbar{padding:6px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left))}.sbar button{padding:6px 12px}.sbar .mid{font-size:12px}
  .sides{flex-direction:row;gap:10px;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}
  .side{min-width:0;justify-content:space-evenly;padding:6px 0}
  .side .nm{font-size:16px;line-height:1.2;padding:0 10px;max-height:2.4em;overflow:hidden}
  .side .pt{font-size:clamp(60px,34vh,150px);font-size:clamp(60px,34dvh,150px)}
  #toast{bottom:auto;top:calc(10px + env(safe-area-inset-top))}
  .side .hint{position:static;font-size:11px}
  .banner{padding:6px 12px;font-size:13px;margin:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
  .acts{padding:2px max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.acts button{padding:10px 8px}
}
/* phone held upright: keep the top compact (the cards already show who serves and receives) */
@media (orientation:portrait){
  .sbar{padding:8px 12px}.sbar button{padding:7px 12px;font-size:14px}.sbar .mid{font-size:12px;line-height:1.25}
  .srvbar{margin:6px 12px 0;padding:7px 12px;font-size:13.5px;line-height:1.25}.srvbar small{display:none}.srvbar button{padding:6px 11px;font-size:12.5px}
  .srvbar span b:last-of-type{font-weight:700}
  .side .nm{font-size:18px;padding:0 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qform{background:#fff;border-radius:20px;padding:16px;margin:10px 0 6px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.qform h3{margin:0 0 10px;font-size:18px}.qform label{display:block;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}
.qform input,.qform select{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;margin-bottom:6px}
.sportnote{font-weight:800;margin:2px 0 10px}.sportnote span{color:var(--mute);font-weight:600;font-size:13px}.qform .sp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qform .sp button{padding:14px 8px;border-radius:14px;background:#EEF1F7;font-weight:800;font-size:16px;border:2px solid transparent;transition:transform .35s cubic-bezier(.22,1,.36,1),background .2s,border-color .2s}
.qform .sp button.on{background:#fff;border-color:var(--blue,#007AFF);box-shadow:0 0 0 4px rgba(0,122,255,.12)}.qform .sp button:active{transform:scale(.96)}
.qform .go{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--lime);color:#0B1B33;font-weight:900;font-size:17px}
.qclr{display:block;margin:18px auto 0;background:none;color:var(--mute);font-weight:700;padding:10px}
</style>
<style>a,button,.side,.q,.court,.pillbtn,[role=button]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}.view,.sheet,.nthumb,.thumb,.findbox{backface-visibility:hidden}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}</style></head>
<body>
<div class="top"><h1 id="ttl">Umpire scoring<small id="sub"></small></h1><span class="dot" id="dot" title="Connection"></span></div>
<div id="netbar" role="status"></div>
<div class="wrap" id="list"><div class="msg">Loading...</div></div>

<div id="score" aria-live="polite">
  <div class="sbar"><button id="back">Back</button><div class="mid" id="smid"></div><button id="swap">Swap sides</button></div>
  <div id="netbar2" class="netbar" role="status"></div>
  <div class="srvbar" id="srvbar"></div>
  <div class="sides" id="sides"></div>
  <div class="banner" id="ban"></div>
  <div class="acts"><button id="undo">Undo</button><button id="rst">Cancel live</button><button class="fin" id="fin">Finish match</button></div>
</div>
<div id="ov"><div class="sheet"><h3 id="ovT"></h3><p id="ovP"></p><div class="row"><button id="ovNo">Keep scoring</button><button class="go" id="ovYes">Finish</button></div></div></div>
<div id="sv"><div class="sheet"><h3 id="svT"></h3><p id="svP"></p><div class="opts" id="svO"></div></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="sports/badminton/rules.js"></script>
<script src="sports/pickleball/rules.js"></script>
<script src="sports/sports.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), quick = q.get('quick') === '1';           // quick = the Scoring tab: type the players' names and score, no tournament or account needed
  const slug = quick ? 'quick' : q.get('s'), key = quick ? 'quick' : q.get('k'), court = quick ? null : q.get('c');
  const QK = 'quick.v1', qload = () => { try { return JSON.parse(localStorage.getItem(QK) || 'null') || { matches: [], scores: {} }; } catch (e) { return { matches: [], scores: {} }; } }, qsave = d => { try { localStorage.setItem(QK, JSON.stringify(d)); } catch (e) {} };
  const P = quick ? { configured: true, umpireGet: async () => { const d = qload(); return { name: 'Scoring', matches: d.matches, scores: Object.values(d.scores) }; },
    umpireScore: async (sl, k, id, a, b, st) => { const d = qload(); d.scores[id] = { id, s1: a, s2: b, status: st }; qsave(d); },
    umpireReset: async (sl, k, id) => { const d = qload(); delete d.scores[id]; qsave(d); }, liveChannel: () => ({ ping() {} }) } : window.Platform;
  const $ = s => document.querySelector(s), TARGET = Sports.get('badminton').target, MID = Sports.get('badminton').swapAt;   // first to 31 wins, sudden death
  const defSport = Sports.current;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
  let swapAsked = false, data = null, scores = {}, cur = null, s1 = 0, s2 = 0, hist = [], sv = null, flipped = false, wake = null, timer = null;
  const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2600); };
  const dot = k => { $('#dot').className = 'dot' + (k ? ' ' + k : ''); };

  // ----- offline safety: every score is written to this phone first, then sent whenever there is a connection -----
  const OUT = 'ump.out.' + slug, CACHE = 'ump.data.' + slug + '.' + key;
  const readOut = () => { try { return JSON.parse(localStorage.getItem(OUT) || '{}') || {}; } catch (e) { return {}; } };
  const writeOut = o => { try { if (Object.keys(o).length) localStorage.setItem(OUT, JSON.stringify(o)); else localStorage.removeItem(OUT); } catch (e) {} };
  const pendingN = () => Object.keys(readOut()).length;
  let flushing = null, netErr = false;
  function paintNet() {
    const n = pendingN(), off = !navigator.onLine || netErr;
    const msg = off ? (n ? 'Offline. ' + n + (n === 1 ? ' score is' : ' scores are') + ' saved on this phone and will be sent when you are back online.' : (!navigator.onLine ? 'Offline. Showing the saved schedule.' : '')) : '';   // quiet while online: scores still save and send in the background
    ['#netbar', '#netbar2'].forEach(sel => { const e = $(sel); if (e) { e.textContent = msg; e.classList.toggle('on', !!msg); e.classList.toggle('warn', off); } });
    dot(n && off ? 'err' : n ? 'off' : (off ? 'err' : ''));
  }
  function enqueue(op) { const o = readOut(); op.seq = ((o[op.id] && o[op.id].seq) || 0) + 1; o[op.id] = op; writeOut(o); paintNet(); flush(); }
  function applyOutbox() { const o = readOut(); Object.keys(o).forEach(id => { const x = o[id]; if (x.op === 'reset') delete scores[id]; else scores[id] = { id, s1: x.s1, s2: x.s2, status: x.status }; }); }
  const permanent = e => /finished|valid|tie|Bad/i.test((e && e.message) || '');       // the server said no: retrying will not help
  function flush() {
    if (flushing) return flushing;
    flushing = (async () => {
      let resync = false;
      for (;;) {
        const o = readOut(), ids = Object.keys(o); if (!ids.length) break;
        const id = ids[0], x = o[id];
        try {
          if (x.op === 'reset') await P.umpireReset(slug, key, id); else await P.umpireScore(slug, key, id, x.s1, x.s2, x.status);
          netErr = false; try { P.liveChannel('slive-' + slug).ping(); } catch (e) {}
        } catch (e) {
          if (!permanent(e)) { netErr = true; break; }                                  // offline: keep it and try again later
          toast(e.message); resync = true;
        }
        const now = readOut(); if (now[id] && now[id].seq === x.seq) { delete now[id]; writeOut(now); }   // unless a newer score arrived meanwhile
      }
      if (resync && !cur) load();
    })().finally(() => { flushing = null; paintNet(); if (!cur && data && !pendingN()) renderList(); });
    return flushing;
  }

  async function load() {
    try {
      const d = await P.umpireGet(slug, key); data = d; scores = {}; (d.scores || []).forEach(x => { scores[x.id] = x; });
      try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {}
      netErr = false; applyOutbox(); if (!cur) renderList();
    } catch (e) {
      netErr = true;
      if (!data) { try { const c = JSON.parse(localStorage.getItem(CACHE) || 'null'); if (c) { data = c; scores = {}; (c.scores || []).forEach(x => { scores[x.id] = x; }); applyOutbox(); if (!cur) renderList(); } } catch (x) {} }
      if (!data) $('#list').innerHTML = '<div class="msg">' + (navigator.onLine ? esc(e.message) : 'You are offline. Open this link once with a connection to load the matches, then it keeps working without one.') + '</div>';
    }
    paintNet();
  }
  const mine = () => (data.matches || []).filter(m => !court || m.court === court).sort((a, b) => (a.slot - b.slot) || String(a.court).localeCompare(String(b.court)));
  function state(m) { const s = scores[m.mid]; if (s) return s.status; if (m.res) return 'done'; return 'up'; }
  // ----- quick match scorer (Scoring tab) -----
  let qSport = null;
  const qNames = () => { try { return JSON.parse(localStorage.getItem('quick.names') || '[]'); } catch (e) { return []; } };
  function quickForm() {
    const sp = qSport || defSport(), nm = qNames();
    const inp = (id, ph) => '<input id="' + id + '" type="text" maxlength="30" list="qn" autocomplete="off" placeholder="' + ph + '">';
    return '<div class="qform"><h3>New match</h3><div class="sportnote">' + Sports.get(sp).icon + ' ' + Sports.get(sp).name + ' <span>\u00B7 change on the Sports tab</span></div>' +
      '<label>Team 1 players</label>' + inp('qa1', 'Player 1') + inp('qa2', 'Partner (leave empty for singles)') + '<label>Team 2 players</label>' + inp('qb1', 'Player 1') + inp('qb2', 'Partner (leave empty for singles)') +
      '<datalist id="qn">' + nm.map(n => '<option value="' + esc(n) + '">').join('') + '</datalist><button class="go" id="qgo" type="button">Start scoring</button></div>';
  }
  function bindQuick() {
    const go = $('#qgo'); if (go) go.onclick = () => {
      const v = id => ($('#' + id).value || '').trim(), t1 = [v('qa1'), v('qa2')].filter(Boolean), t2 = [v('qb1'), v('qb2')].filter(Boolean);
      if (!t1.length || !t2.length) return toast('Type at least one player for each team.');
      if (t1.length !== t2.length) return toast('Both teams need the same number of players.');
      const d = qload(), mid = 'q' + Date.now(), sport = qSport || defSport(), now = new Date();
      d.matches.push({ mid, court: 'Quick', slot: -Date.now(), time: now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), bracket: sport === 'pickleball' ? 'Pickleball' : 'Badminton', t1: t1.join(' / '), t2: t2.join(' / '), sport });
      d.matches = d.matches.slice(-30); qsave(d);
      try { localStorage.setItem('quick.names', JSON.stringify([...new Set(t1.concat(t2).concat(qNames()))].slice(0, 80))); } catch (e) {}
      load().then(() => openMatch(mid));
    };
    const cl = $('#qclr'); if (cl) cl.onclick = () => { if (!confirm('Remove all matches from this phone?')) return; qsave({ matches: [], scores: {} }); load(); };
  }
  function renderList() {
    $('#ttl').innerHTML = esc(data.name) + '<small>' + (quick ? 'Type the players, then score' : (court ? esc(court) : 'All courts') + ' · live scoring') + '</small>';
    const ms = mine(); let nextFound = false;
    if (quick && !ms.length) { $('#list').innerHTML = quickForm(); bindQuick(); return; }
    if (!ms.length) { $('#list').innerHTML = '<div class="msg">No matches on ' + esc(court || 'this schedule') + ' yet. The organizer needs to publish the schedule again.</div>'; return; }
    const card = m => {
      const st = state(m), s = scores[m.mid] || (m.res ? { s1: m.res.a, s2: m.res.b } : null), ready = m.t1 && m.t2;
      let next = false; if (!nextFound && st !== 'done' && ready) { next = true; nextFound = true; }
      const wait = readOut()[m.mid] ? '<span style="color:#8A5300;font-weight:700">Saved on phone</span>' : '';
      const badge = st === 'live' ? '<span class="badge live">LIVE</span>' : st === 'done' ? '<span class="badge done">FINAL</span>' : '<span class="badge up">' + (ready ? (next ? 'UP NEXT' : 'UPCOMING') : 'TO BE DECIDED') + '</span>';
      return '<button class="card' + (next ? ' next' : '') + '" data-m="' + esc(m.mid) + '"' + (ready || st !== 'up' ? '' : ' disabled') + '><div class="t">' + badge + wait + '<span>' + esc(m.time) + '</span>' + (court ? '' : '<span>' + esc(m.court) + '</span>') + '<span>' + esc(m.bracket) + '</span></div>' +
        '<div class="v">' + esc(m.t1 || 'TBD') + '<i>vs</i>' + esc(m.t2 || 'TBD') + (s ? '<div style="margin-top:4px;font-size:22px">' + s.s1 + ' - ' + s.s2 + '</div>' : '') + '</div></button>';
    };
    $('#list').innerHTML = (quick ? quickForm() : court ? '' : '<p class="msg" style="padding:0 0 6px;text-align:left">Tip: ask the organizer for your court link to see only your court.</p>') + '<h2>' + (quick ? 'Recent matches' : 'Your matches') + '</h2>' + ms.map(card).join('') + (quick ? '<button class="qclr" id="qclr">Clear all matches</button>' : '');
    $('#list').querySelectorAll('[data-m]').forEach(b => b.onclick = () => openMatch(b.dataset.m));
    if (quick) bindQuick();
  }

  // ----- scoring screen -----
  function save(final, localOnly) {            // newest score for the match wins, so only the latest needs to be kept and sent
    const st = final ? 'done' : 'live';
    if (!localOnly) { scores[cur.mid] = { id: cur.mid, s1, s2, status: st };
    enqueue({ id: cur.mid, op: 'score', s1, s2, status: st }); }
    try { localStorage.setItem('ump.' + slug + '.' + cur.mid, JSON.stringify({ s1, s2, hist, sv })); } catch (e) {}
  }
  // ----- who serves / receives (badminton rules) -----
  // sv = { k: serving side (0 or 1), pos: [{R,L},{R,L}] } where pos is each side's players by service court (doubles).
  // The server stands in the right court when their side's score is even, the left when odd, and serves diagonally.
  // If the serving side wins the rally, its two players swap courts and the same player serves again. If the other side wins, service is over and it serves next.
  // pickleball (traditional side-out): only the serving side scores; the side that wins the rally is tapped. State adds n = server number (1/2), first = the team that serves first (it only gets one server).
  const isPB = () => ((cur && cur.sport) || (data && data.sport)) === 'pickleball';
  const won = (a = s1, b = s2) => Sports.get(isPB() ? 'pickleball' : 'badminton').won(a, b);
  const goal = () => Sports.get(isPB() ? 'pickleball' : 'badminton').goal;
  const ICON = () => Sports.get(isPB() ? 'pickleball' : 'badminton').icon;
  const parts = n => String(n || '').split(/\s*\/\s*/).filter(Boolean);
  const isDbl = () => cur && parts(cur.t1).length > 1 && parts(cur.t2).length > 1;
  const CT = c => c === 'R' ? 'right' : 'left';
  function svWho(x, a, b) {
    const sc = [a, b], par = sc[x.k] % 2 === 0 ? 'R' : 'L', court = isPB() && !x.first && x.n === 2 ? (par === 'R' ? 'L' : 'R') : par, o = 1 - x.k, nm = [cur.t1, cur.t2];
    return isDbl() ? { server: x.pos[x.k][court], recv: x.pos[o][court], court } : { server: nm[x.k], recv: nm[o], court };
  }
  function svStep(x, i) {                      // the state after side i wins a rally (does not change the score)
    const y = JSON.parse(JSON.stringify(x));
    if (isPB()) {
      if (i === y.k) { if (y.pos) { const p = y.pos[i]; y.pos[i] = { R: p.L, L: p.R }; } }
      else if (y.pos && !y.first && y.n === 1) y.n = 2;                       // first server lost the rally: the partner serves
      else { y.k = i; y.n = 1; y.first = false; }                              // side out
      return y;
    }
    if (i === y.k) { if (y.pos) { const p = y.pos[i]; y.pos[i] = { R: p.L, L: p.R }; } } else y.k = i;
    return y;
  }
  function svBuild(k, server, recv, n) {       // set up from "this player serves, that player receives" at the current score (pickleball: n = server number, left out at the start of a game)
    const pb = isPB(), first = pb && n === undefined; if (first) n = 2;
    const sc = [s1, s2], par = sc[k] % 2 === 0 ? 'R' : 'L', court = pb && !first && n === 2 ? (par === 'R' ? 'L' : 'R') : par, other = court === 'R' ? 'L' : 'R', o = 1 - k;
    if (!isDbl()) return pb ? { k, pos: null, n: 1, first: false } : { k, pos: null };
    const tk = parts([cur.t1, cur.t2][k]), to = parts([cur.t1, cur.t2][o]), pk = {}, po = {};
    pk[court] = server; pk[other] = tk.find(n => n !== server); po[court] = recv; po[other] = to.find(n => n !== recv);
    const pos = []; pos[k] = pk; pos[o] = po; return pb ? { k, pos, n, first } : { k, pos };
  }
  function chooseServe() {
    const sh = $('#sv'), O = $('#svO'), nm = [cur.t1, cur.t2], fresh = !(s1 + s2), D = isDbl();
    return new Promise(res => {
      const end = v => { sh.classList.remove('on'); res(v); };
      sh.onclick = e => { if (e.target === sh) end(null); };                    // tap outside to close without changing anything
      const sheet = sh.querySelector('.sheet'), bump = () => { sheet.classList.remove('step'); void sheet.offsetWidth; sheet.classList.add('step'); };
      const pick = (b, fn) => { buzz(10); O.classList.add('has-pick'); b.classList.add('picked'); setTimeout(fn, 420); };
      const show = (title, sub, opts, onPick) => {                               // one screen of big buttons
        $('#svT').textContent = title; $('#svP').textContent = sub; O.classList.remove('has-pick'); bump();
        O.innerHTML = opts.map((o, i) => '<button data-i="' + i + '">' + o.h + '</button>').join('');
        O.querySelectorAll('button').forEach(b => b.onclick = () => pick(b, () => onPick(opts[+b.dataset.i])));
      };
      const sub = n => D ? ' <small style="font-weight:600;color:var(--mute)">\u00B7 ' + esc(n) + '</small>' : '';
      const receiver = (k, server) => show('Who receives?', server + ' serves. Tap the opponent who receives.', parts(nm[1 - k]).map(n => ({ h: esc(n), n })), o => (isPB() && D && !fresh) ? show('Which server?', server + ' serves. Is that the first or the second server of the team?', [{ h: 'First server', n: 1 }, { h: 'Second server', n: 2 }], c => end(svBuild(k, server, o.n, c.n))) : end(svBuild(k, server, o.n)));
      const server = (k, title) => D
        ? show(title || 'Who serves?', 'Tap the player of ' + nm[k] + ' who serves.', parts(nm[k]).map(n => ({ h: esc(n), n })), o => receiver(k, o.n))
        : end(svBuild(k, nm[k], nm[1 - k]));
      if (!fresh) {                                                              // joining mid-game: just say who is serving now
        const all = D ? [0, 1].flatMap(k => parts(nm[k]).map(n => ({ k, n, h: esc(n) + sub(nm[k]) }))) : [0, 1].map(k => ({ k, n: nm[k], h: esc(nm[k]) }));
        show('Who is serving now?', 'The score is ' + s1 + ' - ' + s2 + '. Tap the player who serves.', all, o => D ? receiver(o.k, o.n) : end(svBuild(o.k, o.n, nm[1 - o.k])));
      } else {                                                                   // the coin is tossed on court; the app records the result
        show('Toss a coin', 'Toss a coin with both teams on court. Who won the toss?', [0, 1].map(k => ({ k, h: '\uD83E\uDE99 ' + esc(nm[k]) })),
          t => show(nm[t.k] + ' won the toss', 'The winner chooses to serve, to receive, or which end to start on. The other team takes what is left.',
            [{ h: ICON() + ' Serve first', serve: 1 }, { h: 'Receive first', serve: 0 }, { h: 'Choose the end' }],
            c => c.serve !== undefined ? server(c.serve ? t.k : 1 - t.k, 'Who serves first?')            // winner serves or receives, the other team gets the end
              : show(nm[1 - t.k] + ' choose', nm[t.k] + ' chose the end. ' + nm[1 - t.k] + ' now choose to serve or receive.',    // winner took the end, so the other team picks serve / receive
                  [{ h: ICON() + ' Serve first', serve: 1 }, { h: 'Receive first', serve: 0 }], d => server(d.serve ? 1 - t.k : t.k, 'Who serves first?'))));
      }
      sh.classList.add('on');
    });
  }
  function askSwap() {                         // first side to reach 16: remind the umpire to change ends
    const sh = $('#sv'), O = $('#svO'), t = s1 >= MID && s2 < MID ? cur.t1 : s2 >= MID && s1 < MID ? cur.t2 : (s1 >= s2 ? cur.t1 : cur.t2);
    const end = swap => { sh.classList.remove('on'); sh.onclick = null; if (swap) { flipped = !flipped; buzz([10, 30, 10]); paint(); } };
    $('#svT').textContent = 'Swap sides'; $('#svP').textContent = t + ' reached ' + MID + '. Both teams change ends (court sides) now.';
    O.classList.remove('has-pick');
    O.innerHTML = '<button data-s="1">\u21C5 Swap sides</button><button data-s="0" style="background:#fff;border:1.5px solid var(--line)">Not now</button>';
    O.querySelectorAll('button').forEach(b => b.onclick = () => { b.classList.add('picked'); O.classList.add('has-pick'); buzz(10); setTimeout(() => end(b.dataset.s === '1'), 320); });
    sh.onclick = e => { if (e.target === sh) end(false); };
    const sheet = sh.querySelector('.sheet'); sheet.classList.remove('step'); void sheet.offsetWidth; sheet.classList.add('step');
    sh.classList.add('on'); buzz([20, 40, 20]);
  }
  async function setServe() { if (!cur) return; const v = await chooseServe(); if (!v) return; sv = v; save(false, true); paint(); }
  function paint(bump) {
    const m = cur, done = state(m) === 'done' && scores[m.mid] && scores[m.mid].status === 'done';
    const a = flipped ? 1 : 0, names = [m.t1, m.t2], pts = [s1, s2];
    const order = flipped ? [1, 0] : [0, 1];
    const who = sv && !done && !won() ? svWho(sv, s1, s2) : null;
    const tag = i => !who ? '' : i === sv.k ? '<div class="tag s">' + ICON() + ' Serving: ' + esc(who.server) + ' \u00B7 ' + CT(who.court) + ' court</div>' : '<div class="tag r">Receiving: ' + esc(who.recv) + ' \u00B7 ' + CT(who.court) + ' court</div>';
    $('#sides').innerHTML = order.map(i => '<div class="side' + (won() && pts[i] > pts[1 - i] ? ' win' : '') + (who && i === sv.k ? ' serving' : '') + '" data-i="' + i + '"><div class="nm">' + esc(names[i]) + '</div>' + tag(i) + '<div class="pt">' + pts[i] + '</div>' + (done ? '' : '<div class="hint">' + (isPB() ? 'tap when your team wins the rally' : 'tap anywhere to add a point') + '</div>') + '</div>').join('');
    const sb = $('#srvbar'), live = !done && !won();
    sb.classList.toggle('on', live);
    if (live) {
      if (who) {
        const nx = i => { const y = svStep(sv, i), a = s1 + (i === 0 ? 1 : 0), b = s2 + (i === 1 ? 1 : 0); return svWho(y, a, b); };
        const n0 = nx(0), n1 = nx(1);
        if (isPB()) sb.innerHTML = '<span>' + ICON() + ' <b>' + esc(who.server) + '</b> serves from the <b>' + CT(who.court) + '</b> court to <b>' + esc(who.recv) + '</b> <span class="callb">' + [[s1, s2][sv.k], [s1, s2][1 - sv.k]].concat(isDbl() ? [sv.first ? 2 : sv.n] : []).join(' \u2013 ') + '</span></span><button id="svChg">Change</button>';
        else sb.innerHTML = '<span>' + ICON() + ' <b>' + esc(who.server) + '</b> serves from the <b>' + CT(who.court) + '</b> court to <b>' + esc(who.recv) + '</b><small>If ' + esc(names[0]) + ' score: ' + esc(n0.server) + ' serves ' + CT(n0.court) + ' \u00B7 If ' + esc(names[1]) + ' score: ' + esc(n1.server) + ' serves ' + CT(n1.court) + '</small></span><button id="svChg">Change</button>';
      } else sb.innerHTML = '<span>Serving is not tracked<small>Set who serves to see server and receiver.</small></span><button id="svChg">Set server</button>';
      $('#svChg').onclick = () => setServe();
    }
    if (bump != null) { const el = $('#sides').querySelector('[data-i="' + bump + '"]'); if (el) el.classList.add('bump'); }
    const isWon = won();
    $('#ban').classList.toggle('on', isWon && !done); if (isWon) $('#ban').textContent = (s1 > s2 ? m.t1 : m.t2) + (isPB() ? ' won ' + Math.max(s1, s2) + ' - ' + Math.min(s1, s2) : ' reached ' + TARGET) + '. Tap Finish match.';
    $('#undo').disabled = !hist.length || done; $('#fin').disabled = done || (s1 === s2);
    $('#fin').textContent = done ? 'Match finished' : 'Finish match';
    $('#rst').disabled = done || !(scores[m.mid] && scores[m.mid].status === 'live');
    if (!done) $('#sides').querySelectorAll('.side').forEach(el => el.onclick = () => add(+el.dataset.i));
  }
  function add(i) {
    if (won()) return buzz(30);
    if (isPB() && !sv) { toast('Set who serves first.'); return setServe(); }
    hist.push([s1, s2, JSON.stringify(sv || null)]);
    const scored = !isPB() || i === sv.k;                                 // pickleball: only the serving side can score
    if (scored) { if (i === 0) s1++; else s2++; }
    const prevK = sv ? sv.k : null, prevN = sv ? sv.n : null; if (sv) sv = svStep(sv, i);
    buzz(10); save(false); paint(scored ? i : null);
    if (!isPB() && !swapAsked && Math.max(s1, s2) >= MID && !won()) { swapAsked = true; setTimeout(askSwap, 450); }
    if (sv && !won() && (sv.k !== prevK || (isPB() && sv.n !== prevN))) {            // the rally went to the other side: service over (pickleball: side out, or second server)
      const w = svWho(sv, s1, s2); toast((sv.k !== prevK ? (isPB() ? 'Side out. ' : 'Service over. ') : 'Second server. ') + w.server + ' serves from the ' + CT(w.court) + ' court.'); buzz([10, 40, 10]);
      const el = $('#sides').querySelector('.side.serving'); if (el) el.classList.add('flash');
    }
  }
  async function openMatch(mid) {
    cur = (data.matches || []).find(m => m.mid === mid); if (!cur) return;
    const sv0 = scores[mid] || (cur.res ? { s1: cur.res.a, s2: cur.res.b, status: 'done' } : null);
    s1 = sv0 ? sv0.s1 : 0; s2 = sv0 ? sv0.s2 : 0; hist = []; flipped = false; sv = null; swapAsked = Math.max(s1, s2) >= MID;
    try { const l = JSON.parse(localStorage.getItem('ump.' + slug + '.' + mid) || 'null'); if (l && ((sv0 && l.s1 === s1 && l.s2 === s2) || (!sv0 && !l.s1 && !l.s2))) { hist = l.hist || []; sv = l.sv === undefined ? null : l.sv; } } catch (e) {}
    $('#smid').textContent = cur.court + ' · ' + cur.time + ' · ' + cur.bracket;
    $('#score').classList.add('on'); paint();
    if ((!sv0 || sv0.status !== 'done') && sv === null && s1 + s2 === 0) setTimeout(() => setServe(), 350);   // new match: ask who serves first
    if (!sv0 || sv0.status !== 'done') { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
  }
  function resetLive(quiet) {
    if (!cur) return; const id = cur.mid;
    enqueue({ id, op: 'reset' }); delete scores[id]; s1 = 0; s2 = 0; hist = []; sv = null; swapAsked = false;
    try { localStorage.removeItem('ump.' + slug + '.' + id); } catch (e) {}
    if (!quiet) toast('Match taken off LIVE.');
  }
  if (quick) window.addEventListener('storage', e => { if (e.key === 'sport') { qSport = null; if (!cur && data) renderList(); } });     // the Sports tab changed the default
  async function closeMatch() {
    // leaving a match nobody has scored in: take it off LIVE so it is not shown as playing
    if (cur && s1 === 0 && s2 === 0 && scores[cur.mid] && scores[cur.mid].status === 'live') resetLive(true);
    $('#score').classList.remove('on'); cur = null; try { if (wake) wake.release(); } catch (e) {} wake = null; load().then(() => { if (data) renderList(); }); }
  $('#back').onclick = () => closeMatch();
  $('#rst').onclick = async () => {
    if (!cur) return; const st = scores[cur.mid];
    if (!st || st.status !== 'live') return toast('This match is not live.');
    const has = s1 > 0 || s2 > 0;
    const ok = await ask('Cancel live scoring?', has ? 'This discards the current score (' + s1 + ' - ' + s2 + ') and takes the match off LIVE. You can start it again later.' : 'This takes the match off LIVE.', 'Cancel live');
    if (!ok) return;
    resetLive(false); paint(); closeMatch();
  };
  $('#swap').onclick = () => { flipped = !flipped; buzz(8); paint(); };
  $('#undo').onclick = () => { if (!hist.length) return; const h = hist.pop(); s1 = h[0]; s2 = h[1]; if (Math.max(s1, s2) < MID) swapAsked = false; if (h.length > 2) { try { sv = JSON.parse(h[2]); } catch (e) { sv = null; } } buzz(8); save(false); paint(); };
  const ask = (t, p, yes) => new Promise(res => { $('#ovT').textContent = t; $('#ovP').textContent = p; $('#ovYes').textContent = yes; $('#ov').classList.add('on'); const done = v => { $('#ov').classList.remove('on'); res(v); }; $('#ovYes').onclick = () => done(true); $('#ovNo').onclick = () => done(false); });
  $('#fin').onclick = async () => {
    if (!cur || s1 === s2) return;
    const lead = s1 > s2 ? cur.t1 : cur.t2, reached = won();
    const ok = await ask('Finish this match?', (reached ? '' : 'The game is not over yet (' + goal() + '). ') + lead + ' wins ' + Math.max(s1, s2) + ' - ' + Math.min(s1, s2) + '. The score is saved to the scoreboard and cannot be changed from here.', 'Finish');
    if (!ok) return;
    save(true); buzz([20, 60, 20]);
    toast(navigator.onLine && !netErr ? 'Saved. Final score ' + s1 + ' - ' + s2 : 'Saved on this phone. It will be sent when you are back online.'); closeMatch();
  };
  window.addEventListener('online', () => { paintNet(); flush(); });
  window.addEventListener('offline', paintNet);
  document.addEventListener('visibilitychange', async () => { if (!document.hidden && cur && !wake) { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {} } });

  if (!quick && (!slug || !key)) { $('#list').innerHTML = '<div class="msg">This link is incomplete. Ask the organizer for your court link.</div>'; return; }
  if (!quick && (!P || !P.configured)) { $('#list').innerHTML = '<div class="msg">The cloud is not connected.</div>'; return; }
  flush(); load();
  timer = setInterval(() => { if (document.hidden) return; if (pendingN()) flush(); if (!cur) load(); }, 12000);
  setInterval(() => { if (!document.hidden && pendingN()) flush(); }, 4000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});   // lets this page open again with no signal
})();
</script>
</body>
