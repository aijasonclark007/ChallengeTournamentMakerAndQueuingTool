<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#1C1C1E;--mute:#6E6E73;--line:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--navy:#0A2547;
 --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}

.seg a{flex:1;text-align:center;padding:7px 10px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink);transition:background .2s,box-shadow .2s}@media(min-width:700px){.seg a{font-size:14px;padding:7px 16px}}

main{max-width:1100px;margin:0 auto;padding:20px 16px 56px}
main.wide{max-width:1280px;padding-top:12px}
:root{--spring:cubic-bezier(.2,.8,.2,1)}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0,.009,.035 2.1%,.141 4.4%,.281 6.7%,.723 12.9%,.938 16.7%,1.017 19.4%,1.077 22.4%,1.121 25.1%,1.139 27.7%,1.131 31.1%,1.087 36.3%,1.034 42.4%,1.001 49.4%,.987 56.1%,.985 62%,.996 71.6%,1.002 82%,1)}}
.view{opacity:0;transform:translateX(var(--tx,0px)) translateY(8px)}.view.in{opacity:1;transform:none;transition:opacity .3s ease,transform .55s var(--spring)}
nav.seg{position:relative}
nav.seg .nthumb{position:absolute;top:2px;bottom:2px;left:0;background:#fff;border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);pointer-events:none;will-change:transform,width}
nav.seg a{position:relative;z-index:1}nav.seg a.on{background:none;box-shadow:none}
.seg a:active{transform:scale(.96)}
@keyframes toolin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.tool{animation:toolin .6s var(--spring) both}
html.tool-mode,html.tool-mode body{height:100%;overflow:hidden}

html.tool-mode .tool{height:calc(100dvh - var(--hdr,64px) - 22px);min-height:0}
@supports not (height:100dvh){html.tool-mode .tool{height:calc(100vh - var(--hdr,64px) - 22px)}}
h1{font-size:clamp(30px,6vw,40px);letter-spacing:-.03em;line-height:1.08;margin:6px 0 4px;font-weight:800}
h2{font-size:13px;color:var(--mute);font-weight:600;margin:28px 0 8px 16px;letter-spacing:.01em;text-transform:none}
.lead{color:var(--mute);margin:0 0 8px;max-width:60ch}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:.5px solid var(--line)}.row:first-child{border-top:0}
a.row:active{background:var(--fill)}
.badge{flex:0 0 52px;height:52px;border-radius:14px;background:linear-gradient(180deg,#fff,#EEF1F7);border:.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge i{font-style:normal;font-size:11px;font-weight:700;color:var(--red);margin-bottom:3px}.badge b{font-size:21px}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:17px;letter-spacing:-.01em}.grow small{color:var(--mute);font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.open{background:rgba(52,199,89,.16);color:#1E8E3E}.pill.soon{background:rgba(255,149,0,.16);color:#B26A00}.pill.done{background:var(--fill);color:var(--mute)}
.chev{color:#C4C4C9;font-size:22px;font-weight:300}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600;margin:2px 0 8px}
.hero{padding:26px 22px;background:radial-gradient(120% 140% at 0% 0%,#E8F1FF 0%,#fff 60%)}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{background:var(--fill);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px;max-width:420px}
.count div{background:#fff;border:.5px solid var(--line);border-radius:14px;padding:10px 0;text-align:center}
.count b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.count span{font-size:12px;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;border-top:.5px solid var(--line)}.kv:first-child{border-top:0}
.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
.rule{display:flex;gap:12px;padding:13px 16px;border-top:.5px solid var(--line)}.rule:first-child{border-top:0}.rule em{font-style:normal;font-size:22px;line-height:1.2}
.rule b{display:block}.rule small{color:var(--mute);font-size:14px}
.f{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.in{display:block}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:.5px solid var(--line);background:#F7F7FA;color:var(--ink);outline:none;transition:box-shadow .15s,border-color .15s}
input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.15);background:#fff}
.two{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:560px){.two{grid-template-columns:1fr 1fr}.lvls{grid-template-columns:repeat(3,1fr)!important}}
.lvls{display:grid;gap:10px;grid-template-columns:1fr}
.lv{cursor:pointer;display:block}.lv input{position:absolute;opacity:0;pointer-events:none}
.lv .slots{display:block;text-align:center;font-size:12px;font-weight:700;color:#1E8E3E;margin-bottom:5px;min-height:18px}.lv .slots.full{color:var(--red)}
.lv .pillbtn{display:block;text-align:center;padding:12px;border-radius:14px;background:#F7F7FA;border:1.5px solid transparent;font-weight:700;transition:all .15s}
.lv input:checked + .pillbtn{background:rgba(0,122,255,.1);border-color:var(--blue);color:var(--blue)}
.lv input:focus-visible + .pillbtn{box-shadow:0 0 0 4px rgba(0,122,255,.25)}
.lv small{display:block;text-align:center;color:var(--mute);font-size:12px;margin-top:5px;line-height:1.3}
.err{color:var(--red);font-size:13px;margin:5px 2px 0;min-height:0}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;padding:14px 22px;border-radius:14px;background:var(--blue);color:#fff;width:100%;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;cursor:wait}
.note{background:rgba(255,149,0,.12);color:#8A5300;border-radius:14px;padding:14px 16px}
.ok{text-align:center;padding:34px 22px}.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 14px}
.tool{width:100%;height:calc(100vh - 118px);min-height:560px;border:0;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.soon-card{text-align:center;padding:48px 22px}.soon-card .big{font-size:44px}
.cover{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#0A2547,#1B5192);overflow:hidden}
.cover:before{content:"";position:absolute;inset:7% 5%;border:2px solid rgba(255,255,255,.1);border-radius:4px;background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.1) 50%,transparent calc(50% + 1px))}
.cover svg{position:absolute;right:2%;top:50%;transform:translateY(-50%);height:94%;width:auto}
.cover .ct{position:absolute;left:16px;bottom:16px;max-width:50%;color:#fff;font-weight:800;font-size:clamp(15px,2.4vw,21px);line-height:1.12;letter-spacing:-.01em}
.cover .cd{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cover.big{aspect-ratio:auto;height:clamp(150px,26vw,230px)}.cover.big svg{height:112%;right:6%}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:14px}
.tcard{display:block;transition:transform .2s,box-shadow .2s}.tcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 36px rgba(0,0,0,.1)}.tcard:active{transform:scale(.99)}
.tbody{padding:14px 16px 16px}.tbody b{display:block;font-size:18px;letter-spacing:-.01em}.tbody small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.trow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn.sm{width:auto;padding:10px 18px;font-size:15px;display:inline-block}
input[type=date],input[type=number],select,textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:.5px solid var(--line);background:#F7F7FA;color:var(--ink);outline:none}
input[type=date]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.15);background:#fff}
.bgrid{display:grid;gap:18px;grid-template-columns:1fr;align-items:start}@media(min-width:900px){.bgrid{grid-template-columns:1.1fr .9fr}.stick{position:sticky;top:96px}}
.fld{margin-bottom:14px}.lvrow{display:grid;grid-template-columns:70px 90px 1fr;gap:8px;align-items:center;margin-bottom:8px}.lvrow b{font-size:15px}
.code{font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;min-height:260px;white-space:pre}
ol.steps{margin:10px 0 0;padding-left:20px;color:var(--mute);font-size:14px}ol.steps li{margin:4px 0}
footer{text-align:center;color:var(--mute);font-size:13px;padding:8px 16px 32px}
footer .contact{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 auto 14px;padding:12px 16px;max-width:420px;background:#fff;border-radius:14px;box-shadow:var(--shadow)}
footer .contact b{color:var(--ink);font-size:14px}footer .contact a{color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}.view{opacity:1;transform:none}}
</style>
<style>
.acct{display:flex;align-items:center;gap:10px;font-size:13px;color:#6c6c70;white-space:nowrap;flex-wrap:wrap}.acct a,.acct button{font:inherit;color:#007AFF;background:none;border:0;cursor:pointer;text-decoration:none;padding:0;font-weight:600}.acct .reg{background:#007AFF;color:#fff;border-radius:999px;padding:5px 12px}.acct .em{max-width:150px;overflow:hidden;text-overflow:ellipsis}@media(max-width:699px){.acct .em{display:none}}
input[type=password]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:.5px solid var(--line);background:#F7F7FA;color:var(--ink);outline:none}input[type=password]:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.15);background:#fff}

.hidden{display:none!important}

.comingsoon b{background:#FF9F0A;color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;letter-spacing:.02em}
.btn.sm{border:0;font:inherit;font-weight:700;cursor:pointer;border-radius:12px;padding:9px 15px;font-size:14px;text-align:center}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-top:.5px solid var(--line)}.mrow:first-child{border-top:0}.mrow .grow small{display:block;margin-top:3px}
.authwrap{max-width:460px;margin:12px auto 0}
.atabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--fill,#E9E9EE);border-radius:14px;padding:3px;margin:0 0 12px}
.atabs button{position:relative;z-index:1;border:0;background:none;font:inherit;font-weight:700;font-size:14px;padding:9px 6px;border-radius:11px;color:var(--mute);cursor:pointer;transition:color .3s}
.atabs button.on{color:var(--ink)}
.athumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:#fff;border-radius:11px;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.atabs[data-on=up] .athumb{transform:translateX(100%)}
.flip{perspective:1600px}
.flipin{display:grid;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.25,.8,.25,1)}
.flipin.flipped{transform:rotateY(180deg)}
.flipin .face{grid-area:1/1;align-self:start;backface-visibility:hidden;-webkit-backface-visibility:hidden;margin:0}
.flipin .face.flipback{transform:rotateY(180deg)}
.pwrow{position:relative}.pwrow input{padding-right:64px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);font:inherit;font-weight:700;font-size:13px;padding:8px 10px;cursor:pointer}
.meter{display:flex;gap:5px;margin:-6px 2px 4px}.meter i{flex:1;height:5px;border-radius:3px;background:#E3E3E8;transition:background .25s}
.meter i.s1{background:#FF3B30}.meter i.s2{background:#FF9F0A}.meter i.s3{background:#34C759}
.hint{min-height:18px;margin:0 2px 10px;color:var(--mute)}
.swap{margin:14px 2px 0;font-size:14px;color:var(--mute)}.swap .linkchip{padding:0;background:none}
.sentok{text-align:center;padding:10px 0;animation:donepop .45s cubic-bezier(.2,.8,.2,1)}@keyframes donepop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}.sentok .env{font-size:54px;animation:envbob 1.6s ease-in-out infinite}
@keyframes envbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.flipin,.athumb{transition:none}.sentok .env{animation:none}}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin-top:4px}.chk input{width:18px;height:18px}
.share{display:flex;gap:8px;max-width:520px;margin:0 auto}.share input{flex:1;min-width:0}
.manage{margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.manage small{width:100%;color:var(--mute)}
button.linkchip{border:0;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--blue)}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0}.sum{padding:14px 16px}.sum b{display:block}.sum span{display:block;font-size:20px;font-weight:800}.sum small{color:var(--mute)}
.tw{overflow-x:auto;margin-top:14px}table.rt{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}table.rt th{text-align:left;color:var(--mute);font-weight:600;padding:12px 14px;border-bottom:.5px solid var(--line)}table.rt td{padding:10px 14px;border-top:.5px solid var(--line);vertical-align:middle}table.rt select{padding:7px 10px;width:auto}table.rt a{color:var(--blue)}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const STATUS = { open: 'Registration open', soon: 'Coming soon', done: 'Completed' };
const P = window.Platform, cloud = !!(P && P.configured);
let T = [], timer = null, isOrg = false, rt = 0;
$('#yr').textContent = new Date().getFullYear();

// ---------- data ----------
const longDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : 'To be announced';
const rowToT = r => ({ dbId: r.id, id: r.slug, name: r.name, title: r.title || r.name, date: r.event_date || '', dateText: longDate(r.event_date), time: r.time_text || '', venue: r.venue || '',
  status: r.status, category: r.category || '', fee: r.fee || '', deadline: r.deadline || '', perks: r.perks || '', levels: r.levels || {}, rules: r.rules || [], endpoint: r.endpoint || '',
  cover: r.cover_url || '', pay: r.payment_info || '', owner: r.created_by, published: r.published });
async function loadPublic() {
  // The public Tournaments page only lists the sample. Tournaments people create are shared by their registration link
  // (#/t/<slug>) and shown to their owner under "My tournaments", never in this public list.
  const sample = window.TOURNAMENTS || [];           // tournaments.js
  let list = sample;
  if (cloud) { try { const rows = (await P.listPublicTournaments()).map(rowToT).filter(t => t.id === 'example'); list = rows.length ? rows : sample; } catch (e) { console.warn(e); } }
  if (cloud && P.user) {                             // signed in: also show my own tournaments (nobody else's)
    try { const mine = (await P.listMyTournaments()).map(rowToT), have = new Set(mine.map(t => t.id)); list = list.filter(t => !have.has(t.id)).concat(mine); } catch (e) { console.warn(e); }
  }
  T = list;
}
const shareUrl = slug => location.origin + location.pathname + '#/t/' + slug;
// Creating tournaments is limited to the site owner for now (the database enforces it too, see supabase-step8.sql)
const OWNER_EMAIL = 'aijasonclark@gmail.com';
const canCreate = () => !!(cloud && P.user && String(P.user.email || '').toLowerCase() === OWNER_EMAIL);

// ---------- cards ----------
function cover(t, big) {
  if (t.cover) return '<div class="cover' + (big ? ' big' : '') + '"><img src="' + esc(t.cover) + '" alt=""></div>';
  const d = new Date(t.date + 'T00:00:00'), when = isNaN(d) ? '' : MON[d.getMonth()] + ' ' + d.getDate();
  return '<div class="cover' + (big ? ' big' : '') + '"><svg viewBox="0 0 288 288" aria-hidden="true"><use href="#art"/></svg>' +
    (big ? '' : '<div class="ct">' + esc(t.title || t.name) + '</div>') + (when ? '<span class="cd">' + when + '</span>' : '') + '</div>';
}
function tcard(t, link) {
  return '<a class="tcard card" ' + (link ? 'href="#/t/' + esc(t.id) + '"' : '') + '>' + cover(t) + '<div class="tbody"><b>' + esc(t.name) + '</b><small>' + esc(t.venue) + (t.venue && t.dateText ? ' · ' : '') + esc(t.dateText) +
    '</small><div class="trow"><span class="pill ' + t.status + '">' + STATUS[t.status] + '</span>' + (t.published === false ? '<span class="pill done">Draft</span>' : '') + '<span class="chev">›</span></div></div></a>';
}

function initAccount(next) {
  const wrap = $('.authwrap'), fl = $('#flipin'), fin = $('#fin'), fup = $('#fup');
  const ie = $('#ie'), ue = $('#ue');
  const say = (id, m, ok) => { const e = $(id); if (!e) return; e.textContent = m || ''; e.style.color = ok ? '#1E8E3E' : ''; };
  let face = next === 'new' ? 'up' : 'in';
  const show = (f, quiet) => {                                  // flip the card over to the other side
    if (!quiet) { if (f === 'up' && ie.value && !ue.value) ue.value = ie.value; if (f === 'in' && ue.value && !ie.value) ie.value = ue.value; }
    face = f; fl.classList.toggle('flipped', f === 'up');
    fin.inert = f === 'up'; fup.inert = f === 'in'; fin.setAttribute('aria-hidden', f === 'up'); fup.setAttribute('aria-hidden', f === 'in');
    $$('#atabs button').forEach(b => b.classList.toggle('on', b.dataset.face === f)); $('#atabs').dataset.on = f;
    say('#ierr', ''); say('#uerr', '');
    if (!quiet) setTimeout(() => { const el = f === 'up' ? (ue.value ? $('#up1') : ue) : (ie.value ? $('#ip') : ie); el.focus({ preventScroll: true }); }, 480);
  };
  $$('[data-face]').forEach(b => b.onclick = () => show(b.dataset.face));
  $$('[data-eye]').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.eye), on = i.type === 'password'; i.type = on ? 'text' : 'password'; b.textContent = on ? 'Hide' : 'Show'; b.setAttribute('aria-label', on ? 'Hide password' : 'Show password'); });
  show(face, true);
  if (cloud && P.recoveryError && P.recoveryError()) say('#ierr', P.recoveryError());
  // live feedback while creating the account: strength and match
  const strength = p => (p.length >= 8 ? 1 : 0) + (/[A-Z]/.test(p) && /[a-z]/.test(p) ? 1 : 0) + (/\d/.test(p) || /[^A-Za-z0-9]/.test(p) ? 1 : 0) + (p.length >= 12 ? 0 : 0);
  const feel = () => {
    const p = $('#up1').value, q = $('#up2').value, st = p.length < 8 ? 0 : Math.max(1, strength(p)), lab = ['', 'Weak', 'Okay', 'Strong'];
    $$('#meter i').forEach((b, k) => { b.className = k < st ? 's' + st : ''; });
    $('#mtxt').textContent = !p ? '' : p.length < 8 ? (8 - p.length) + ' more character' + (8 - p.length === 1 ? '' : 's') + ' needed' : lab[st] + ' password';
    const m = $('#mmatch'); m.textContent = !q ? '' : q === p ? '✓ Passwords match' : 'Passwords do not match yet'; m.style.color = !q ? '' : q === p ? '#1E8E3E' : '#D70015';
  };
  $('#up1').oninput = feel; $('#up2').oninput = feel;
  if (!cloud) { say('#ierr', 'The cloud is not connected yet. Add your Supabase URL and key in platform-config.js.'); say('#uerr', 'The cloud is not connected yet.'); return; }
  const go = async () => { await new Promise(r => { const i = setInterval(() => { if (P.user) { clearInterval(i); r(); } }, 50); setTimeout(() => { clearInterval(i); r(); }, 3000); }); location.hash = '#/' + (next || 'mine'); };
  fin.addEventListener('submit', async e => { e.preventDefault(); say('#ierr', '');
    if (!ie.value.trim() || !$('#ip').value) return say('#ierr', 'Enter your email and password.');
    $('#isub').disabled = true; try { await P.signIn(ie.value, $('#ip').value); await go(); } catch (x) { say('#ierr', x.message); } $('#isub').disabled = false; });
  fup.addEventListener('submit', async e => { e.preventDefault(); say('#uerr', '');
    const em = ue.value.trim(), p = $('#up1').value, q = $('#up2').value;
    if (!/^\S+@\S+\.\S+$/.test(em)) return say('#uerr', 'Enter a valid email.');
    if (p.length < 8) return say('#uerr', 'Your password needs at least 8 characters.');
    if (p !== q) return say('#uerr', 'The two passwords do not match.');
    $('#usub').disabled = true;
    try {
      const r = await P.signUp(em, p);
      if (r === 'signed-in') { await go(); return; }
      fup.innerHTML = '<div class="sentok"><div class="env">✉️</div><h1 style="font-size:26px">Check your email</h1><p class="lead">We sent a confirmation link to <b>' + esc(em) + '</b>. Open it, then come back and sign in.</p><div class="acts" style="justify-content:center"><button class="btn sm" id="backin" type="button">Back to sign in</button></div></div>';
      $('#backin').onclick = () => { ie.value = em; show('in'); };
    } catch (x) { say('#uerr', x.message); $('#usub').disabled = false; }
  });
  $('#ifg').onclick = async () => { say('#ierr', ''); if (!ie.value.trim()) return say('#ierr', 'Type your email first, then press Forgot password.');
    try { await P.resetPassword(ie.value); say('#ierr', 'If that email has an account, a reset link is on its way. Open it on this device to choose a new password.', true); } catch (x) { say('#ierr', x.message); } };
}

async function initReset() {
  const lead = $('#rlead'), body = $('#rbody'), dead = $('#rdead');
  const dieWith = m => { lead.textContent = ''; $('#rdmsg').textContent = m; dead.classList.remove('hidden'); body.classList.add('hidden'); };
  if (!cloud) return dieWith('The cloud is not connected yet.');
  if (P.recoveryError()) return dieWith(P.recoveryError());
  // the link signs you in for a moment: wait for that session before showing the form
  const ok = await new Promise(r => { const t0 = Date.now(), i = setInterval(() => { if (P.user) { clearInterval(i); r(true); } else if (Date.now() - t0 > 5000) { clearInterval(i); r(false); } }, 80); });
  if (!ok) return dieWith('This reset link has expired or was already used. Request a new one from the sign in page.');
  lead.textContent = 'Signed in as ' + P.user.email + '. Pick a new password.'; body.classList.remove('hidden'); $('#rp1').focus();
  $$('[data-eye]').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.eye), on = i.type === 'password'; i.type = on ? 'text' : 'password'; b.textContent = on ? 'Hide' : 'Show'; });
  const feel = () => {
    const p = $('#rp1').value, q = $('#rp2').value, st = p.length < 8 ? 0 : 1 + (/[A-Z]/.test(p) && /[a-z]/.test(p) ? 1 : 0) + (/\d|[^A-Za-z0-9]/.test(p) ? 1 : 0), lab = ['', 'Weak', 'Okay', 'Strong'];
    $$('#rmeter i').forEach((b, k) => { b.className = k < st ? 's' + st : ''; });
    $('#rtxt').textContent = !p ? '' : p.length < 8 ? (8 - p.length) + ' more character' + (8 - p.length === 1 ? '' : 's') + ' needed' : lab[Math.max(1, st)] + ' password';
    const m = $('#rmatch'); m.textContent = !q ? '' : q === p ? '\u2713 Passwords match' : 'Passwords do not match yet'; m.style.color = !q ? '' : q === p ? '#1E8E3E' : '#D70015';
  };
  $('#rp1').oninput = () => { feel(); $('#rerr').textContent = ''; }; $('#rp2').oninput = () => { feel(); $('#rerr').textContent = ''; };
  $('#rf').addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#rerr'); err.textContent = ''; err.style.color = '';
    const p = $('#rp1').value, q = $('#rp2').value;
    if (p.length < 8) return err.textContent = 'Your password needs at least 8 characters.';
    if (p !== q) return err.textContent = 'The two passwords do not match.';
    $('#rsub').disabled = true;
    try {
      await P.updatePassword(p);
      body.classList.add('hidden'); lead.innerHTML = '';
      $('#rf').insertAdjacentHTML('beforeend', '<div class="sentok"><div class="env">\u2705</div><h1 style="font-size:26px">Password updated</h1><p class="lead">You are signed in. Next time, sign in with your new password.</p><div class="acts" style="justify-content:center"><a class="btn sm" href="#/tournaments">Continue</a></div></div>');
      setTimeout(() => { if (!location.hash || location.hash === '#/reset' || /access_token/.test(location.hash)) location.hash = '#/tournaments'; }, 2200);
    } catch (x) { err.textContent = x.message; $('#rsub').disabled = false; }
  });
}

  }

    (r.published ? '<p class="lead" style="margin:6px auto 14px">Share this link with your players. Anyone with it can see the details and register.</p><div class="share"><input id="sl" type="text" readonly value="' + esc(link) + '"><button class="btn sm" id="scp" type="button">Copy link</button></div>'
      : '<p class="lead" style="margin:6px auto 14px">This is a private draft. Edit it and tick "Visible to the public" when you are ready to share.</p>') +
    '<div class="acts" style="justify-content:center;margin-top:18px"><a class="btn sm ghost" href="#/t/' + esc(r.slug) + '">View page</a><a class="btn sm ghost" href="#/regs/' + esc(r.slug) + '">Players</a><a class="btn sm ghost" href="#/mine">My tournaments</a></div></div>');
  const c = $('#scp'); if (c) { $('#sl').onclick = e => e.target.select(); c.onclick = () => copyText(link, c); }
}

// ---------- registrations (organizer view) ----------
function regsPage(t, regs) {
  const lv = Object.keys(t.levels || {}), cnt = (l, s) => regs.filter(x => (l ? x.level === l : true) && (s ? x.status === s : true)).length;
  return '<a class="back" href="#/mine">‹ My tournaments</a><div class="head"><div><h1>Players</h1><p class="lead">' + esc(t.name) + ' · ' + regs.length + ' registered</p></div>' +
    '<div class="acts"><button class="btn sm ghost" id="rem">Copy emails</button><button class="btn sm ghost" id="rcsv">Download CSV</button></div></div>' +
    (lv.length ? '<div class="sumrow">' + lv.map(l => '<div class="card sum"><b>' + l + '</b><span>' + cnt(l, 'approved') + '/' + t.levels[l].cap + ' approved</span><small>' + cnt(l) + ' registered</small></div>').join('') + '</div>' : '') +
    (regs.length ? '<div class="card tw"><table class="rt"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Level</th><th>Status</th><th></th></tr></thead><tbody>' + regs.map(x =>
      '<tr><td><b>' + esc(x.name) + '</b></td><td><a href="mailto:' + esc(x.email) + '">' + esc(x.email) + '</a></td><td>' + esc(x.phone || '') + '</td><td>' + esc(x.level || '') + '</td>' +
      '<td><select data-st="' + x.id + '">' + ['pending', 'approved', 'declined'].map(s => '<option value="' + s + '"' + (x.status === s ? ' selected' : '') + '>' + s[0].toUpperCase() + s.slice(1) + '</option>').join('') + '</select></td>' +
      '<td><button class="btn sm danger" data-rm="' + x.id + '">Remove</button></td></tr>').join('') + '</tbody></table></div>'
      : '<div class="card soon-card" style="margin-top:14px"><div class="big">📭</div><p class="lead" style="margin:6px auto 0">No one has registered yet. Share your link to get sign-ups.</p></div>') +
    '<p class="lead" style="margin-top:14px;font-size:14px">Set a player to Approved to count them in the slot counter. Players are not emailed automatically, so use the email links or Copy emails to let them know.</p>';
}
function initRegs(t, regs) {
  document.querySelectorAll('[data-st]').forEach(s => s.onchange = async () => { try { await P.setRegistrationStatus(s.dataset.st, s.value); route(); } catch (x) { alert(x.message); } });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { if (!confirm('Remove this player?')) return; try { await P.deleteRegistration(b.dataset.rm); route(); } catch (x) { alert(x.message); } });
  $('#rem').onclick = () => copyText(regs.map(x => x.email).join(', '), $('#rem'));
  $('#rcsv').onclick = () => {
    const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"', rows = [['Registered', 'Name', 'Email', 'Phone', 'Level', 'Status']].concat(regs.map(x => [x.created_at, x.name, x.email, x.phone, x.level, x.status]));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' })); a.download = (t.id || 'players') + '-players.csv'; a.click(); };
}

// ---------- one tournament (event page) ----------
function eventPage(t) {
  const lv = Object.keys(t.levels), open = t.status === 'open' && (t.endpoint || t.dbId);
  const kv = (k, v) => v ? '<div class="kv"><span>' + k + '</span><b>' + esc(v) + '</b></div>' : '';
  return '<a class="back" href="#/tournaments">‹ Tournaments</a>' +
    (canManage(t) ? '<div class="card pad manage"><b>You manage this tournament</b><div class="acts"><button class="btn sm ghost" id="mcopy" type="button">Copy share link</button><a class="btn sm ghost" href="#/regs/' + esc(t.id) + '">Players</a><a class="btn sm ghost" href="#/edit/' + esc(t.id) + '">Edit</a></div>' + (t.published === false ? '<small>Draft: only you can see this page.</small>' : '') + '</div>' : '') +
    '<section class="card">' + cover(t, true) + '<div class="hero"><span class="pill ' + t.status + '">' + STATUS[t.status] + '</span><h1>' + esc(t.title) + '</h1>' +
    '<div class="chips"><span class="chip">📅 ' + esc(t.dateText) + '</span>' + (t.venue ? '<span class="chip">📍 ' + esc(t.venue) + '</span>' : '') + (t.time ? '<span class="chip">⏰ ' + esc(t.time) + '</span>' : '') + '<button class="chip linkchip" id="shbtn" type="button">🔗 Copy link</button></div>' +
    (t.status !== 'done' && t.date ? '<div class="count" id="count" aria-label="Countdown"><div><b id="cd">--</b><span>Days</span></div><div><b id="ch">--</b><span>Hours</span></div><div><b id="cm">--</b><span>Mins</span></div><div><b id="cs">--</b><span>Secs</span></div></div>' : '') +
    '</div></section>' +
    '<h2>Details</h2><div class="card">' + kv('Date', t.dateText) + kv('Time', t.time) + kv('Venue', t.venue) + kv('Category', t.category) + kv('Entry fee', t.fee) + kv('Payment deadline', t.deadline) + kv('Included', t.perks) + '</div>' +
    (t.rules.length ? '<h2>Rules: quick heads-up</h2><div class="card">' + t.rules.map(r => '<div class="rule"><em>' + esc(r[0]) + '</em><div><b>' + esc(r[1]) + '</b><small>' + esc(r[2]) + '</small></div></div>').join('') + '</div>' : '') +
    '<h2>Register</h2><div class="card" id="reg">' + (open ? formHtml(t, lv) : '<div class="pad"><div class="note">' + (t.status === 'done' ? 'This tournament is finished.' : 'Registration for this tournament opens soon. Check back here.') + '</div></div>') + '</div>';
}
function formHtml(t, lv) {
  return '<form id="rf" class="pad" novalidate>' +
    '<div><label class="f" for="n">Full name</label><input id="n" type="text" autocomplete="name" maxlength="100" placeholder="Juan Dela Cruz"><div class="err"></div></div>' +
    '<div class="two" style="margin-top:14px"><div><label class="f" for="e">Email</label><input id="e" type="email" autocomplete="email" maxlength="200" placeholder="you@example.com"><div class="err"></div></div>' +
    '<div><label class="f" for="p">Phone number</label><input id="p" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" placeholder="0917 123 4567"><div class="err"></div></div></div>' +
    '<input id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">' +
    (lv.length ? '<fieldset style="border:0;padding:0;margin:18px 0 0"><legend class="f" style="padding:0">Skill level</legend><div class="lvls">' +
    lv.map(l => '<label class="lv"><span class="slots" data-l="' + esc(l) + '">–/' + t.levels[l].cap + ' slots</span><input type="radio" name="skill" value="' + esc(l) + '"><span class="pillbtn">' + esc(l) + '</span>' +
      (t.levels[l].base ? '<small>Base player: ' + esc(t.levels[l].base) + '</small>' : '') + '</label>').join('') + '</div><div class="err" id="skillErr"></div></fieldset>' : '') +
    '<p class="err" id="sendErr" style="margin:14px 0 0"></p><button class="btn" id="go" type="submit" style="margin-top:14px">Submit registration</button></form>';
}
function thanksHtml(t) {
  if (t.endpoint) return '<div class="ok"><div class="tick">✓</div><h1 style="font-size:28px">Thank you!</h1><p class="lead" style="margin:6px auto 0">Your registration is in. Entries are approved for players with several recorded attendances at our regular schedule games. We\'ll email you once yours is approved.</p>' +
    '<p class="note" style="margin:18px auto 0;max-width:460px;font-size:14px">Tip: check your Spam or Promotions folder too, and mark our email as "Not spam" if you find it there.</p></div>';
  return '<div class="ok"><div class="tick">✓</div><h1 style="font-size:28px">You\'re registered!</h1><p class="lead" style="margin:6px auto 0">The organizer will review your registration and contact you by email.</p>' +
    (t.pay ? '<div class="note" style="margin:18px auto 0;max-width:460px;font-size:15px;text-align:left"><b>How to pay</b><br>' + esc(t.pay).replace(/\n/g, '<br>') + (t.deadline ? '<br><br>Payment deadline: ' + esc(t.deadline) : '') + '</div>' : '') +
    '<p class="note" style="margin:14px auto 0;max-width:460px;font-size:14px">Tip: check your Spam or Promotions folder for their email.</p></div>';
}
function initEvent(t) {
  const sb = $('#shbtn'); if (sb) sb.onclick = () => copyText(shareUrl(t.id), sb, '🔗 Copy link');
  const mc = $('#mcopy'); if (mc) mc.onclick = () => copyText(shareUrl(t.id), mc);
  if (t.date) {
    const end = new Date(t.date + 'T00:00:00+08:00').getTime();
    const tick = () => { if (!$('#cd')) return; const s = Math.max(0, Math.floor((end - Date.now()) / 1000)), p = n => String(n).padStart(2, '0');
      $('#cd').textContent = p(Math.floor(s / 86400)); $('#ch').textContent = p(Math.floor(s % 86400 / 3600)); $('#cm').textContent = p(Math.floor(s % 3600 / 60)); $('#cs').textContent = p(s % 60); };
    tick(); timer = setInterval(tick, 1000);
  }
  const form = $('#rf'); if (!form) return;
  window.showSlots = counts => document.querySelectorAll('.slots').forEach(el => { const l = el.dataset.l, cap = t.levels[l].cap, n = counts ? counts[l] || 0 : null;
    el.textContent = counts ? n + '/' + cap + ' slots' : ''; el.classList.toggle('full', !!counts && n >= cap); });
  if (t.endpoint) { const s = document.createElement('script'); s.src = t.endpoint + '?callback=showSlots&t=' + Date.now(); s.onerror = () => window.showSlots(null); document.head.appendChild(s); }
  else if (cloud && t.dbId) P.slotCounts(t.dbId).then(window.showSlots).catch(() => window.showSlots(null));
  const setErr = (el, m) => { el.parentElement.querySelector('.err').textContent = m; };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if ($('#hp').value) return;                                     // hidden field: bots fill it, people do not
    const d = { name: $('#n').value.trim(), email: $('#e').value.trim(), phone: $('#p').value.trim(), skill: (form.querySelector('input[name=skill]:checked') || {}).value || '' };
    let ok = true; const chk = (bad, el, m) => { setErr(el, bad ? m : ''); if (bad) ok = false; };
    chk(d.name.length < 2, $('#n'), 'Enter your full name.'); chk(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email), $('#e'), 'Enter a valid email, like you@example.com.');
    chk(d.phone.replace(/\D/g, '').length < 7, $('#p'), 'Enter a phone number with at least 7 digits.');
    if ($('#skillErr')) { $('#skillErr').textContent = d.skill ? '' : 'Choose your skill level.'; if (!d.skill) ok = false; }
    if (!ok) return;
    const btn = $('#go'); $('#sendErr').textContent = ''; btn.disabled = true; btn.textContent = 'Submitting...';
    try {
      if (t.endpoint) {
        const r = await fetch(t.endpoint, { method: 'POST', body: new URLSearchParams(d) }), out = await r.json();
        if (out.result !== 'success') throw new Error(out.message || 'Script error');
      } else await P.registerForTournament(t.dbId, { name: d.name, email: d.email, phone: d.phone, level: d.skill });
      $('#reg').innerHTML = thanksHtml(t); $('#reg').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) { $('#sendErr').textContent = 'Your registration didn\'t go through (' + err.message + '). Check your connection and try again.'; btn.disabled = false; btn.textContent = 'Submit registration'; }
  });
}

// ---------- the other tabs ----------
// The two tools live in their own pages. They are loaded once, in the background, and then only shown or hidden,
// so switching tabs is instant and keeps whatever you were doing.
const TOOLS = { draw: ['schedule.html', 'Draw & Schedule tool'], queue: ['queue.html', 'Queuing Tool'] };
function ensureTool(name) {
  let f = $('#tool-' + name);
  if (!f) {
    f = document.createElement('iframe'); f.id = 'tool-' + name; f.className = 'tool'; f.title = TOOLS[name][1]; f.style.display = 'none';
    f.addEventListener('load', () => { f.dataset.ready = '1'; try { f.contentDocument.documentElement.dataset.theme = 'light'; } catch (e) {} });
    f.src = TOOLS[name][0]; $('#tools').appendChild(f);
  }
  return f;
}
const setHdr = () => { const b = document.querySelector('header.bar'); if (b) document.documentElement.style.setProperty('--hdr', b.offsetHeight + 'px'); };
window.addEventListener('resize', setHdr);
// the tools tell us when their tab changes, so the address (and the Back button) follows them; links like #/queue/players open that tab
window.addEventListener('message', e => {
  if (e.origin !== location.origin) return; const d = e.data;
  if (d && d.t === 'tab' && (d.tool === 'queue' || d.tool === 'draw')) { const hh = '#/' + d.tool + '/' + d.tab; if (location.hash !== hh) history.pushState(null, '', hh); }
  if (d && d.t === 'sendQueue' && Array.isArray(d.players)) {      // Draw & Schedule -> Queuing Tool
    const f = ensureTool('queue'), go = () => { try { f.contentWindow.postMessage({ t: 'import', players: d.players }, location.origin); } catch (x) {} };
    history.pushState(null, '', '#/queue/players'); route(); if (f.dataset.ready) setTimeout(go, 350); else f.addEventListener('load', () => setTimeout(go, 600), { once: true });
  }
});
function gotoTool(name, arg) {
  const f = ensureTool(name), send = () => { try { f.contentWindow.postMessage({ t: 'goto', tab: arg }, location.origin); } catch (x) {} };
  if (f.dataset.ready) send(); else f.addEventListener('load', send, { once: true });
}
function showTool(name, arg) {
  ensureTool(name); $('#view').style.display = 'none'; $('#tools').style.display = '';
  document.documentElement.classList.add('tool-mode'); setHdr(); if (arg) gotoTool(name, arg);
  Object.keys(TOOLS).forEach(n => { const x = $('#tool-' + n); if (x) x.style.display = n === name ? '' : 'none'; });   // going from hidden to shown replays the pop-in
  window.scrollTo(0, 0);
}
function hideTools() { $('#tools').style.display = 'none'; $('#view').style.display = ''; document.documentElement.classList.remove('tool-mode'); }

// ---------- router (no page reloads, so the bar stays and switching feels instant) ----------
let prevTab = 'tournaments', lastNav = null;
function placeNavThumb(animate) {
  const th = document.querySelector('.nthumb'), on = document.querySelector('nav.seg a.on'); if (!th || !on) return;
  const x = on.offsetLeft, w = on.offsetWidth;
  if (animate && lastNav && (lastNav.x !== x || lastNav.w !== w)) {
    th.style.transition = 'none'; th.style.width = lastNav.w + 'px'; th.style.transform = 'translateX(' + lastNav.x + 'px)'; th.offsetWidth;
    th.style.transition = 'transform .55s var(--spring), width .55s var(--spring)';
  } else th.style.transition = 'none';
  th.style.width = w + 'px'; th.style.transform = 'translateX(' + x + 'px)'; lastNav = { x, w };
}
window.addEventListener('resize', () => placeNavThumb(false));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeNavThumb(false));
async function route() {
  clearInterval(timer);
  const tok = ++rt, parts = (location.hash.replace(/^#\/?/, '') || 'tournaments').split('/'), page = parts[0], arg = parts[1] ? decodeURIComponent(parts[1]) : '';
  const tab = ['draw', 'queue'].includes(page) ? page : 'tournaments';
  document.querySelectorAll('.seg a').forEach(a => a.classList.toggle('on', a.dataset.p === tab));
  const order = ['tournaments', 'draw', 'queue'], dir = Math.sign(order.indexOf(tab) - order.indexOf(prevTab)); prevTab = tab;
  $('#view').style.setProperty('--tx', (dir * 48) + 'px'); placeNavThumb(true);
  $('#main').classList.toggle('wide', page === 'draw' || page === 'queue');
  const titleFor = x => (x ? x + ' · ' : '') + 'Challenge - Tournament Management by Ai Jason Clark';
  document.title = titleFor('');
  if (cloud && ['mine', 'new', 'edit', 'regs'].includes(page)) await P.whenReady();   // wait until we know who is signed in
  if (tok !== rt) return;
  if (page === 'draw' || page === 'queue') { showTool(page, arg); return; }
  if (page === 'reset' || (cloud && P.recoveryPending && P.recoveryPending())) { setView(resetPage()); return initReset(); }   // came from a password-reset email (don't touch the hash yet: supabase is still reading the token from it)
  if (page === 'account') { setView(accountPage(arg)); return initAccount(arg); }
  if (['mine', 'new', 'edit'].includes(page) && P.user && !canCreate()) return setView(ownerOnly());
  if (page === 'mine') {
    if (!needUser('mine')) return; setView(loadingHtml);
    try { const rows = await P.listMyTournaments(); if (tok !== rt) return; setView(minePage(rows)); initMine(); } catch (e) { setView('<div class="card soon-card">' + esc(e.message) + '</div>'); }
    return;
  }
  if (page === 'new') { if (!needUser('new')) return; setView(builderPage(null)); return initBuilder(null); }
  if (page === 'edit' || page === 'regs') {
    if (!needUser(page + '/' + arg)) return; setView(loadingHtml);
    try {
      const r = await P.getTournament(arg); if (tok !== rt) return;
      if (!r || !(r.created_by === P.user.id || isOrg)) return setView('<a class="back" href="#/mine">‹ My tournaments</a><div class="card soon-card">We couldn\'t find that tournament in your account.</div>');
      if (page === 'edit') { setView(builderPage(r)); return initBuilder(r); }
      const regs = await P.listRegistrations(r.id); if (tok !== rt) return; const t = rowToT(r); setView(regsPage(t, regs)); initRegs(t, regs);
    } catch (e) { setView('<div class="card soon-card">' + esc(e.message) + '</div>'); }
    return;
  }
  if (page === 't' || page === 'tournament') {
    setView(loadingHtml);
    if (!T.length) await loadPublic();
    if (tok !== rt) return;
    let t = T.find(x => x.id === arg);
    if (!t && cloud) { try { const r = await P.getTournament(arg); if (r) t = rowToT(r); } catch (e) {} }          // drafts are visible to their owner
    if (tok !== rt) return;
    if (!t) return setView('<a class="back" href="#/tournaments">‹ Tournaments</a><div class="card soon-card"><div class="big">🔎</div><h1 style="font-size:24px">Tournament not found</h1><p class="lead" style="margin:6px auto 0">The link may be wrong, or the organizer has hidden this tournament.</p></div>');
    document.title = titleFor(t.name); setView(eventPage(t)); return initEvent(t);
  }
  setView(loadingHtml); await loadPublic(); if (tok !== rt) return; setView(listPage());
}
window.addEventListener('hashchange', route);
setTimeout(() => Object.keys(TOOLS).forEach(ensureTool), 1200);     // warm up both tools while the person looks at the first page

// ---------- account chip in the header ----------
function chip() {
  const c = $('#acct'); if (!c) return; if (!cloud) { c.innerHTML = ''; return; }
  c.innerHTML = P.user ? (canCreate() ? '<a href="#/mine">My tournaments</a>' : '') + '<span class="em">' + esc(P.user.email) + '</span><button id="so" type="button">Sign out</button>' : '<a href="#/account">Sign in</a><a class="reg" href="#/account/new">Create account</a>';
  const b = $('#so'); if (b) b.onclick = async () => { await P.signOut(); location.hash = '#/tournaments'; };
}
if (cloud) P.onAuth(async () => { try { isOrg = await P.isOrganizer(); } catch (e) { isOrg = false; } chip(); if (/^(#\/?)?(tournaments|t\/.*|tournament\/.*)?$/.test(location.hash)) route(); });
chip();
route();
</script>
