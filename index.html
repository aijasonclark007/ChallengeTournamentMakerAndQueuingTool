<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Challenge - Tournament Management by Ai Jason Clark</title>
<meta name="description" content="Challenge - Tournament Management by Ai Jason Clark: tournaments, draw and schedule tool, and queuing tool for our badminton club.">
<meta property="og:title" content="Challenge - Tournament Management by Ai Jason Clark">
<meta property="og:description" content="Tournaments, draw & schedule, and queuing for the Racketeers badminton club.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F2F2F7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F2F7;--card:#fff;--ink:#1C1C1E;--mute:#6E6E73;--line:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--navy:#0A2547;
 --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
.bar{position:sticky;top:0;z-index:20;background:rgba(249,249,251,.72);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:50%}
.brand b{display:block;font-size:17px;letter-spacing:-.01em;line-height:1.1}.brand small{display:block;color:var(--mute);font-size:12px}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2px;gap:2px;width:100%}@media(min-width:700px){.seg{width:auto}}
.seg a{flex:1;text-align:center;padding:7px 10px;border-radius:9px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--ink);transition:background .2s,box-shadow .2s}@media(min-width:700px){.seg a{font-size:14px;padding:7px 16px}}
.seg a.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 56px}
main.wide{max-width:1280px;padding-top:12px}
.view{opacity:0;transform:translateY(8px)}.view.in{opacity:1;transform:none;transition:opacity .28s ease,transform .28s ease}
h1{font-size:clamp(30px,6vw,40px);letter-spacing:-.03em;line-height:1.08;margin:6px 0 4px;font-weight:800}
h2{font-size:13px;color:var(--mute);font-weight:600;margin:28px 0 8px 16px;letter-spacing:.01em;text-transform:none}
.lead{color:var(--mute);margin:0 0 8px;max-width:60ch}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:.5px solid var(--line)}.row:first-child{border-top:0}
a.row:active{background:var(--fill)}
.badge{flex:0 0 52px;height:52px;border-radius:14px;background:linear-gradient(180deg,#fff,#EEF1F7);border:.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge i{font-style:normal;font-size:11px;font-weight:700;color:var(--red);margin-bottom:3px}.badge b{font-size:21px}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:17px;letter-spacing:-.01em}.grow small{color:var(--mute);font-size:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.open{background:rgba(52,199,89,.16);color:#1E8E3E}.pill.soon{background:rgba(255,149,0,.16);color:#B26A00}.pill.done{background:var(--fill);color:var(--mute)}
.chev{color:#C4C4C9;font-size:22px;font-weight:300}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600;margin:2px 0 8px}
.hero{padding:26px 22px;background:radial-gradient(120% 140% at 0% 0%,#E8F1FF 0%,#fff 60%)}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{background:var(--fill);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px;max-width:420px}
.count div{background:#fff;border:.5px solid var(--line);border-radius:14px;padding:10px 0;text-align:center}
.count b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.count span{font-size:12px;color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;border-top:.5px solid var(--line)}.kv:first-child{border-top:0}
.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
.rule{display:flex;gap:12px;padding:13px 16px;border-top:.5px solid var(--line)}.rule:first-child{border-top:0}.rule em{font-style:normal;font-size:22px;line-height:1.2}
.rule b{display:block}.rule small{color:var(--mute);font-size:14px}
.f{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.in{display:block}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:.5px solid var(--line);background:#F7F7FA;color:var(--ink);outline:none;transition:box-shadow .15s,border-color .15s}
input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.15);background:#fff}
.two{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:560px){.two{grid-template-columns:1fr 1fr}.lvls{grid-template-columns:repeat(3,1fr)!important}}
.lvls{display:grid;gap:10px;grid-template-columns:1fr}
.lv{cursor:pointer;display:block}.lv input{position:absolute;opacity:0;pointer-events:none}
.lv .slots{display:block;text-align:center;font-size:12px;font-weight:700;color:#1E8E3E;margin-bottom:5px;min-height:18px}.lv .slots.full{color:var(--red)}
.lv .pillbtn{display:block;text-align:center;padding:12px;border-radius:14px;background:#F7F7FA;border:1.5px solid transparent;font-weight:700;transition:all .15s}
.lv input:checked + .pillbtn{background:rgba(0,122,255,.1);border-color:var(--blue);color:var(--blue)}
.lv input:focus-visible + .pillbtn{box-shadow:0 0 0 4px rgba(0,122,255,.25)}
.lv small{display:block;text-align:center;color:var(--mute);font-size:12px;margin-top:5px;line-height:1.3}
.err{color:var(--red);font-size:13px;margin:5px 2px 0;min-height:0}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;padding:14px 22px;border-radius:14px;background:var(--blue);color:#fff;width:100%;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;cursor:wait}
.note{background:rgba(255,149,0,.12);color:#8A5300;border-radius:14px;padding:14px 16px}
.ok{text-align:center;padding:34px 22px}.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 14px}
.tool{width:100%;height:calc(100vh - 118px);min-height:560px;border:0;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.soon-card{text-align:center;padding:48px 22px}.soon-card .big{font-size:44px}
.cover{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#0A2547,#1B5192);overflow:hidden}
.cover:before{content:"";position:absolute;inset:7% 5%;border:2px solid rgba(255,255,255,.1);border-radius:4px;background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.1) 50%,transparent calc(50% + 1px))}
.cover svg{position:absolute;right:2%;top:50%;transform:translateY(-50%);height:94%;width:auto}
.cover .ct{position:absolute;left:16px;bottom:16px;max-width:50%;color:#fff;font-weight:800;font-size:clamp(15px,2.4vw,21px);line-height:1.12;letter-spacing:-.01em}
.cover .cd{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cover.big{aspect-ratio:auto;height:clamp(150px,26vw,230px)}.cover.big svg{height:112%;right:6%}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.tgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-top:14px}
.tcard{display:block;transition:transform .2s,box-shadow .2s}.tcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 16px 36px rgba(0,0,0,.1)}.tcard:active{transform:scale(.99)}
.tbody{padding:14px 16px 16px}.tbody b{display:block;font-size:18px;letter-spacing:-.01em}.tbody small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.trow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn.sm{width:auto;padding:10px 18px;font-size:15px;display:inline-block}
input[type=date],input[type=number],select,textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:.5px solid var(--line);background:#F7F7FA;color:var(--ink);outline:none}
input[type=date]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,122,255,.15);background:#fff}
.bgrid{display:grid;gap:18px;grid-template-columns:1fr;align-items:start}@media(min-width:900px){.bgrid{grid-template-columns:1.1fr .9fr}.stick{position:sticky;top:96px}}
.fld{margin-bottom:14px}.lvrow{display:grid;grid-template-columns:70px 90px 1fr;gap:8px;align-items:center;margin-bottom:8px}.lvrow b{font-size:15px}
.code{font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;min-height:260px;white-space:pre}
ol.steps{margin:10px 0 0;padding-left:20px;color:var(--mute);font-size:14px}ol.steps li{margin:4px 0}
footer{text-align:center;color:var(--mute);font-size:13px;padding:8px 16px 32px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}.view{opacity:1;transform:none}}
</style>
<style>.chip{display:flex;align-items:center;gap:8px;font-size:12px;color:#6c6c70;white-space:nowrap}.chip a,.chip button{font:inherit;color:#007AFF;background:none;border:0;cursor:pointer;text-decoration:none;padding:0}.chip .reg{background:#007AFF;color:#fff;border-radius:999px;padding:5px 11px;font-weight:600}.chip .em{max-width:140px;overflow:hidden;text-overflow:ellipsis}@media(max-width:699px){.chip .em{display:none}}</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script src="tournaments.js"></script>
<script>
const T = window.TOURNAMENTS || [], $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const STATUS = { open: 'Registration open', soon: 'Coming soon', done: 'Completed' };
let timer = null;
$('#yr').textContent = new Date().getFullYear();

// ---------- Tournaments tab ----------
let isOrg = false;
const P = window.Platform, isAdmin = () => { if (P && P.configured) return isOrg; try { return localStorage.getItem('rbc.admin') === '1'; } catch (e) { return false; } };
try { if (/[?&]admin=1/.test(location.search)) localStorage.setItem('rbc.admin', '1'); if (/[?&]admin=0/.test(location.search)) localStorage.removeItem('rbc.admin'); } catch (e) {}

function cover(t, big) {
  if (t.cover) return '<div class="cover' + (big ? ' big' : '') + '"><img src="' + esc(t.cover) + '" alt=""></div>';
  const d = new Date(t.date + 'T00:00:00'), when = isNaN(d) ? '' : MON[d.getMonth()] + ' ' + d.getDate();
  return '<div class="cover' + (big ? ' big' : '') + '"><svg viewBox="0 0 288 288" aria-hidden="true"><use href="#art"/></svg>' +
    (big ? '' : '<div class="ct">' + esc(t.title || t.name) + '</div>') + (when ? '<span class="cd">' + when + '</span>' : '') + '</div>';
}
function tcard(t, link) {
  return '<a class="tcard card" ' + (link ? 'href="#/tournament/' + t.id + '"' : '') + '>' + cover(t) + '<div class="tbody"><b>' + esc(t.name) + '</b><small>' + esc(t.venue) + ' · ' + esc(t.dateText) +
    '</small><div class="trow"><span class="pill ' + t.status + '">' + STATUS[t.status] + '</span><span class="chev">›</span></div></div></a>';
}
function listPage() {
  const up = T.filter(t => t.status !== 'done'), past = T.filter(t => t.status === 'done'), grid = l => '<div class="tgrid">' + l.map(t => tcard(t, true)).join('') + '</div>';
  return '<div class="head"><div><h1>Tournaments</h1><p class="lead">Tap one to see the details and register.</p></div>' +
    (isAdmin() ? '<a class="btn sm" href="#/new">+ Create a tournament</a>' : '') + '</div>' +
    (up.length ? '<h2>Upcoming</h2>' + grid(up) : '') + (past.length ? '<h2>Past</h2>' + grid(past) : '') +
    (!T.length ? '<div class="card soon-card">No tournaments yet.</div>' : '');
}

// ---------- create a tournament (builds the block you paste into tournaments.js) ----------
function newPage() {
  const fld = (id, label, type, ph, extra) => '<div class="fld"><label class="f" for="b-' + id + '">' + label + '</label><input id="b-' + id + '" type="' + (type || 'text') + '" placeholder="' + (ph || '') + '" ' + (extra || '') + '></div>';
  return '<a class="back" href="#/tournaments">‹ Tournaments</a><h1>Create a tournament</h1><p class="lead">Fill in the details. The card and the code update as you type.</p>' +
    '<div class="bgrid" style="margin-top:14px"><div class="card pad">' +
    fld('name', 'Tournament name (shown on the card)', 'text', 'Nov 9 Tournament') + fld('title', 'Event title (headline on its page)', 'text', 'Racketeers B.C. Badminton Tournament') +
    '<div class="two">' + fld('date', 'Date', 'date') + fld('time', 'Time', 'text', '2:00 PM - 9:00 PM') + '</div>' +
    fld('venue', 'Venue', 'text', 'IBT Sports Center') +
    '<div class="fld"><label class="f" for="b-status">Status</label><select id="b-status"><option value="open">Registration open</option><option value="soon" selected>Coming soon</option><option value="done">Completed</option></select></div>' +
    '<div class="two">' + fld('category', 'Category', 'text', 'Non-gender doubles') + fld('fee', 'Entry fee', 'text', '\u20b1500 / player') + '</div>' +
    '<div class="two">' + fld('deadline', 'Payment deadline', 'text', 'October 30, 2026') + fld('perks', 'Included', 'text', 'Food & drinks, cash prizes & medals') + '</div>' +
    '<div class="fld"><label class="f">Skill levels (slots and base players)</label>' + ['High', 'Mid', 'Low'].map(l => '<div class="lvrow"><b>' + l + '</b><input id="b-cap' + l + '" type="number" min="0" placeholder="Slots"><input id="b-base' + l + '" type="text" placeholder="Base player: Name / Name"></div>').join('') + '<small style="color:var(--mute)">Leave Slots empty to skip a level.</small></div>' +
    '<div class="fld"><label class="f" for="b-rules">Rules (one per line: emoji | title | text)</label><textarea id="b-rules" rows="4" placeholder="\ud83c\udff8 | Game format | 31 points, single round-robin"></textarea></div>' +
    fld('endpoint', 'Registration link (your Google Apps Script web app URL)', 'text', 'https://script.google.com/macros/s/.../exec') +
    fld('cover', 'Cover picture link (optional)', 'text', 'Leave empty to use the racket picture') + fld('id', 'Page address (optional)', 'text', 'nov-9') +
    '</div><div class="stick"><h2 style="margin-top:0">Preview</h2><div id="bprev"></div>' +
    '<h2>Your tournament code</h2><textarea id="bcode" class="code" readonly></textarea>' +
    '<button class="btn" id="bcopy" type="button" style="margin-top:10px">Copy code</button>' +
    '<ol class="steps"><li>Copy the code.</li><li>On GitHub, open <b>tournaments.js</b> and click the pencil.</li><li>Paste it after the last <b>}</b> in the list. Put a comma after the block before it.</li><li>Click <b>Commit changes</b>. The card appears on this page.</li></ol></div></div>';
}
function initNew() {
  const v = id => ($('#b-' + id).value || '').trim(), slug = x => x.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const build = () => {
    const name = v('name') || 'New tournament', d = v('date');
    const o = { id: slug(v('id') || name) || 'new', name, title: v('title') || name, date: d, dateText: d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : 'To be announced',
      time: v('time') || 'To be announced', venue: v('venue') || 'To be announced', status: v('status'), category: v('category'), fee: v('fee'), deadline: v('deadline'), perks: v('perks'), levels: {}, rules: [], endpoint: v('endpoint') };
    ['High', 'Mid', 'Low'].forEach(l => { const cap = +v('cap' + l); if (cap > 0) { o.levels[l] = { cap }; if (v('base' + l)) o.levels[l].base = v('base' + l); } });
    v('rules') && $('#b-rules').value.split('\n').forEach(line => { const p = line.split('|').map(x => x.trim()); if (p.length >= 3) o.rules.push([p[0], p[1], p.slice(2).join(' | ')]); });
    if (v('cover')) o.cover = v('cover');
    $('#bprev').innerHTML = tcard(o, false); $('#bcode').value = JSON.stringify(o, null, 2) + ',';
  };
  document.querySelectorAll('.bgrid input, .bgrid select, .bgrid textarea').forEach(el => { if (el.id !== 'bcode') el.addEventListener('input', build); });
  $('#bcopy').onclick = () => { const c = $('#bcode'); c.select(); (navigator.clipboard ? navigator.clipboard.writeText(c.value) : Promise.reject()).catch(() => document.execCommand('copy')); $('#bcopy').textContent = 'Copied'; setTimeout(() => { $('#bcopy').textContent = 'Copy code'; }, 1800); };
  build();
}

// ---------- one tournament (event page) ----------
function eventPage(t) {
  const lv = Object.keys(t.levels), open = t.status === 'open' && t.endpoint;
  const kv = (k, v) => v ? '<div class="kv"><span>' + k + '</span><b>' + esc(v) + '</b></div>' : '';
  return '<a class="back" href="#/tournaments">‹ Tournaments</a>' +
    '<section class="card">' + cover(t, true) + '<div class="hero"><span class="pill ' + t.status + '">' + STATUS[t.status] + '</span><h1>' + esc(t.title) + '</h1>' +
    '<div class="chips"><span class="chip">📅 ' + esc(t.dateText) + '</span><span class="chip">📍 ' + esc(t.venue) + '</span>' + (t.time ? '<span class="chip">⏰ ' + esc(t.time) + '</span>' : '') + '</div>' +
    (t.status !== 'done' ? '<div class="count" id="count" aria-label="Countdown"><div><b id="cd">--</b><span>Days</span></div><div><b id="ch">--</b><span>Hours</span></div><div><b id="cm">--</b><span>Mins</span></div><div><b id="cs">--</b><span>Secs</span></div></div>' : '') +
    '</div></section>' +
    '<h2>Details</h2><div class="card">' + kv('Date', t.dateText) + kv('Time', t.time) + kv('Venue', t.venue) + kv('Category', t.category) + kv('Entry fee', t.fee) + kv('Payment deadline', t.deadline) + kv('Included', t.perks) + '</div>' +
    (t.rules.length ? '<h2>Rules: quick heads-up</h2><div class="card">' + t.rules.map(r => '<div class="rule"><em>' + r[0] + '</em><div><b>' + esc(r[1]) + '</b><small>' + esc(r[2]) + '</small></div></div>').join('') + '</div>' : '') +
    '<h2>Register</h2><div class="card" id="reg">' + (open && lv.length ? formHtml(t, lv) : '<div class="pad"><div class="note">' + (t.status === 'done' ? 'This tournament is finished.' : 'Registration for this tournament opens soon. Check back here.') + '</div></div>') + '</div>';
}
function formHtml(t, lv) {
  return '<form id="rf" class="pad" novalidate>' +
    '<div><label class="f" for="n">Full name</label><input id="n" type="text" autocomplete="name" placeholder="Juan Dela Cruz"><div class="err"></div></div>' +
    '<div class="two" style="margin-top:14px"><div><label class="f" for="e">Email</label><input id="e" type="email" autocomplete="email" placeholder="you@example.com"><div class="err"></div></div>' +
    '<div><label class="f" for="p">Phone number</label><input id="p" type="tel" inputmode="tel" autocomplete="tel" placeholder="0917 123 4567"><div class="err"></div></div></div>' +
    '<fieldset style="border:0;padding:0;margin:18px 0 0"><legend class="f" style="padding:0">Skill level</legend><div class="lvls">' +
    lv.map(l => '<label class="lv"><span class="slots" data-l="' + l + '">–/' + t.levels[l].cap + ' slots</span><input type="radio" name="skill" value="' + l + '"><span class="pillbtn">' + l + '</span>' +
      (t.levels[l].base ? '<small>Base player: ' + esc(t.levels[l].base) + '</small>' : '') + '</label>').join('') + '</div><div class="err" id="skillErr"></div></fieldset>' +
    '<p class="err" id="sendErr" style="margin:14px 0 0"></p><button class="btn" id="go" type="submit" style="margin-top:14px">Submit registration</button></form>';
}
function thanksHtml() {
  return '<div class="ok"><div class="tick">✓</div><h1 style="font-size:28px">Thank you!</h1><p class="lead" style="margin:6px auto 0">Your registration is in. Entries are approved for players with several recorded attendances at our regular schedule games. We\'ll email you once yours is approved.</p>' +
    '<p class="note" style="margin:18px auto 0;max-width:460px;font-size:14px">Tip: check your Spam or Promotions folder too, and mark our email as "Not spam" if you find it there.</p></div>';
}
function initEvent(t) {
  const end = new Date(t.date + 'T00:00:00+08:00').getTime();
  const tick = () => { if (!$('#cd')) return; const s = Math.max(0, Math.floor((end - Date.now()) / 1000)), p = n => String(n).padStart(2, '0');
    $('#cd').textContent = p(Math.floor(s / 86400)); $('#ch').textContent = p(Math.floor(s % 86400 / 3600)); $('#cm').textContent = p(Math.floor(s % 3600 / 60)); $('#cs').textContent = p(s % 60); };
  tick(); timer = setInterval(tick, 1000);
  const form = $('#rf'); if (!form) return;
  window.showSlots = counts => document.querySelectorAll('.slots').forEach(el => { const l = el.dataset.l, cap = t.levels[l].cap, n = counts ? counts[l] || 0 : null;
    el.textContent = counts ? n + '/' + cap + ' slots' : ''; el.classList.toggle('full', !!counts && n >= cap); });
  const s = document.createElement('script'); s.src = t.endpoint + '?callback=showSlots&t=' + Date.now(); s.onerror = () => window.showSlots(null); document.head.appendChild(s);
  const setErr = (el, m) => { el.parentElement.querySelector('.err').textContent = m; };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const d = { name: $('#n').value.trim(), email: $('#e').value.trim(), phone: $('#p').value.trim(), skill: (form.querySelector('input[name=skill]:checked') || {}).value || '' };
    let ok = true; const chk = (bad, el, m) => { setErr(el, bad ? m : ''); if (bad) ok = false; };
    chk(d.name.length < 2, $('#n'), 'Enter your full name.'); chk(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email), $('#e'), 'Enter a valid email, like you@example.com.');
    chk(d.phone.replace(/\D/g, '').length < 7, $('#p'), 'Enter a phone number with at least 7 digits.'); $('#skillErr').textContent = d.skill ? '' : 'Choose your skill level.'; if (!d.skill) ok = false;
    if (!ok) return;
    const btn = $('#go'); $('#sendErr').textContent = ''; btn.disabled = true; btn.textContent = 'Submitting...';
    try {
      const r = await fetch(t.endpoint, { method: 'POST', body: new URLSearchParams(d) }), out = await r.json();
      if (out.result !== 'success') throw new Error(out.message || 'Script error');
      $('#reg').innerHTML = thanksHtml(); $('#reg').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (err) { $('#sendErr').textContent = 'Your registration didn\'t go through (' + err.message + '). Check your connection and try again.'; btn.disabled = false; btn.textContent = 'Submit registration'; }
  });
}

// ---------- the other tabs ----------
const drawPage = () => '<iframe id="tool" class="tool" src="schedule.html" title="Draw & Schedule tool"></iframe>';
const queuePage = () => '<h1>Queuing Tool</h1><div class="card soon-card" style="margin-top:14px"><div class="big">🏸</div><h1 style="font-size:24px">Coming next</h1><p class="lead" style="margin:6px auto 0">We\'ll build the club queuing system here after the tournaments section is done.</p></div>';

// ---------- router (no page reloads, so the bar stays and switching feels instant) ----------
function route() {
  clearInterval(timer);
  const parts = (location.hash.replace(/^#\/?/, '') || 'tournaments').split('/'), page = parts[0], t = T.find(x => x.id === parts[1]);
  const tab = (page === 'tournament' || page === 'new') ? 'tournaments' : page;
  document.querySelectorAll('.seg a').forEach(a => a.classList.toggle('on', a.dataset.p === tab));
  const v = $('#view'), main = $('#main');
  main.classList.toggle('wide', page === 'draw');
  v.className = 'view';
  v.innerHTML = page === 'draw' ? drawPage() : page === 'queue' ? queuePage() : page === 'new' ? newPage() : (page === 'tournament' && t) ? eventPage(t) : listPage();
  document.title = (page === 'tournament' && t ? t.name + ' · ' : '') + 'Challenge - Tournament Management by Ai Jason Clark';
  requestAnimationFrame(() => v.classList.add('in'));
  window.scrollTo(0, 0);
  if (page === 'tournament' && t) initEvent(t);
  if (page === 'new') initNew();
  if (page === 'draw') $('#tool').addEventListener('load', () => { try { $('#tool').contentDocument.documentElement.dataset.theme = 'light'; } catch (e) {} });
}
window.addEventListener('hashchange', route);
function chip(){ const c = $('#chip'); if (!c) return; if (!(P && P.configured)) { c.innerHTML = ''; return; }
  c.innerHTML = P.user ? '<span class="em">' + esc(P.user.email) + '</span><button id="so">Sign out</button>' : '<a href="#/draw">Sign in</a><a class="reg" href="#/draw">Create account</a>';
  const b = $('#so'); if (b) b.onclick = () => P.signOut(); }
if (P && P.configured) P.onAuth(async () => { try { isOrg = await P.isOrganizer(); } catch (e) { isOrg = false; } chip(); if (/^#\/(tournaments)?$/.test(location.hash) || !location.hash) route(); }); chip();
route();
</script>
