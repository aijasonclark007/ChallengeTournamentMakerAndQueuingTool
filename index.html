<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const P = window.Platform, cloud = !!(P && P.configured);
let timer = null, rt = 0;
$('#yr').textContent = new Date().getFullYear();

const setView = (html) => { hideTools(); const v = $('#view'); v.className = 'view'; v.innerHTML = html; requestAnimationFrame(() => v.classList.add('in')); window.scrollTo(0, 0); };

// ---------- account (sign in / create account) ----------
function accountPage(next) {
  const eye = id => '<button class="eye" type="button" data-eye="' + id + '" aria-label="Show password">Show</button>';
  const pw = (id, label, ph, ac) => '<div class="fld"><label class="f" for="' + id + '">' + label + '</label><div class="pwrow"><input id="' + id + '" type="password" autocomplete="' + ac + '" placeholder="' + ph + '">' + eye(id) + '</div></div>';
  return '<div class="authwrap"><div class="atabs" id="atabs" role="tablist"><button type="button" data-face="in" role="tab">Sign in</button><button type="button" data-face="up" role="tab">Create account</button><i class="athumb"></i></div>' +
    '<div class="flip"><div class="flipin" id="flipin">' +
    '<form class="card pad face" id="fin" novalidate><h1 style="font-size:28px">Welcome back</h1><p class="lead">Sign in to save your queuings and schedules.</p>' +
      '<div class="fld"><label class="f" for="ie">Email</label><input id="ie" type="email" autocomplete="username" placeholder="you@example.com"></div>' + pw('ip', 'Password', 'Your password', 'current-password') +
      '<p class="err" id="ierr"></p><div class="acts"><button class="btn sm" id="isub" type="submit">Sign in</button><button class="btn sm ghost" id="ifg" type="button">Forgot password?</button></div>' +
      '<p class="swap">New here? <button type="button" class="linkchip" data-face="up">Create an account</button></p></form>' +
    '<form class="card pad face flipback" id="fup" novalidate><h1 style="font-size:28px">Create your account</h1><p class="lead">A free account to save your queuings and schedules.</p>' +
      '<div class="fld"><label class="f" for="ue">Email</label><input id="ue" type="email" autocomplete="username" placeholder="you@example.com"></div>' + pw('up1', 'Password', 'At least 8 characters', 'new-password') +
      '<div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i></div><div class="small hint" id="mtxt"></div>' + pw('up2', 'Re-type password', 'Type it again', 'new-password') + '<div class="small hint" id="mmatch"></div>' +
      '<p class="err" id="uerr"></p><div class="acts"><button class="btn sm" id="usub" type="submit">Create account</button></div>' +
      '<p class="swap">Already have an account? <button type="button" class="linkchip" data-face="in">Sign in</button></p></form>' +
    '</div></div></div>';
}
function initAccount(next) {
  const wrap = $('.authwrap'), fl = $('#flipin'), fin = $('#fin'), fup = $('#fup');
  const ie = $('#ie'), ue = $('#ue');
  const say = (id, m, ok) => { const e = $(id); if (!e) return; e.textContent = m || ''; e.style.color = ok ? '#1E8E3E' : ''; };
  let face = next === 'new' ? 'up' : 'in';
  const show = (f, quiet) => {                                  // flip the card over to the other side
    if (!quiet) { if (f === 'up' && ie.value && !ue.value) ue.value = ie.value; if (f === 'in' && ue.value && !ie.value) ie.value = ue.value; }
    face = f; fl.classList.toggle('flipped', f === 'up');
    fin.inert = f === 'up'; fup.inert = f === 'in'; fin.setAttribute('aria-hidden', f === 'up'); fup.setAttribute('aria-hidden', f === 'in');
    $$('#atabs button').forEach(b => b.classList.toggle('on', b.dataset.face === f)); $('#atabs').dataset.on = f;
    say('#ierr', ''); say('#uerr', '');
    if (!quiet) setTimeout(() => { const el = f === 'up' ? (ue.value ? $('#up1') : ue) : (ie.value ? $('#ip') : ie); el.focus({ preventScroll: true }); }, 480);
  };
  $$('[data-face]').forEach(b => b.onclick = () => show(b.dataset.face));
  $$('[data-eye]').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.eye), on = i.type === 'password'; i.type = on ? 'text' : 'password'; b.textContent = on ? 'Hide' : 'Show'; b.setAttribute('aria-label', on ? 'Hide password' : 'Show password'); });
  show(face, true);
  if (cloud && P.recoveryError && P.recoveryError()) say('#ierr', P.recoveryError());
  // live feedback while creating the account: strength and match
  const strength = p => (p.length >= 8 ? 1 : 0) + (/[A-Z]/.test(p) && /[a-z]/.test(p) ? 1 : 0) + (/\d/.test(p) || /[^A-Za-z0-9]/.test(p) ? 1 : 0) + (p.length >= 12 ? 0 : 0);
  const feel = () => {
    const p = $('#up1').value, q = $('#up2').value, st = p.length < 8 ? 0 : Math.max(1, strength(p)), lab = ['', 'Weak', 'Okay', 'Strong'];
    $$('#meter i').forEach((b, k) => { b.className = k < st ? 's' + st : ''; });
    $('#mtxt').textContent = !p ? '' : p.length < 8 ? (8 - p.length) + ' more character' + (8 - p.length === 1 ? '' : 's') + ' needed' : lab[st] + ' password';
    const m = $('#mmatch'); m.textContent = !q ? '' : q === p ? '✓ Passwords match' : 'Passwords do not match yet'; m.style.color = !q ? '' : q === p ? '#1E8E3E' : '#D70015';
  };
  $('#up1').oninput = feel; $('#up2').oninput = feel;
  if (!cloud) { say('#ierr', 'The cloud is not connected yet. Add your Supabase URL and key in platform-config.js.'); say('#uerr', 'The cloud is not connected yet.'); return; }
  const go = async () => { await new Promise(r => { const i = setInterval(() => { if (P.user) { clearInterval(i); r(); } }, 50); setTimeout(() => { clearInterval(i); r(); }, 3000); }); location.hash = '#/' + (next || 'mine'); };
  fin.addEventListener('submit', async e => { e.preventDefault(); say('#ierr', '');
    if (!ie.value.trim() || !$('#ip').value) return say('#ierr', 'Enter your email and password.');
    $('#isub').disabled = true; try { await P.signIn(ie.value, $('#ip').value); await go(); } catch (x) { say('#ierr', x.message); } $('#isub').disabled = false; });
  fup.addEventListener('submit', async e => { e.preventDefault(); say('#uerr', '');
    const em = ue.value.trim(), p = $('#up1').value, q = $('#up2').value;
    if (!/^\S+@\S+\.\S+$/.test(em)) return say('#uerr', 'Enter a valid email.');
    if (p.length < 8) return say('#uerr', 'Your password needs at least 8 characters.');
    if (p !== q) return say('#uerr', 'The two passwords do not match.');
    $('#usub').disabled = true;
    try {
      const r = await P.signUp(em, p);
      if (r === 'signed-in') { await go(); return; }
      fup.innerHTML = '<div class="sentok"><div class="env">✉️</div><h1 style="font-size:26px">Check your email</h1><p class="lead">We sent a confirmation link to <b>' + esc(em) + '</b>. Open it, then come back and sign in.</p><div class="acts" style="justify-content:center"><button class="btn sm" id="backin" type="button">Back to sign in</button></div></div>';
      $('#backin').onclick = () => { ie.value = em; show('in'); };
    } catch (x) { say('#uerr', x.message); $('#usub').disabled = false; }
  });
  $('#ifg').onclick = async () => { say('#ierr', ''); if (!ie.value.trim()) return say('#ierr', 'Type your email first, then press Forgot password.');
    try { await P.resetPassword(ie.value); say('#ierr', 'If that email has an account, a reset link is on its way. Open it on this device to choose a new password.', true); } catch (x) { say('#ierr', x.message); } };
}
// ---------- choose a new password (opened from the reset email) ----------
function resetPage() {
  const pw = (id, label, ph) => '<div class="fld"><label class="f" for="' + id + '">' + label + '</label><div class="pwrow"><input id="' + id + '" type="password" autocomplete="new-password" placeholder="' + ph + '"><button class="eye" type="button" data-eye="' + id + '" aria-label="Show password">Show</button></div></div>';
  return '<div class="authwrap"><form class="card pad" id="rf" novalidate><h1 style="font-size:28px">Choose a new password</h1><p class="lead" id="rlead">Checking your reset link\u2026</p>' +
    '<div id="rbody" class="hidden">' + pw('rp1', 'New password', 'At least 8 characters') + '<div class="meter" id="rmeter" aria-hidden="true"><i></i><i></i><i></i></div><div class="small hint" id="rtxt"></div>' +
    pw('rp2', 'Re-type new password', 'Type it again') + '<div class="small hint" id="rmatch"></div>' +
    '<p class="err" id="rerr"></p><div class="acts"><button class="btn sm" id="rsub" type="submit">Save new password</button></div></div>' +
    '<div id="rdead" class="hidden"><p class="err" id="rdmsg"></p><div class="acts"><a class="btn sm" href="#/account">Back to sign in</a></div></div></form></div>';
}
async function initReset() {
  const lead = $('#rlead'), body = $('#rbody'), dead = $('#rdead');
  const dieWith = m => { lead.textContent = ''; $('#rdmsg').textContent = m; dead.classList.remove('hidden'); body.classList.add('hidden'); };
  if (!cloud) return dieWith('The cloud is not connected yet.');
  if (P.recoveryError()) return dieWith(P.recoveryError());
  // the link signs you in for a moment: wait for that session before showing the form
  const ok = await new Promise(r => { const t0 = Date.now(), i = setInterval(() => { if (P.user) { clearInterval(i); r(true); } else if (Date.now() - t0 > 5000) { clearInterval(i); r(false); } }, 80); });
  if (!ok) return dieWith('This reset link has expired or was already used. Request a new one from the sign in page.');
  lead.textContent = 'Signed in as ' + P.user.email + '. Pick a new password.'; body.classList.remove('hidden'); $('#rp1').focus();
  $$('[data-eye]').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.eye), on = i.type === 'password'; i.type = on ? 'text' : 'password'; b.textContent = on ? 'Hide' : 'Show'; });
  const feel = () => {
    const p = $('#rp1').value, q = $('#rp2').value, st = p.length < 8 ? 0 : 1 + (/[A-Z]/.test(p) && /[a-z]/.test(p) ? 1 : 0) + (/\d|[^A-Za-z0-9]/.test(p) ? 1 : 0), lab = ['', 'Weak', 'Okay', 'Strong'];
    $$('#rmeter i').forEach((b, k) => { b.className = k < st ? 's' + st : ''; });
    $('#rtxt').textContent = !p ? '' : p.length < 8 ? (8 - p.length) + ' more character' + (8 - p.length === 1 ? '' : 's') + ' needed' : lab[Math.max(1, st)] + ' password';
    const m = $('#rmatch'); m.textContent = !q ? '' : q === p ? '\u2713 Passwords match' : 'Passwords do not match yet'; m.style.color = !q ? '' : q === p ? '#1E8E3E' : '#D70015';
  };
  $('#rp1').oninput = () => { feel(); $('#rerr').textContent = ''; }; $('#rp2').oninput = () => { feel(); $('#rerr').textContent = ''; };
  $('#rf').addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#rerr'); err.textContent = ''; err.style.color = '';
    const p = $('#rp1').value, q = $('#rp2').value;
    if (p.length < 8) return err.textContent = 'Your password needs at least 8 characters.';
    if (p !== q) return err.textContent = 'The two passwords do not match.';
    $('#rsub').disabled = true;
    try {
      await P.updatePassword(p);
      body.classList.add('hidden'); lead.innerHTML = '';
      $('#rf').insertAdjacentHTML('beforeend', '<div class="sentok"><div class="env">\u2705</div><h1 style="font-size:26px">Password updated</h1><p class="lead">You are signed in. Next time, sign in with your new password.</p><div class="acts" style="justify-content:center"><a class="btn sm" href="#/sports">Continue</a></div></div>');
      setTimeout(() => { if (!location.hash || location.hash === '#/reset' || /access_token/.test(location.hash)) location.hash = '#/sports'; }, 2200);
    } catch (x) { err.textContent = x.message; $('#rsub').disabled = false; }
  });
}
// pages that need a signed-in user
const SPORTS = Sports.list().map(r => [r.key, r.icon, r.name, r.blurb]);
const getSport = Sports.current;
function sportsPage() {
  const cur = getSport();
  return '<div class="head"><div><h1>Choose your sport</h1><p class="lead">Everything you create next starts with this sport. You can still change it inside each tool.</p></div></div>' +
    '<div class="sportgrid">' + SPORTS.map(([k, ic, n, d]) => '<button type="button" class="sportcard' + (cur === k ? ' on' : '') + '" data-sport="' + k + '"><span class="sic">' + ic + '</span><b>' + n + '</b><small>' + d + '</small><span class="stick">\u2713</span></button>').join('') + '</div>' +
    '<div class="sportgo"><a class="btn" href="#/score">Score a match</a><a class="btn ghost" href="#/draw">Tournament Draw &amp; Schedule Matches</a><a class="btn ghost" href="#/queue">Queuing Tool</a></div>';
}
const setLogo = () => { const l = $('#logo'); if (l) l.innerHTML = Sports.get(getSport()).logo; };
setLogo();
window.addEventListener('storage', e => { if (e.key === 'sport') setLogo(); });
const closeSpMenu = () => { const m = $('#spMenu'); if (m) m.hidden = true; const l = $('#logo'); if (l) l.setAttribute('aria-expanded', 'false'); };
const openSpMenu = () => {
  const m = $('#spMenu'), cur = getSport();
  m.innerHTML = Sports.list().map(r => '<button type="button" data-pick="' + r.key + '"><span class="mi">' + r.logo + '</span>' + r.name + (cur === r.key ? '<span class="ck">\u2713</span>' : '') + '</button>').join('');
  m.hidden = false; $('#logo').setAttribute('aria-expanded', 'true');
  m.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { try { localStorage.setItem('sport', b.dataset.pick); } catch (e) {} setLogo(); closeSpMenu(); try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} if (typeof initSports === 'function') { const sp = document.querySelector('.sportgrid'); if (sp) sp.querySelectorAll('[data-sport]').forEach(x => x.classList.toggle('on', x.dataset.sport === b.dataset.pick)); } });
};
$('#logo').addEventListener('click', e => { e.stopPropagation(); $('#spMenu').hidden ? openSpMenu() : closeSpMenu(); });
document.addEventListener('click', e => { if (!e.target.closest('#spMenu')) closeSpMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSpMenu(); });
function initSports() {
  $$('[data-sport]').forEach(b => b.onclick = () => { try { localStorage.setItem('sport', b.dataset.sport); } catch (e) {} $$('[data-sport]').forEach(x => x.classList.toggle('on', x === b)); setLogo(); try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} });
}
const TOOLS = { score: ['u.html?quick=1', 'Scoring'], draw: ['schedule.html', 'Draw & Schedule tool'], queue: ['queue.html', 'Queuing Tool'] };
function ensureTool(name) {
  let f = $('#tool-' + name);
  if (!f) {
    f = document.createElement('iframe'); f.id = 'tool-' + name; f.className = 'tool'; f.title = TOOLS[name][1]; f.style.display = 'none';
    f.addEventListener('load', () => { f.dataset.ready = '1'; try { f.contentDocument.documentElement.dataset.theme = 'light'; } catch (e) {} });
    f.src = TOOLS[name][0]; $('#tools').appendChild(f);
  }
  return f;
}
const setHdr = () => { const b = document.querySelector('header.bar'); if (b) document.documentElement.style.setProperty('--hdr', b.offsetHeight + 'px'); };
window.addEventListener('resize', setHdr);
// the tools tell us when their tab changes, so the address (and the Back button) follows them; links like #/queue/players open that tab
window.addEventListener('message', e => {
  if (e.origin !== location.origin) return; const d = e.data;
  if (d && d.t === 'full') { scoringOn = !!d.on; applyFull(); }   // the scoring screen takes over the whole phone while a match is on
  if (d && d.t === 'tab' && (d.tool === 'queue' || d.tool === 'draw')) { const hh = '#/' + d.tool + '/' + d.tab; if (location.hash !== hh) history.pushState(null, '', hh); }
  if (d && d.t === 'sendQueue' && Array.isArray(d.players)) {      // Draw & Schedule -> Queuing Tool
    const f = ensureTool('queue'), go = () => { try { f.contentWindow.postMessage({ t: 'import', players: d.players }, location.origin); } catch (x) {} };
    history.pushState(null, '', '#/queue/players'); route(); if (f.dataset.ready) setTimeout(go, 350); else f.addEventListener('load', () => setTimeout(go, 600), { once: true });
  }
});
function gotoTool(name, arg) {
  const f = ensureTool(name), send = () => { try { f.contentWindow.postMessage({ t: 'goto', tab: arg }, location.origin); } catch (x) {} };
  if (f.dataset.ready) send(); else f.addEventListener('load', send, { once: true });
}
let scoringOn = false, shownTool = null;
function applyFull() { const on = scoringOn && shownTool === 'score'; document.documentElement.classList.toggle('scoring-full', on); try { document.querySelector('meta[name=theme-color]').content = on ? '#007AFF' : '#F2F2F7'; } catch (x) {} }   // the scoring screen takes over the whole phone while a match is on
function showTool(name, arg) {
  shownTool = name; applyFull();
  ensureTool(name); $('#view').style.display = 'none'; $('#tools').style.display = '';
  document.documentElement.classList.add('tool-mode'); setHdr(); if (arg) gotoTool(name, arg);
  Object.keys(TOOLS).forEach(n => { const x = $('#tool-' + n); if (x) x.style.display = n === name ? '' : 'none'; });   // going from hidden to shown replays the pop-in
  window.scrollTo(0, 0);
}
function hideTools() { shownTool = null; applyFull(); $('#tools').style.display = 'none'; $('#view').style.display = ''; document.documentElement.classList.remove('tool-mode'); }

// ---------- router (no page reloads, so the bar stays and switching feels instant) ----------
let prevTab = 'sports', lastNav = null;
function placeNavThumb(animate) {
  const th = document.querySelector('.nthumb'), on = document.querySelector('nav.seg a.on'); if (!th || !on) return;
  const x = on.offsetLeft, w = on.offsetWidth, prev = lastNav;
  th.style.width = w + 'px'; th.style.transform = 'translateX(' + x + 'px)'; lastNav = { x, w };
  if (th._a) { th._a.cancel(); th._a = null; }
  if (animate && prev && (prev.x !== x || prev.w !== w) && th.animate && !matchMedia('(prefers-reduced-motion:reduce)').matches)
    th._a = th.animate([{ transform: 'translateX(' + prev.x + 'px) scaleX(' + (prev.w / w) + ')' }, { transform: 'translateX(' + x + 'px) scaleX(1)' }], { duration: 420, easing: 'cubic-bezier(.22,1,.36,1)' });
}
window.addEventListener('resize', () => placeNavThumb(false));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => placeNavThumb(false));
async function route() {
  clearInterval(timer);
  const tok = ++rt, parts = (location.hash.replace(/^#\/?/, '') || 'sports').split('/'), page = parts[0], arg = parts[1] ? decodeURIComponent(parts[1]) : '';
  const tab = ['score', 'draw', 'queue'].includes(page) ? page : 'sports';
  document.querySelectorAll('.seg a').forEach(a => a.classList.toggle('on', a.dataset.p === tab));
  const order = ['sports', 'score', 'draw', 'queue'], dir = Math.sign(order.indexOf(tab) - order.indexOf(prevTab)); prevTab = tab;
  $('#view').style.setProperty('--tx', (dir * 48) + 'px'); placeNavThumb(true);
  $('#main').classList.toggle('wide', page === 'score' || page === 'draw' || page === 'queue');
  document.title = 'Challenge - Tournament Manager by Ai Jason Clark';
  if (tok !== rt) return;
  if (page === 'score' || page === 'draw' || page === 'queue') { showTool(page, arg); return; }
  if (page === 'reset' || (cloud && P.recoveryPending && P.recoveryPending())) { setView(resetPage()); return initReset(); }   // came from a password-reset email (don't touch the hash yet: supabase is still reading the token from it)
  if (page === 'account') { setView(accountPage(arg)); return initAccount(arg); }
  setView(sportsPage()); initSports();
}
window.addEventListener('hashchange', route);
setTimeout(() => Object.keys(TOOLS).forEach(ensureTool), 1200);     // warm up both tools while the person looks at the first page

// ---------- account chip in the header ----------
function chip() {
  const c = $('#acct'); if (!c) return; if (!cloud) { c.innerHTML = ''; return; }
  c.innerHTML = P.user ? '<span class="em">' + esc(P.user.email) + '</span><button id="so" type="button">Sign out</button>' : '<a href="#/account">Sign in</a><a class="reg" href="#/account/new">Create account</a>';
  const b = $('#so'); if (b) b.onclick = async () => { await P.signOut(); location.hash = '#/sports'; };
}
if (cloud) P.onAuth(async () => { chip(); });
chip();
route();
</script>
</body>
