<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standings TV - Challenge Match Day</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
html,body{margin:0;height:100%;background:#F2F2F7;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
iframe{border:0;width:100%;flex:1;min-height:0;display:block}
.msg{color:#3A3A40;padding:40px 24px;text-align:center;font-size:clamp(18px,3vw,34px);font-weight:700}
#ctl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 12px;border-radius:18px;background:rgba(11,18,32,.88);box-shadow:0 8px 28px rgba(0,0,0,.5);transition:opacity .4s;max-width:96vw}
#ctl.hide{opacity:0;pointer-events:none}
#ctl button,#ctl select{font:700 14px/1 system-ui,sans-serif;border:0;border-radius:11px;padding:11px 14px;background:#1F2C4A;color:#fff;cursor:pointer}
#ctl button.go{background:#007AFF}#ctl label{color:#9FB0CC;font:600 12px system-ui,sans-serif;display:flex;align-items:center;gap:6px}
#ann{flex:none;margin:1vh 2vw 0;background:#FF9500;color:#1b1200;border-radius:2vh;padding:1.4vh 2vw;font-weight:800;font-size:clamp(22px,3.6vw,56px);display:none;text-align:center}
</style>
</head>
<body>
<div id="ann"></div>
<div id="m" class="msg">Loading the standings...</div>
<div id="ctl" class="hide">
  <button type="button" id="bPrev" title="Previous bracket (Left arrow)">&#9664;</button>
  <button type="button" id="bPlay" class="go" title="Pause or play (Space)">Pause</button>
  <button type="button" id="bNext" title="Next bracket (Right arrow)">&#9654;</button>
  <label>Each bracket for <select id="sSec"><option>6</option><option>8</option><option>10</option><option>12</option><option>15</option><option>20</option><option>30</option><option>45</option><option>60</option></select> s</label>
  <label>Show <select id="sLvl"><option value="all">All levels</option><option>Low</option><option>Mid</option><option>High</option></select></label>
  <button type="button" id="bFull" title="Full screen (F)">&#9974; Full screen</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="platform-config.js"></script>
<script src="platform.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), slug = q.get('s'), m = document.getElementById('m'), $ = s => document.querySelector(s), P = window.Platform;
  if (!slug) { m.textContent = 'This link is incomplete. Use the public schedule link with tvstandings.html instead of s.html.'; return; }
  if (!P || !P.configured) { m.textContent = 'The cloud is not connected.'; return; }
  const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let sec = +(q.get('sec') || LS.get('tvs.sec') || 12), level = q.get('level') || LS.get('tvs.level') || 'all', paused = false, idx = 0;
  if (!(sec >= 3 && sec <= 300)) sec = 12; if (!/^(all|Low|Mid|High)$/.test(level)) level = 'all';

  // ---- runs INSIDE the published page (sandboxed frame): shows ONE bracket at a time, sized to fill the screen, on a timer ----
  function frameScript(cfg) {
    var H = document.documentElement, sec = cfg.sec, level = cfg.level, cur = cfg.idx | 0, paused = !!cfg.paused, tm = 0, ft = 0, LIVE = {}, ORD = ['Low', 'Mid', 'High'];
    H.classList.add('tvs');
    var bar = document.createElement('div'); bar.id = 'tvsbar'; bar.innerHTML = '<div class="tvl"></div><div class="tvd"></div><div class="tvp"><i></i></div>';
    var ko = document.createElement('div'); ko.id = 'tvko';
    function E(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function winOf(r) { return r && r.a !== r.b ? (r.a > r.b ? 0 : 1) : -1; }
    function readKo() {                                               // the knockout games of the published schedule, plus live scores
      var by = {};
      [].forEach.call(document.querySelectorAll('#viewSch .game[data-mid^="k:"]'), function (g) {
        var m = /^k:KO-(.+)-R(\d+)-(\d+)$/.exec(g.dataset.mid); if (!m) return;
        var tms = g.querySelectorAll('.tm'), sm = g.querySelector('.info small'), lv = sm && sm.querySelector('.lv'), tx = sm ? sm.textContent : '', lt = lv ? lv.textContent : '';
        var slot = g.closest('.slot'), h3 = slot && slot.querySelector('h3'), t = function (el) { var x = el ? el.textContent.trim() : ''; return !x || /^to be decided$/i.test(x) ? null : x; };
        var L = LIVE[g.dataset.mid], r = null, st = '';
        if (L && (L.status === 'done' || L.status === 'live')) { r = { a: +L.s1, b: +L.s2 }; st = L.status; }
        else { var mm = /(\d+)\s*-\s*(\d+)/.exec((g.querySelector('.res') || {}).textContent || ''); if (mm) { r = { a: +mm[1], b: +mm[2] }; st = 'done'; } }
        (by[m[1]] = by[m[1]] || []).push({ id: g.dataset.mid, level: m[1], rd: +m[2], n: +m[3], rname: lt && tx.indexOf(lt) === 0 ? tx.slice(lt.length) : tx, t: [t(tms[0]), t(tms[1])], r: r, st: st, court: (g.querySelector('.ct') || {}).textContent || '', time: h3 ? h3.textContent.split(' - ')[0] : '' });
      });
      return by;
    }
    function koHtml(by, l) {
      var html = '';
      [l].forEach(function (l) {
        var ms = by[l], rounds = {}, R = 0;
        ms.forEach(function (m) { (rounds[m.rd] = rounds[m.rd] || []).push(m); if (m.rd > R) R = m.rd; });
        for (var r = 1; r <= R; r++) if (rounds[r]) rounds[r].sort(function (x, y) { return x.n - y.n; });
        for (var r2 = 1; r2 < R; r2++) {                              // winners move on right away (when no BYE makes the pairing unclear)
          var A = rounds[r2], B = rounds[r2 + 1]; if (!A || !B || A.length !== 2 * B.length) continue;
          B.forEach(function (m, i) { [0, 1].forEach(function (k) { var f = A[2 * i + k], w = f && f.st === 'done' ? winOf(f.r) : -1; if (!m.t[k] && w >= 0) m.t[k] = f.t[w]; }); });
        }
        var cols = '';
        for (var q = 1; q <= R; q++) {
          if (!rounds[q]) continue;
          cols += '<div class="kc"><div class="kh">' + E(rounds[q][0].rname) + '</div><div class="kg">' + rounds[q].map(function (m) {
            var w = m.st === 'done' ? winOf(m.r) : -1, fin = m.rname === 'Finals';
            var row = function (k) { return '<div class="kt' + (w === k ? ' w' : w >= 0 ? ' l' : '') + '"><span class="n">' + (fin && w === k ? '&#127942; ' : '') + (m.t[k] ? E(m.t[k]) : '<em>To be decided</em>') + '</span><b>' + (m.r ? m.r[k ? 'b' : 'a'] : '') + '</b></div>'; };
            return '<div class="km' + (m.st === 'live' ? ' lv' : '') + '">' + row(0) + row(1) + '<small>' + (m.st === 'live' ? '<u>LIVE</u> ' : '') + E(m.court) + (m.time ? ' &middot; ' + E(m.time) : '') + '</small></div>';
          }).join('') + '</div></div>';
        }
        html += '<div class="kl" style="flex-grow:' + Math.max(1, (rounds[1] || ms).length) + '"><div class="kv lvl' + l + '"><span>' + E(l) + '</span></div>' + cols + '</div>';
      });
      return html;
    }
    function slides() {                                           // per level: its standings, then its own knockout chart
      var by = readKo(), out = [];
      ORD.forEach(function (l) {
        if (level !== 'all' && level !== l) return;
        [].forEach.call(document.querySelectorAll('#viewStd .sb'), function (g) { if (g.dataset.level === l) out.push({ sb: g }); });
        if (by[l]) out.push({ ko: ko, lv: l, by: by });
      });
      return out;
    }
    function say(n) { try { parent.postMessage({ t: 'tvs', i: cur, n: n, paused: paused }, '*'); } catch (e) {} }
    function fit() {                                                  // the biggest text size at which the slide still fits the screen
      var g = document.querySelector('#viewStd .sb.cur') || (ko.classList.contains('cur') ? ko : null); if (!g) return;
      var rows = g === ko ? 10 : (g.querySelectorAll('.srow').length || 1), lo = 5, hi = Math.max(lo, Math.min(innerHeight / (rows + 2.2) / 4.4, innerWidth / 38));
      if (g === ko) hi = Math.max(lo, Math.min(innerHeight / 14, innerWidth / 50));
      var parts = g === ko ? [].slice.call(ko.querySelectorAll('.kl,.kc,.kg')).concat([ko]) : [g];
      var ok = function (u) { H.style.setProperty('--u', u + 'px'); return parts.every(function (x) { return x.scrollHeight <= x.clientHeight + 1 && x.scrollWidth <= x.clientWidth + 1; }); };
      if (!ok(hi)) { for (var i = 0; i < 14; i++) { var mid = (lo + hi) / 2; if (ok(mid)) lo = mid; else hi = mid; } ok(lo); }
    }
    function sched() { cancelAnimationFrame(ft); ft = requestAnimationFrame(fit); }
    function mark(ss) {
      [].forEach.call(document.querySelectorAll('#viewStd .sb'), function (g) { g.classList.remove('cur'); });
      ko.classList.remove('cur'); var s = ss[cur]; if (!s) return;
      if (s.ko) ko.innerHTML = koHtml(s.by, s.lv); (s.sb || s.ko).classList.add('cur'); H.classList.toggle('tvko', !!s.ko);
    }
    function paintBar(ss) {
      var s = ss[cur], l = bar.querySelector('.tvl'), d = bar.querySelector('.tvd');
      l.textContent = s ? (s.ko ? s.lv + ' knockout chart' : (s.sb.querySelector('.sbh b') || {}).textContent || '') + '   ' + (cur + 1) + ' of ' + ss.length : '';
      d.innerHTML = ss.map(function (x, k) { return '<i' + (k === cur ? ' class="on"' : '') + '></i>'; }).join('');
    }
    function restart() {
      clearTimeout(tm); var p = bar.querySelector('.tvp i'); p.style.transition = 'none'; p.style.width = '0'; void p.offsetWidth;
      if (paused) return;
      p.style.transition = 'width ' + sec + 's linear'; p.style.width = '100%'; tm = setTimeout(function () { go(cur + 1); }, sec * 1000);
    }
    function go(i) {
      var ss = slides(), n = ss.length; if (!n) { say(0); return; }
      cur = ((i % n) + n) % n; mark(ss); paintBar(ss); sched(); say(n); restart();
    }
    function refresh() { var ss = slides(); if (!ss.length) { say(0); return; } if (cur >= ss.length) cur = 0; mark(ss); paintBar(ss); sched(); say(ss.length); }
    window.addEventListener('message', function (e) {
      var d = e.data; if (!d) return;
      if (d.t === 'live' && e.source === parent) { var by = {}; (d.scores || []).forEach(function (x) { by[x.match_id] = x; }); LIVE = by; setTimeout(refresh, 30); return; }
      if (d.t !== 'tvc') return;
      if (d.cmd === 'next') go(cur + 1); else if (d.cmd === 'prev') go(cur - 1);
      else if (d.cmd === 'pause') { paused = true; restart(); } else if (d.cmd === 'play') { paused = false; restart(); }
      else if (d.cmd === 'sec') { sec = +d.v || sec; restart(); }
      else if (d.cmd === 'level') { level = d.v || 'all'; go(0); }
      if (d.cmd === 'pause' || d.cmd === 'play') say(slides().length);
    });
    window.addEventListener('resize', sched);
    window.addEventListener('load', function () {
      document.querySelector('.pub').appendChild(ko); document.body.appendChild(bar);
      var b = document.querySelector('.pub .tabs button[data-v="std"]'); if (b) b.click();
      var vd = document.getElementById('viewStd');
      if (vd && window.MutationObserver) new MutationObserver(function () { refresh(); }).observe(vd, { childList: true });     // scores arrived: the page redraws its standings
      setTimeout(function () { go(cur); }, 50); setTimeout(function () { go(cur); }, 600);
    });
  }
  const TVCSS = 'html.tvs,html.tvs body{overflow:hidden!important;background:#F2F2F7!important;margin:0}' +
    'html.tvs .pub{max-width:none!important;margin:0!important;padding:1.4vh 1.6vw 7vh!important;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;background:#F2F2F7}' +
    'html.tvs .pub>*:not(h1):not(#viewStd):not(#tvko){display:none!important}' +
    'html.tvs .pub h1{font-size:clamp(20px,3.8vh,48px)!important;margin:0 0 1vh!important}' +
    'html.tvs .pub #viewStd{display:flex!important;flex-direction:column;flex:1;min-height:0;animation:none!important;opacity:1!important;transform:none!important}' +
    'html.tvs.tvko .pub #viewStd{display:none!important}' +
    'html.tvs .pub #tvko{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}html.tvs .pub #tvko.cur{display:flex;animation:tvin .55s ease both}' +
    'html.tvs .pub #viewStd>.sb{display:none!important;margin:0!important}' +
    'html.tvs .pub #viewStd>.sb.cur{display:flex!important;flex-direction:column;flex:1;min-height:0;overflow:hidden;border-radius:calc(var(--u,12px)*1.6)!important;animation:tvin .55s ease both}' +
    '@keyframes tvin{from{opacity:0;transform:translateY(1.5vh)}to{opacity:1;transform:none}}' +
    'html.tvs .pub #viewStd>p,html.tvs .pub #viewStd>.upd{font-size:clamp(22px,4vh,54px)!important;text-align:center;margin:auto!important}' +
    'html.tvs .pub .sbh{padding:calc(var(--u,12px)*1) calc(var(--u,12px)*1.6)!important;gap:0 calc(var(--u,12px)*1.2)!important}' +
    'html.tvs .pub .sbh b{font-size:calc(var(--u,12px)*3.4)!important}html.tvs .pub .sbh span{font-size:calc(var(--u,12px)*1.7)!important}' +
    'html.tvs .pub .srow{flex:1;min-height:0;padding:calc(var(--u,12px)*.5) calc(var(--u,12px)*1.6)!important;gap:calc(var(--u,12px)*1.4)!important}' +
    'html.tvs .pub .rk{font-size:calc(var(--u,12px)*3)!important;min-width:calc(var(--u,12px)*3)!important;height:auto!important;width:auto!important;line-height:1!important}' +
    'html.tvs .pub .av{width:calc(var(--u,12px)*3.2)!important;height:calc(var(--u,12px)*3.2)!important;font-size:calc(var(--u,12px)*1.3)!important;line-height:calc(var(--u,12px)*3.2)!important}' +
    'html.tvs .pub .sn{font-size:calc(var(--u,12px)*2.6)!important;line-height:1.15!important}' +
    'html.tvs .pub .fm{margin-top:calc(var(--u,12px)*.3)!important}html.tvs .pub .fm i,html.tvs .pub .adv{font-size:calc(var(--u,12px)*1.3)!important}' +
    'html.tvs .pub .sw,html.tvs .pub .sp{min-width:calc(var(--u,12px)*5.4)!important}html.tvs .pub .sw b,html.tvs .pub .sp b{font-size:calc(var(--u,12px)*3.2)!important}html.tvs .pub .sw small,html.tvs .pub .sp small{font-size:calc(var(--u,12px)*1.3)!important}' +
    '#tvko .kl{flex:1 1 0;min-height:0;display:flex;gap:calc(var(--u,12px)*.8);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);border-radius:calc(var(--u,12px)*1.6);padding:calc(var(--u,12px)*.8);overflow:hidden}' +
    '#tvko .kv{flex:none;width:calc(var(--u,12px)*3);border-radius:calc(var(--u,12px)*.9);display:flex;align-items:center;justify-content:center;background:#1D2D52}#tvko .kv span{writing-mode:vertical-rl;transform:rotate(180deg);font:800 calc(var(--u,12px)*2)/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff}' +
    '#tvko .kv.lvlLow{background:#2E9E57}#tvko .kv.lvlMid{background:#D98A00}#tvko .kv.lvlHigh{background:#D6364A}' +
    '#tvko .kc{flex:1 1 0;min-width:0;display:flex;flex-direction:column}#tvko .kh{font:800 calc(var(--u,12px)*1.5)/1.1 system-ui,sans-serif;color:#5F5F66;text-transform:uppercase;letter-spacing:.08em;margin-bottom:calc(var(--u,12px)*.4)}' +
    '#tvko .kg{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:calc(var(--u,12px)*.5)}' +
    '#tvko .km{background:#F2F2F7;border-radius:calc(var(--u,12px)*.9);padding:calc(var(--u,12px)*.5) calc(var(--u,12px)*1);border:3px solid transparent}#tvko .km.lv{border-color:#FF3B30;background:#fff}' +
    '#tvko .kt{display:flex;justify-content:space-between;gap:calc(var(--u,12px)*.6);align-items:baseline;font:700 calc(var(--u,12px)*1.7)/1.2 system-ui,sans-serif;color:#1C1C1E}#tvko .kt .n{min-width:0;overflow-wrap:anywhere}#tvko .kt b{font-size:calc(var(--u,12px)*2)}' +
    '#tvko .kt.w{color:#1E8E3E}#tvko .kt.l{color:#8E8E93}#tvko .kt em{font-style:normal;color:#8E8E93;font-weight:600}' +
    '#tvko small{display:block;font:600 calc(var(--u,12px)*1.2)/1.2 system-ui,sans-serif;color:#6C6C72;margin-top:calc(var(--u,12px)*.2)}#tvko small u{text-decoration:none;color:#FF3B30;font-weight:800}' +
    '#tvsbar{position:fixed;left:0;right:0;bottom:0;height:6vh;display:flex;align-items:center;gap:2vw;padding:0 2vw;background:#F2F2F7;z-index:5;color:#3A3A40;font:700 clamp(14px,2.4vh,30px) system-ui,sans-serif}' +
    '#tvsbar .tvl{flex:none;white-space:pre}#tvsbar .tvd{display:flex;gap:.7vh;flex:1;flex-wrap:wrap;justify-content:flex-end}#tvsbar .tvd i{width:1.4vh;height:1.4vh;border-radius:50%;background:#C7C7CC}#tvsbar .tvd i.on{background:#007AFF;transform:scale(1.3)}' +
    '#tvsbar .tvp{position:absolute;left:0;right:0;top:0;height:.6vh;background:#E5E5EA}#tvsbar .tvp i{display:block;height:100%;width:0;background:#007AFF}';
  const wrap = (html, st) => {
    const inj = '<style>' + TVCSS + '</style><script>(' + frameScript.toString() + ')(' + JSON.stringify({ sec, level, idx: st.idx, paused }) + ');<\/script>';
    return /<\/head>/i.test(html) ? html.replace(/<\/head>/i, inj + '</head>') : inj + html;
  };

  let row; try { row = await P.getPublicSchedule(slug); } catch (e) { m.textContent = 'Could not load the schedule (' + (e.message || e) + ').'; return; }
  if (!row) { m.textContent = 'This schedule was not found. The organizer may have removed it.'; return; }
  document.title = row.name + ' - Standings TV';
  const f = document.createElement('iframe'); f.setAttribute('sandbox', 'allow-scripts');
  let lastHtml = row.html, lastVer = row.updated_at, n = 0, book = [], lastAnn = null;
  f.srcdoc = wrap(row.html, { idx }); m.remove(); document.body.appendChild(f);
  const toFrame = o => { try { f.contentWindow.postMessage(o, '*'); } catch (e) {} };
  const postLive = () => toFrame({ t: 'live', scores: book, moves: [] });
  f.addEventListener('load', postLive);
  window.addEventListener('message', e => { const d = e.data; if (e.source !== f.contentWindow || !d || d.t !== 'tvs') return; idx = d.i | 0; n = d.n | 0; $('#bPlay').textContent = d.paused ? 'Play' : 'Pause'; });

  // live scores (so the table changes as games finish), a newly published schedule, and the announcement banner
  const liveTick = async () => { if (document.hidden) return; try { book = await P.getLiveScores(slug) || []; postLive(); } catch (e) {} };
  const annTick = async () => { if (document.hidden) return; try { const a = await P.getAnnouncement(slug); const b = $('#ann'); if (a && a.body) { b.textContent = a.body; b.style.display = 'block'; } else b.style.display = 'none'; } catch (e) {} };
  const verTick = async () => {
    if (document.hidden) return;
    try {
      const v = await P.getScheduleVersion(slug); if (v && v === lastVer) return; if (v) lastVer = v;
      const r = await P.getPublicSchedule(slug); if (r && r.html && r.html !== lastHtml) { lastHtml = r.html; f.srcdoc = wrap(r.html, { idx }); }       // new page: comes back to the same bracket
    } catch (e) {}
  };
  liveTick(); annTick(); setInterval(liveTick, 8000); setInterval(annTick, 10000); setInterval(verTick, 45000);

  // controls (they hide by themselves so the TV shows only the standings)
  const ctl = $('#ctl'); let hideT = 0;
  const showCtl = () => { ctl.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => ctl.classList.add('hide'), 4000); };
  ['mousemove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, showCtl, { passive: true }));
  $('#sSec').value = String(sec); if ($('#sSec').value !== String(sec)) { const o = document.createElement('option'); o.textContent = sec; $('#sSec').appendChild(o); $('#sSec').value = String(sec); }
  $('#sLvl').value = level;
  $('#sSec').onchange = e => { sec = +e.target.value; LS.set('tvs.sec', String(sec)); toFrame({ t: 'tvc', cmd: 'sec', v: sec }); };
  $('#sLvl').onchange = e => { level = e.target.value; LS.set('tvs.level', level); toFrame({ t: 'tvc', cmd: 'level', v: level }); };
  $('#bPrev').onclick = () => toFrame({ t: 'tvc', cmd: 'prev' }); $('#bNext').onclick = () => toFrame({ t: 'tvc', cmd: 'next' });
  const togglePlay = () => { paused = !paused; $('#bPlay').textContent = paused ? 'Play' : 'Pause'; toFrame({ t: 'tvc', cmd: paused ? 'pause' : 'play' }); };
  $('#bPlay').onclick = togglePlay;
  const full = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {} };
  $('#bFull').onclick = full;
  document.addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) return;
    if (e.key === 'f' || e.key === 'F') full(); else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') toFrame({ t: 'tvc', cmd: 'next' }); else if (e.key === 'ArrowLeft') toFrame({ t: 'tvc', cmd: 'prev' });
  });
  setTimeout(showCtl, 600);
})();
</script>
</body>
</html>
